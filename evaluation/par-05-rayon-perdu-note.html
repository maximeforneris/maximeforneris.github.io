<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="stockage" content="coffre.evaluation : la clé d’accès de cet espace, le temps de l’onglet, ou sur l’appareil si l’on demande de s’en souvenir">
<title>Accès réservé</title>
<style>
:root{--fond:#f4f3ef;--carte:#fff;--encre:#1c1c1e;--doux:#5d5c58;--accent:#1f5fd0;--trait:#d9d6cf;--faux:#b3261e}
@media (prefers-color-scheme:dark){:root{--fond:#131315;--carte:#1d1d20;--encre:#eceae6;--doux:#a6a49f;--accent:#7aa7ff;--trait:#34343a;--faux:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:var(--fond);color:var(--encre);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:28px 24px;max-width:420px;width:100%}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 16px;color:var(--doux)}
label.cle{display:block;font-weight:600;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--trait);
 border-radius:9px;background:var(--fond);color:var(--encre)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.garder{display:flex;gap:9px;align-items:center;margin:12px 0 18px;color:var(--doux);font-size:15.5px}
.garder input{width:20px;height:20px}
button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:11px 18px;background:var(--accent);color:#fff;cursor:pointer;min-height:44px}
button[disabled]{opacity:.6}
.erreur{color:var(--faux);font-weight:600;margin:14px 0 0;min-height:1.5em}
.pied{font-size:14px;margin:18px 0 0}
</style></head>
<body><main>
<h1>Accès réservé</h1>
<p>Entrez la clé d’accès qui vous a été donnée en cours.</p>
<form id="f" autocomplete="off">
<label class="cle" for="k">La clé</label>
<input id="k" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<label class="garder"><input id="g" type="checkbox"> Se souvenir de la clé sur cet appareil</label>
<button id="b" type="submit">Ouvrir</button>
<p class="erreur" id="e" role="alert"></p>
</form>
<p class="pied">La page est chiffrée : sans la clé, elle ne se lit pas. La clé reste sur cet appareil ; rien n’est envoyé. <a href="../mentions-legales.html">Mentions légales</a></p>
</main>

<script>
(function(){

function oct(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u;}
function enB64(u){var s="";for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
function lue(){var l=[];try{l.push(sessionStorage.getItem(STO));}catch(x){}try{l.push(localStorage.getItem(STO));}catch(x){}
 for(var i=0;i<l.length;i++){try{var v=JSON.parse(l[i]);if(v&&v.sel===SEL&&v.k)return v.k;}catch(x){}}return null;}
function garder(k,long){var v=JSON.stringify({sel:SEL,k:k});try{sessionStorage.setItem(STO,v);}catch(x){}
 if(long){try{localStorage.setItem(STO,v);}catch(x){}}}

function dechiffrer(brute){
 return crypto.subtle.importKey("raw",brute,"AES-GCM",false,["decrypt"]).then(function(k){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:oct(IV)},k,oct(document.getElementById("c").textContent.trim()));
 }).then(function(t){return new TextDecoder().decode(t);});}

function deriver(mot){
 mot=mot.normalize("NFC").toLowerCase().replace(/\s+/g,"");
 return crypto.subtle.importKey("raw",new TextEncoder().encode(mot),"PBKDF2",false,["deriveBits"]).then(function(base){
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:oct(SEL),iterations:TOURS},base,256);
 }).then(function(bits){return new Uint8Array(bits);});}
if(!window.crypto||!crypto.subtle){e.textContent="Ce navigateur ne sait pas ouvrir la page. Ouvrez-la à son adresse en https, dans un navigateur à jour.";b.disabled=true;return;}

if(k){dechiffrer(oct(k)).then(function(h){charge(function(){montrer(h);});},function(){oublier();});}

 },function(){b.disabled=false;b.textContent="Ouvrir";e.textContent="Cette clé n’ouvre pas la page.";});
