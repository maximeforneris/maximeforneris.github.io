<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Dix minutes de lecture à deux, au CP, avec les sons de la classe.">
<meta name="stockage" content="lire-ensemble-v1 : les sons cochés, les réglages, les mots lus et l'album d'autocollants">
<title>Lire ensemble</title>
<style>
@font-face{font-family:"Andika";font-style:normal;font-weight:400;font-display:swap;src:url(assets/polices/andika-400-latin.woff2) format("woff2")}
@font-face{font-family:"Andika";font-style:normal;font-weight:700;font-display:swap;src:url(assets/polices/andika-700-latin.woff2) format("woff2")}
@font-face{font-family:"Playwrite FR Moderne";font-style:normal;font-weight:100 400;font-display:swap;src:url(assets/polices/playwrite-fr-moderne.woff2) format("woff2")}
/* Un cahier d'écolier : la page de lecture est une feuille Seyès, la pochette verte de la classe donne l'accent. */
:root{
  --fond:#eef1e8; --papier:#fffefb; --encre:#1e2532; --encre-2:#5a6271; --trait:#d9ddd2;
  --accent:#4e8a1e; --accent-fort:#3b6b13; --accent-pale:#e4efd6; --sur-accent:#ffffff;
  --seyes:#dcd8f0; --seyes-fort:#bdb6e2; --marge:#ec9d97;
  --muette:#a3a8b0; --arc:#3c4556; --syl1:#2160c4; --syl2:#c8372d;
  --ok:#2f8a4f; --ok-pale:#dff2e5; --encore:#c86f17; --encore-pale:#fbead6; --faux:#c8372d;
  --oeuf1:#d9534f; --oeuf2:#2e9e8f; --oeuf3:#ee9a3a;
  --ombre:0 1px 2px rgba(30,37,50,.06),0 6px 18px rgba(30,37,50,.07);
  --f-lecture:"Andika","Andika New Basic","Trebuchet MS",system-ui,sans-serif;
  --f-cursive:"Playwrite FR Moderne","Segoe Script","Brush Script MT",cursive;
  --f-ui:"Andika","Trebuchet MS",system-ui,sans-serif;
  --rayon:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --fond:#14181d; --papier:#1f242b; --encre:#eef0f3; --encre-2:#a9b1bc; --trait:#323943;
  --accent:#8cc152; --accent-fort:#a6d46e; --accent-pale:#26311c; --sur-accent:#14200a;
  --seyes:#2b2f45; --seyes-fort:#3b3f5e; --marge:#6e3431;
  --muette:#6f7680; --arc:#c3cad5; --syl1:#7fb0ff; --syl2:#ff8a80;
  --ok:#4cc27a; --ok-pale:#173325; --encore:#f0a04b; --encore-pale:#3a2a17; --faux:#ff8a80;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --fond:#14181d; --papier:#1f242b; --encre:#eef0f3; --encre-2:#a9b1bc; --trait:#323943;
  --accent:#8cc152; --accent-fort:#a6d46e; --accent-pale:#26311c; --sur-accent:#14200a;
  --seyes:#2b2f45; --seyes-fort:#3b3f5e; --marge:#6e3431;
  --muette:#6f7680; --arc:#c3cad5; --syl1:#7fb0ff; --syl2:#ff8a80;
  --ok:#4cc27a; --ok-pale:#173325; --encore:#f0a04b; --encore-pale:#3a2a17; --faux:#ff8a80;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--fond);color:var(--encre);font-family:var(--f-ui);font-size:18px;line-height:1.45;margin:0}
.app{max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
svg.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- barre du haut ---------- */
.barre{display:flex;align-items:center;gap:14px;min-height:56px}
.barre h1{font-size:1.35rem;margin:0;font-weight:700;flex:1;min-width:0;text-wrap:balance}
.rond{width:52px;height:52px;border-radius:50%;background:var(--papier);box-shadow:var(--ombre);display:grid;place-items:center;font-size:1.3rem}
.rond:hover{background:var(--accent-pale)}
.etapes{display:flex;gap:6px;align-items:center}
.etapes span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--papier);color:var(--encre-2);font-size:.85rem}
.etapes span.fait{background:var(--accent);color:var(--sur-accent)}
.etapes span.ici{outline:3px solid var(--accent);outline-offset:1px;color:var(--accent-fort)}
.compte{font-variant-numeric:tabular-nums;color:var(--encre-2);font-size:1rem;white-space:nowrap}

/* ---------- la feuille Seyès ---------- */
.feuille{background-color:var(--papier);border-radius:var(--rayon);box-shadow:var(--ombre);position:relative;
  background-image:
    linear-gradient(90deg,transparent 0 54px,var(--marge) 54px 56px,transparent 56px),
    repeating-linear-gradient(90deg,transparent 0 31px,var(--seyes) 31px 32px),
    repeating-linear-gradient(180deg,transparent 0 31px,var(--seyes-fort) 31px 32px),
    repeating-linear-gradient(180deg,transparent 0 7px,var(--seyes) 7px 8px);
  padding:28px 28px 28px 78px;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.consigne{font-size:1.25rem;font-weight:700;margin:0;align-self:flex-start;text-align:left;background:var(--papier);padding:0 6px;border-radius:6px}

/* ---------- l'écriture de lecture ---------- */
.lecture{font-family:var(--f-lecture);font-weight:400;letter-spacing:.01em}
.cursive .lecture{font-family:var(--f-cursive);font-weight:400;letter-spacing:0;line-height:2.1}
.grand{font-size:clamp(3.4rem,10vw,6.6rem);line-height:1.35}
.moyen{font-size:clamp(2rem,5vw,3.2rem);line-height:1.7}
.cursive .grand{font-size:clamp(2.6rem,8vw,5.2rem)}
.cursive .moyen{font-size:clamp(1.6rem,4vw,2.6rem)}
.mot{white-space:nowrap}
.syl{position:relative}
.syl::after{content:"";position:absolute;left:10%;right:10%;bottom:-.12em;height:.2em;border-bottom:max(2px,.045em) solid var(--arc);border-radius:0 0 50% 50%/0 0 100% 100%;pointer-events:none}
.cursive .syl::after{bottom:-.02em}
.sans-arcs .syl::after{display:none}
.muette{color:var(--muette)}
.sans-muettes .muette{color:inherit}
.couleurs .syl.s1{color:var(--syl1)} .couleurs .syl.s2{color:var(--syl2)}
.couleurs .syl .muette{color:var(--muette)}
.decoupe .syl{margin-inline:.18em}
.outil{font-weight:400}
.phrase{max-width:100%;text-wrap:balance}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:700;font-size:1.1rem;min-height:56px;background:var(--papier);box-shadow:var(--ombre)}
.btn:hover{filter:brightness(.97)}
.btn.plein{background:var(--accent);color:var(--sur-accent)}
.btn.ok{background:var(--ok);color:#fff}
.btn.encore{background:var(--encore-pale);color:var(--encore)}
.btn.ecoute{background:var(--accent-pale);color:var(--accent-fort);box-shadow:none}
.btn.ecoute.dictee{font-size:1.5rem;min-height:76px;padding:14px 34px}
.btn.ecoute.dictee svg.ic{width:1.6em;height:1.6em}
.btn.ecoute.appel{animation:appel 1.1s ease-in-out infinite}
@keyframes appel{50%{transform:scale(1.07);box-shadow:0 0 0 8px var(--accent-pale)}}
.btn.discret{background:transparent;box-shadow:none;color:var(--encre-2);font-weight:400;min-height:44px;padding:8px 14px}
.btn[disabled]{opacity:.45;cursor:default}

/* ---------- la bande de l'adulte ---------- */
.adulte{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:flex-end;background:var(--papier);border:2px dashed var(--trait);border-radius:var(--rayon);padding:12px 14px}
.adulte .qui{margin-right:auto;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-2);display:flex;align-items:center;gap:8px}
.astuce{flex:1 1 260px;text-align:left;font-size:1rem;color:var(--encre-2);max-width:62ch}
.gagne{position:absolute;top:12px;right:18px;font-size:2.4rem;animation:pop .5s ease}
.conseil{background:var(--papier);border-radius:var(--rayon);padding:4px 16px;color:var(--encre-2);font-size:1rem}
.conseil summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--encre)}
.conseil p{margin:0 0 12px;max-width:68ch}

/* ---------- accueil ---------- */
.titre-app{font-family:var(--f-cursive);font-size:clamp(2.2rem,5vw,3.2rem);font-weight:400;margin:6px 0 0;line-height:1.6}
.sous-titre{margin:0;color:var(--encre-2)}
.classe{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.classe .lbl{color:var(--encre-2);font-size:.95rem;margin-right:4px}
.puce{font-family:var(--f-lecture);font-size:1.35rem;min-width:46px;height:46px;padding:0 10px;border-radius:12px;background:var(--papier);display:inline-grid;place-items:center;box-shadow:var(--ombre)}
.puce.focus{background:var(--accent);color:var(--sur-accent);box-shadow:0 0 0 3px var(--accent-pale)}
.cursive .puce{font-family:var(--f-cursive);font-size:1.15rem}
.seance{display:grid;grid-template-columns:auto 1fr;gap:18px 24px;align-items:center;background:var(--accent);color:var(--sur-accent);border-radius:20px;padding:24px 28px;text-align:left;box-shadow:var(--ombre)}
.seance:hover{background:var(--accent-fort)}
.seance .gros{font-size:clamp(1.5rem,3.4vw,2rem);font-weight:700;line-height:1.2}
.seance .petit{opacity:.9}
.seance .jouer{width:72px;height:72px;border-radius:50%;background:var(--sur-accent);color:var(--accent);display:grid;place-items:center}
.seance .jouer svg{width:34px;height:34px;fill:currentColor;stroke:none}
.seance .pas{display:flex;gap:8px;grid-column:1/-1;flex-wrap:wrap}
.seance .pas span{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:.95rem}
.jeux{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.jeu{background:var(--papier);border-radius:var(--rayon);box-shadow:var(--ombre);padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;min-height:132px}
.jeu:hover{outline:3px solid var(--accent-pale)}
.jeu .pic{width:52px;height:52px;border-radius:14px;background:var(--accent-pale);color:var(--accent-fort);display:grid;place-items:center}
.jeu .pic svg{width:28px;height:28px}
.jeu b{font-size:1.2rem}
.jeu small{color:var(--encre-2);font-size:.92rem;line-height:1.3}
.pied{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.bandeau{background:var(--encore-pale);color:var(--encre);border-radius:var(--rayon);padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.maintien{position:relative;overflow:hidden}
.maintien::before{content:"";position:absolute;inset:0;background:var(--accent-pale);transform:scaleX(0);transform-origin:left;transition:transform .1s linear;z-index:0}
.maintien.appui::before{transform:scaleX(1);transition:transform 1.1s linear}
.maintien>*{position:relative;z-index:1}

/* ---------- les sons ---------- */
.quatre{display:flex;gap:clamp(14px,3vw,36px);align-items:baseline;justify-content:center;flex-wrap:wrap}
.quatre span{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1.5}
.quatre .principal{font-size:clamp(4.6rem,13vw,8rem)}
.f-cur{font-family:var(--f-cursive)}
.f-scr{font-family:var(--f-lecture)}
.aussi{color:var(--encre-2);font-size:1.05rem}
.repere{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;font-size:1.4rem}
.repere .emo{font-size:3.4rem;line-height:1}

/* ---------- la fusion ---------- */
.fusion{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,22px);flex-wrap:wrap}
.chevrons{display:flex;align-items:center;transition:gap .5s ease;gap:28px}
.chevrons.colle{gap:0}
.chev{position:relative;width:clamp(96px,14vw,140px);height:clamp(84px,12vw,118px);clip-path:polygon(0 0,74% 0,100% 50%,74% 100%,0 100%);background:var(--encre-2);display:grid;place-items:center}
.chev::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:var(--papier)}
.chev.v2{clip-path:polygon(0 0,74% 0,100% 50%,74% 100%,0 100%,24% 50%)}
.chev.v2 span{padding-left:14%}
.chev span{position:relative;font-size:clamp(2.4rem,6vw,3.6rem);padding-right:14%}
.chev.cons::before{background:var(--accent-pale)}
.fleche{color:var(--encre-2)}
.fleche svg{width:46px;height:46px}
.resultat{min-width:clamp(120px,18vw,180px);height:clamp(84px,12vw,118px);border:3px solid var(--encre-2);border-radius:16px;display:grid;place-items:center;background:var(--papier);font-size:clamp(2.6rem,7vw,4rem)}
.resultat.vide{color:var(--trait)}
.apparait{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.train{display:flex;flex-wrap:wrap;gap:12px 18px;justify-content:center;max-width:760px}
.train button{font-size:clamp(2rem,5vw,3rem);padding:4px 16px;border-radius:12px;border:3px solid transparent;background:var(--papier)}
.train button.dur{border-color:var(--encore);background:var(--encore-pale)}

/* ---------- mots, images, choix ---------- */
.image{font-size:clamp(4rem,10vw,6rem);line-height:1}
.choix{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.choix button{width:clamp(104px,15vw,140px);height:clamp(104px,15vw,140px);border-radius:22px;background:var(--papier);box-shadow:var(--ombre);font-size:clamp(3.2rem,7vw,4.4rem);border:4px solid transparent;line-height:1}
.choix button:hover{border-color:var(--accent-pale)}
.choix button.juste{border-color:var(--ok);background:var(--ok-pale)}
.choix button.non{opacity:.35}
.secoue{animation:secoue .4s}
@keyframes secoue{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.question{background:var(--accent-pale);border-radius:12px;padding:10px 16px;font-size:1.1rem}
button.question{display:inline-flex;align-items:center;gap:10px;color:var(--encre)}

/* ---------- j'écris ---------- */
.modes{display:flex;gap:8px;flex-wrap:wrap}
.modes button{padding:8px 16px;border-radius:999px;background:var(--papier);box-shadow:var(--ombre);font-size:1rem}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--sur-accent)}
.cases{display:flex;flex-wrap:wrap;gap:10px 30px;justify-content:center}
.cases .m{display:flex;gap:8px}
.case{min-width:66px;height:80px;padding:0 8px;border-radius:12px;border:3px dashed var(--seyes-fort);background:var(--papier);font-size:2.6rem;display:grid;place-items:center}
.case.pleine{border-style:solid;border-color:var(--encre-2)}
.case.chut{border-color:var(--muette)}
.case.chut:not(.pleine)::after{content:"chut";font-size:.8rem;color:var(--muette);font-family:var(--f-ui)}
.case.faux{border-color:var(--faux);background:var(--encore-pale)}
.case.juste{border-color:var(--ok);background:var(--ok-pale)}
.tuiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:720px}
.tuile{min-width:66px;height:72px;padding:0 12px;border-radius:12px;background:var(--accent-pale);box-shadow:var(--ombre);font-size:2.4rem}
.tuile[disabled]{opacity:.25;cursor:default}
.oreille{display:flex;align-items:center;gap:14px;font-size:1.25rem}
.oreille svg{width:54px;height:54px;color:var(--accent)}
.souffle{font-size:1.4rem;padding:4px 12px;border-radius:8px;background:var(--encore-pale)}

/* ---------- récompense et album ---------- */
.bravo{font-family:var(--f-cursive);font-size:clamp(2.4rem,6vw,3.6rem);margin:0}
.autocollant{font-size:clamp(6rem,16vw,9rem);line-height:1;animation:pop .7s ease}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px;width:100%}
.album span{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:2.6rem;background:var(--papier);box-shadow:var(--ombre);max-width:100%}
.album span.vide{box-shadow:none;border:2px dashed var(--trait);background:transparent}
.pluie{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.pluie i{position:absolute;top:-60px;font-style:normal;font-size:2rem;animation:tombe 2.6s linear forwards}
@keyframes tombe{to{transform:translateY(110vh) rotate(260deg)}}

/* ---------- coin des parents ---------- */
.reglages{display:grid;gap:16px}
.bloc{background:var(--papier);border-radius:var(--rayon);box-shadow:var(--ombre);padding:18px 20px;display:grid;gap:12px}
.bloc h2{margin:0;font-size:1.2rem}
.bloc p{margin:0;color:var(--encre-2);max-width:70ch;font-size:1rem}
.coches{display:flex;flex-wrap:wrap;gap:8px}
.coches button{font-family:var(--f-lecture);font-size:1.2rem;min-width:52px;height:48px;padding:0 12px;border-radius:12px;border:2px solid var(--trait);background:var(--papier)}
.coches button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sur-accent)}
.coches button.focus{box-shadow:0 0 0 3px var(--papier),0 0 0 6px var(--encore)}
.ligne{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,textarea{font:inherit;font-size:1rem;color:var(--encre);background:var(--papier);border:2px solid var(--trait);border-radius:10px;padding:8px 10px}
select{min-height:46px}
textarea{width:100%;min-height:64px;resize:vertical}
.oeufs{display:flex;gap:10px;flex-wrap:wrap}
.oeufs button{display:flex;align-items:center;gap:4px;padding:8px 14px;border-radius:12px;border:2px solid var(--trait);min-height:52px}
.oeufs button[aria-pressed="true"]{border-color:var(--encre);background:var(--accent-pale)}
.oeuf{width:20px;height:26px}
.interrupteur{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0;text-align:left;width:100%}
.interrupteur .rail{width:52px;height:30px;border-radius:999px;background:var(--trait);position:relative;flex:none;transition:background .2s}
.interrupteur .rail::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--papier);transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.interrupteur[aria-checked="true"] .rail{background:var(--accent)}
.interrupteur[aria-checked="true"] .rail::after{transform:translateX(22px)}
.chiffres{display:flex;gap:24px;flex-wrap:wrap}
.chiffres div{display:grid}
.chiffres b{font-size:2rem;font-variant-numeric:tabular-nums}
.chiffres span{color:var(--encre-2);font-size:.95rem}
.methode{margin:0;padding-left:1.2em;display:grid;gap:8px;max-width:72ch;font-size:1rem}
.danger{color:var(--faux)}

/* ---------- les onglets ---------- */
.onglets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--fond);padding-block:6px}
.onglet{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:14px;background:var(--papier);box-shadow:var(--ombre);font-weight:700;font-size:1.05rem;color:var(--encre-2)}
.onglet svg.ic{width:1.4em;height:1.4em}
.onglet[aria-selected="true"]{background:var(--accent);color:var(--sur-accent)}
.panneau{display:grid;gap:18px}
.rayon{display:grid;gap:10px}
.niveau-maths{gap:12px}
.niveau-maths .lbl{color:var(--encre-2)}
@media (max-width:560px){.onglet{flex-direction:column;gap:2px;font-size:.78rem;min-height:62px;padding:4px}}

/* ---------- accueil : histoires et nombres ---------- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.carte-d{background:var(--papier);border-radius:20px;box-shadow:var(--ombre);padding:20px 22px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;text-align:left}
.carte-d:hover{outline:3px solid var(--accent-pale)}

// « lu-n[e] » -> [[{c:'l'},{c:'u'}], [{c:'n'},{c:'e',m:true}]]
function analyser(annot) {
  const syls = []; let cur = []; let muet = false;
  for (const ch of annot) {
    if (ch === "-") { syls.push(cur); cur = []; }
    else if (ch === "[") muet = true;
    else if (ch === "]") muet = false;
    else cur.push({ c: ch, m: muet });
  }
  syls.push(cur);
  return syls;
}
const sansMarques = a => a.replace(/[-\[\]]/g, "");

function niveauMot(syl) {
  const muette = syl.some(s => s.some(l => l.m));
  const longue = syl.some(s => s.filter(l => !l.m).length >= 3);
  const c = syl.length + (muette ? 1 : 0) + (longue ? 1 : 0);
  return c <= 2 ? 1 : c <= 3 ? 2 : 3;
}

const MOTS = [];
const PAR_FORME = new Map();
[LEXIQUE, ...LEXIQUE_PLUS].join("\n").trim().split("\n").forEach(ligne => {
  ligne = ligne.trim();
  if (!ligne || ligne[0] === "#") return;
  const [annot, tags = "", e = ""] = ligne.split("|");
  const syl = analyser(annot);
  const mot = { annot, forme: sansMarques(annot), tags: tags.trim().split(/\s+/).filter(Boolean), e: e.trim(), syl };
  mot.niveau = niveauMot(syl);
  mot.muettes = syl.flat().some(l => l.m);
  MOTS.push(mot);
  const cle = mot.forme.toLowerCase();
  if (!PAR_FORME.has(cle)) PAR_FORME.set(cle, mot);
});

const OUTIL_DE = new Map();

// Découpe une phrase en jetons : mots, mots-outils, ponctuation. « L'ours » donne « L' » + « ours ».
function jetons(texte) {
  const out = [];
  texte.trim().split(/\s+/).forEach(brut => {
    let w = brut, fin = "";
    const m = w.match(/[.,!?;:]+$/);
    if (m) { fin = m[0]; w = w.slice(0, -fin.length); }
    const parts = [];
    const ap = w.indexOf("'");
    if (ap >= 0 && ap < w.length - 1) { parts.push(w.slice(0, ap + 1), w.slice(ap + 1)); } else if (w) parts.push(w);
    parts.forEach((p, k) => {
      const bas = p.toLowerCase();
      const outil = OUTIL_DE.get(bas) || null;
      out.push({ t: p, outil, mot: outil ? null : (PAR_FORME.get(bas) || null), colle: k > 0 });
    });
    if (fin) out.push({ t: fin, ponct: true });
  });
  return out;
}

const PHRASES_L = PHRASES.trim().split("\n").filter(l => l.trim()).map(l => {

  const j = jetons(texte);
  const nb = j.filter(x => !x.ponct).length;
  return { texte, q, bonne, faux: faux.split(/\s+/), jetons: j, niveau: nb <= 4 ? 1 : nb <= 6 ? 2 : 3 };

// Découpe un texte en graphèmes (« chou » -> ch, ou), avec les graphèmes à plusieurs lettres des sons donnés.
function decouper(texte, tags) {
  const multi = [];
  tags.forEach(t => (GRAPHEMES[t] || []).forEach(g => { if (g.length > 1 && !multi.includes(g)) multi.push(g); }));
  multi.sort((a, b) => b.length - a.length);
  return texte.toLowerCase().replace(/[.,!?;:]/g, "").trim().split(/\s+/).map(w => {
    const out = []; let i = 0;
    while (i < w.length) {
      const g = multi.find(x => w.startsWith(x, i));
      if (g) { out.push(g); i += g.length; } else { out.push(w[i]); i++; }
    }
    return out;
  });
}

// Pour un mot connu du lexique, dit quelles cases du découpage sont des lettres muettes.
function casesMuettes(mot, cases) {
  if (!mot) return cases.map(() => false);
  const lettres = mot.syl.flat();
  let i = 0;
  return cases.map(c => { const tranche = lettres.slice(i, i + c.length); i += c.length; return tranche.length > 0 && tranche.every(l => l.m); });
}

const lisible = (mot, etat) => mot.tags.every(t => etat.sons.includes(t));

function phraseLisible(p, etat) {
  return p.jetons.every(j => j.ponct || (j.outil ? etat.outils.includes(j.outil) : (j.mot && lisible(j.mot, etat))));
}

function parNiveau(liste, etat, min) {
  const filtre = liste.filter(x => x.niveau <= etat.niveau);
  return filtre.length >= min ? filtre : liste;
}

function tirer(liste, n, poids) {
  const pool = liste.map(x => ({ x, w: Math.max(0.01, poids ? poids(x) : 1) }));
  const out = [];
  while (out.length < n && pool.length) {
    let r = Math.random() * pool.reduce((s, p) => s + p.w, 0), i = 0;
    for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r <= 0) break; }
    out.push(pool[i].x); pool.splice(i, 1);
  }
  return out;
}

const poidsMot = etat => m => (m.tags.includes(etat.focus) ? 3 : 1) / (1 + (etat.lus[m.forme] || 0) * 0.5) * (1 + (etat.difficiles[m.forme] || 0));

function motsLisibles(etat) {
  const vus = new Set();
  return MOTS.filter(m => {
    if (m.forme === "l'" || m.forme.length < 2 || vus.has(m.forme.toLowerCase())) return false;
    if (!lisible(m, etat)) return false;
    vus.add(m.forme.toLowerCase());
    return true;
  });
}

function choisirMots(etat, n, avecImage) {
  let l = motsLisibles(etat);
  if (avecImage) l = l.filter(m => m.e);
  return tirer(parNiveau(l, etat, Math.max(6, n)), n, poidsMot(etat));
}

function choisirPhrases(etat, n) {
  const l = PHRASES_L.filter(p => phraseLisible(p, etat));
  const recentes = l.filter(p => p.jetons.some(j => j.mot && j.mot.tags.includes(etat.focus)));
  return tirer(parNiveau(l, etat, n), n, p => recentes.includes(p) ? 3 : 1);
}

const FUSION_C = { l: "l", r: "r", m: "m", s: "s", f: "f", ch: "ch", n: "n", p: "p", t: "t", v: "v", d: "d", j: "j", b: "b", k: "c", g: "g", z: "z", ph: "ph" };

const DURES = ["a", "o", "u", "ou", "on", "an", "oi", "au"];
const INVERSES_C = ["l", "r", "m", "s", "f"], INVERSES_V = ["a", "i", "o", "u"];

function syllabes(etat, n, inverses = 0.25) {
  const cs = etat.sons.filter(s => FUSION_C[s]);

  if (!cs.length || !vs.length) return [];
  const toutes = [];
  cs.forEach(c => vs.forEach(v => {
    if ((c === "k" || c === "g") && !DURES.includes(v)) return;
    const poids = (c === etat.focus || v === etat.focus) ? 3 : 1;
    toutes.push({ c: FUSION_C[c], v: FUSION_V[v], inverse: false, w: poids });
    if (INVERSES_C.includes(c) && INVERSES_V.includes(v)) toutes.push({ c: FUSION_C[c], v: FUSION_V[v], inverse: true, w: poids * inverses * 2 });
  }));
  return tirer(toutes, n, x => x.w).map(s => ({ ...s, texte: s.inverse ? s.v + s.c : s.c + s.v }));
}

      // Garder l'énoncé : ramassé trop tôt, Chrome en perd les évènements, et parfois le son.
      this.enCours = u;
      const parti = new Promise(ok => {
        u.onstart = () => ok(true); u.onerror = () => ok(false); setTimeout(() => ok(false), 2500);
      });
      if (opts.fin) u.onend = () => { if (this.jeton === jeton) opts.fin(); };
      if (opts.mot) u.onboundary = e => { if (this.jeton === jeton && (!e.name || e.name === "word")) opts.mot(e.charIndex); };
      const lancer = () => { try { s.resume(); s.speak(u); } catch (e) {} };
      // Chrome laisse tomber un énoncé demandé dans le même instant qu'un cancel() :
      // on ne coupe que ce qui parle, et on attend un peu avant de reparler.
      if (s.speaking || s.pending) { s.cancel(); setTimeout(lancer, 150); } else lancer();
      return parti;
    } catch (e) { return Promise.resolve(false); }
  },
  // Lit un texte puis, après une pause, un second : la question après la phrase.
  direPuis(texte, suite, pause) {
    return this.dire(texte, false, { fin: () => { const j = this.jeton; setTimeout(() => { if (this.jeton === j) this.dire(suite); }, pause); } });
  },
  taire() { this.jeton++; try { if (this.ok && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); } catch (e) {} }
};

// Une syllabe dictée s'écrit pour la voix comme un mot qu'elle sait dire : « ar » devient « are », « fe » devient « feu ».
function prononcer(t) {
  const bas = t.toLowerCase().trim();
  if (/\s/.test(bas) || PAR_FORME.has(bas) || OUTIL_DE.has(bas)) return t;
  if (bas === "chi") return "chis";
  const m = bas.match(/^([aeiouéè]+)([lrmsf])$/);
  if (m) return m[1] + ({ s: "sse", f: "ffe" }[m[2]] || m[2] + "e");
  if (/^[^aeiouéèy]+e$/.test(bas)) return bas + "u";
  return t;
}

// ---------- Écriture d'un mot avec ses arcs et ses lettres muettes ----------

function rendreMot(m, texte) {
  const chars = [...texte]; let i = 0;
  if (m.forme === "l'") return h("span", { class: "mot" }, texte);
  return h("span", { class: "mot" }, m.syl.map((s, k) => h("span", { class: "syl " + (k % 2 ? "s2" : "s1") },
    s.map(l => { const c = chars[i++] ?? l.c; return l.m ? h("span", { class: "muette" }, c) : c; }))));
}
function rendreJetons(js) {
  const out = [];
  js.forEach((j, k) => {
    if (k > 0 && !j.colle) out.push(j.ponct ? (/[?!:;]/.test(j.t) ? " " : "") : " ");
    if (j.ponct) out.push(j.t);
    else if (j.outil) out.push(h("span", { class: "mot outil" }, j.t));
    else if (j.mot) out.push(rendreMot(j.mot, j.t));
    else out.push(h("span", { class: "mot" }, h("span", { class: "syl s1" }, j.t)));
  });
  return out;
}

// ----- le suivi : chaque réponse est notée, par domaine et par clé -----
// suivi[domaine][cle] = { ok, ko, h: "11010" (les 8 dernières), d: date }
let journalEtape = null;      // pendant un point d'étape, les réponses y sont aussi rangées
function noter(domaine, cle, juste) {
  if (!domaine) return;
  const d = etat.suivi[domaine] || (etat.suivi[domaine] = {});
  const s = d[cle] || (d[cle] = { ok: 0, ko: 0, h: "", d: "" });
  if (juste) s.ok++; else s.ko++;
  s.h = (s.h + (juste ? "1" : "0")).slice(-8);
  s.d = aujourdhui();
  etat.jours[s.d] = (etat.jours[s.d] || 0) + 1;
  if (journalEtape) journalEtape.push({ domaine, cle, juste });
  sauver();
}
// 0 : jamais vu · 1 : fragile · 2 : en cours · 3 : acquis (au moins 4 justes sur les 5 dernières)
function maitrise(domaine, cle) {
  const s = (etat.suivi[domaine] || {})[cle];
  if (!s || !s.h) return 0;
  const recent = s.h.slice(-5), justes = [...recent].filter(c => c === "1").length;
  if (recent.length >= 5 && justes >= 4) return 3;
  return justes / recent.length >= 0.6 ? 2 : 1;
}
// Pour un domaine entier : réponses, taux de réussite sur les plus récentes.
function bilanDomaine(domaine) {
  const d = etat.suivi[domaine] || {};
  let n = 0, justes = 0, ok = 0, ko = 0;
  Object.values(d).forEach(s => { ok += s.ok; ko += s.ko; for (const c of s.h) { n++; if (c === "1") justes++; } });
  return { reponses: ok + ko, taux: n ? justes / n : null, cles: Object.keys(d).length };
}

// ----- les séries d'exercices : le moteur commun -----
// def : { id, titre, icone, conseil: [...], n: 8, domaine, question(k) → q }
// q   : { rendre(feuille, repondre, adulte), reponse, verifier(v)?, cle?, dire?, apres(juste)?, astuce? }
// opts : { n, evaluation: true (une seule réponse, pas d'aide), finir(resultat) }
const SERIES = {};
function serie(def) { SERIES[def.id] = def; return def; }

function jouerSerie(def, opts) {
  opts = opts || {};
  const N = opts.n || def.n || 8;
  let k = 0, etoiles = 0, justes = 0;
  ecran = "serie";
  function suivante() {
    if (k >= N) return fin();
    vider();
    const q = def.question(k);
    if (!q) { k = N; return fin(); }
    const feuille = h("section", { class: "feuille" }), adulte = h("div", { class: "adulte" });
    ajoute(racine, barre(def.titre, h("div", { class: "ligne" }, pastillesSeance(), h("span", { class: "compte" }, (k + 1) + " / " + N))),
      feuille, adulte, opts.evaluation ? null : conseil(def));
    let essais = 0, fini = false;
    const passer = () => { k++; suivante(); };
    const repondre = (val, bouton) => {
      if (fini) return;
      const bon = q.verifier ? q.verifier(val) : val === q.reponse;
      if (bon || opts.evaluation) {
        fini = true;
        const premier = bon && !essais;
        if (bouton) bouton.classList.add(bon ? "juste" : "non");
        bip(bon ? "ok" : "non");
        if (premier) { etoiles++; if (!opts.evaluation) etoile(feuille); }
        if (bon) justes++;
        noter(q.domaine || def.domaine, q.cle || def.id, premier);
        if (q.apres) q.apres(bon);
        k++; setTimeout(suivante, q.apres ? 2400 : opts.evaluation ? 700 : 1100);
      } else {
        essais++;
        if (bouton) bouton.classList.add("non", "secoue");
        bip("non");
        if (q.aide && essais >= 2) q.aide();
      }
    };
    q.rendre(feuille, repondre, adulte);
    bandeAdulte(adulte, [astuce(q.astuce || (opts.evaluation ? "Point d'étape : une seule réponse, sans aide. Lisez la consigne si elle le demande." : def.conseil[0])),
      q.dire && Voix.dispo() ? h("button", { class: "btn ecoute", onclick: () => Voix.dire(q.dire) }, ic("haut"), "Réécouter") : null,
      bSuivant(passer, "Passer")]);
    if (q.dire) setTimeout(() => Voix.dire(q.dire), 350);
  }
  function fin() {
    const r = { id: def.id, etoiles, justes, n: N };
    const rec = etat.series[def.id] || (etat.series[def.id] = { parties: 0, meilleur: 0 });
    rec.parties++; rec.meilleur = Math.max(rec.meilleur, etoiles); rec.dernier = aujourdhui(); sauver();
    if (opts.finir) return opts.finir(r);
    vider(); bip("fin"); if (etoiles) pluie("⭐");
    ajoute(racine, barre(def.titre),
      h("section", { class: "feuille" }, h("p", { class: "bravo" }, etoiles >= N - 1 ? "Bravo !" : "Bien joué !"),
        h("div", { class: "image" }, "⭐".repeat(etoiles) || "🙂"),
        h("p", { class: "consigne", style: "align-self:center" }, etoiles + " étoile" + (etoiles > 1 ? "s" : "") + " sur " + N),
        h("div", { class: "ligne" }, h("button", { class: "btn plein", onclick: () => jouerSerie(def, opts) }, ic("encore"), "Rejouer"),
          h("button", { class: "btn", onclick: accueil }, ic("maison"), "Retour"))));
  }
  suivante();
}

    setTimeout(() => { res.textContent = it.texte; res.classList.remove("vide"); res.classList.add("apparait"); }, 480);
    bandeAdulte(adulte, [astuce("Elle lit la syllabe à voix haute."),
      bEncore(() => { rate = true; chev.classList.remove("colle"); res.textContent = "?"; res.classList.add("vide"); res.classList.remove("apparait"); coller.hidden = false; depart(); }, "On recommence"),
      bOk(() => { noter("decodage", it.texte, !rate); bip("ok"); etoile(feuille); setTimeout(suivant, 600); })]);
  }
  depart();
}

function rendreTrain(train, { feuille, adulte, suivant }) {
  ajoute(feuille, h("p", { class: "consigne" }, "Lis les syllabes."),
    h("div", { class: "train lecture" }, train.map(s => h("button", { onclick: e => e.currentTarget.classList.toggle("dur") }, s.texte))));
  bandeAdulte(adulte, [astuce("De gauche à droite, le doigt sous chaque syllabe. Touchez celles qui ont coincé : elles passent en orange, à relire."),
    bOk(() => { bip("ok"); suivant(); }, "Tout est lu")]);
}

      }
      const voir = h("button", { class: "btn", onclick: () => { souffle.hidden = !souffle.hidden; } }, ic("oeil"), "Ce qu'il faut dicter");
      const ecoute = it.image ? null : bEcouter(it.texte, "Écoute", true);

      // La dictée part toute seule ; si le navigateur la refuse, le bouton appelle le doigt.

// ---------- Les petites histoires, en lecture assistée ----------
// Elle lit ; un mot qui résiste se touche une fois pour se couper en syllabes, deux fois
// pour s'entendre. Les mots qu'elle ne peut pas encore déchiffrer sont pour l'adulte.

const SEUIL_HISTOIRE = 0.5;

function bibliotheque() {
  ecran = "histoires"; seance = null; vider();
  const cartes = HISTOIRES_L.map(hist => {
    const part = partLisible(hist, etat), lue = etat.histoires[hist.id] || 0;
    const ouverte = part >= SEUIL_HISTOIRE;
    const badge = !ouverte ? "Plus tard, avec d'autres sons"
      : part >= 0.999 ? "Elle peut tout lire seule"
      : "À deux : elle lit " + Math.round(part * 100) + " % des mots";
    return h("button", { class: "livre" + (ouverte ? "" : " ferme"), disabled: !ouverte, onclick: () => lireHistoire(hist) },
      h("span", { class: "couverture" }, hist.image),
      h("b", { class: "lecture" }, hist.titre),
      h("small", null, badge),
      lue ? h("span", { class: "lue" }, ic("ok"), lue > 1 ? "lue " + lue + " fois" : "déjà lue") : null);
  });
  ajoute(racine, barre("Les histoires"),
    h("p", { class: "sous-titre" }, "Des histoires faites des sons de la classe. Le groupe d'œufs règle leur longueur."),
    h("div", { class: "livres" }, cartes),
    conseil({ conseil: [
      "Elle lit, le doigt sous les mots. Un mot qui résiste : touchez-le une fois, il se coupe en syllabes ; une deuxième fois, la voix le lit.",
      "Les mots en pointillés contiennent des sons pas encore vus en classe : c'est vous qui les lisez, ou la voix quand on les touche. C'est la lecture partagée.",
      "Après chaque page, « Écouter la page » fait entendre une lecture fluide, les mots s'éclairant au fil de la voix.",
      "À la fin, la voix pose deux questions. Comprendre l'histoire, c'est le but de la lecture."] }));
}

function lireHistoire(hist) {
  ecran = "histoire";
  const pages = pagesDuGroupe(hist, etat);
  let p = 0;

  function page() {
    vider();
    const pg = pages[p];
    const feuille = h("section", { class: "feuille histoire" });
    const adulte = h("div", { class: "adulte" });
    const mots = [];
    const texte = { t: "" };
    const lignes = pg.lignes.map(l => {
      const el = h("p", null, ligneInteractive(l.jetons, mots, texte));
      texte.t += " ";
      return el;
    });
    ajoute(racine, barre(hist.titre, h("span", { class: "compte" }, "page " + (p + 1) + " / " + pages.length)),
      feuille, adulte);
    ajoute(feuille, h("div", { class: "scene", "aria-hidden": "true" }, pg.image), h("div", { class: "lecture moyen recit" }, lignes));
    const ecouter = Voix.dispo() ? h("button", { class: "btn ecoute", onclick: () => {
      Voix.dire(texte.t, false, {
        mot: i => mots.forEach(m => m.el.classList.toggle("suivi", i >= m.debut && i < m.fin)),
        fin: () => mots.forEach(m => m.el.classList.remove("suivi"))
      });
    } }, ic("haut"), "Écouter la page") : null;
    const apres = p + 1 < pages.length ? bSuivant(() => { p++; page(); }, "Page suivante") : bSuivant(() => questions(0), "Les questions");
    bandeAdulte(adulte, [astuce("Un mot difficile : une touche le coupe, deux touches le font lire. Les mots en pointillés sont pour vous."),
      bOk(() => { bip("ok"); bandeAdulte(adulte, [astuce("Bravo ! On peut réécouter la page, en suivant les mots."), ecouter, apres]); }, "Page lue !")]);
  }

  function questions(k) {
    if (k >= hist.questions.length) return fin();
    vider();
    const q = hist.questions[k];
    let rate = false;
    const feuille = h("section", { class: "feuille" });
    const adulte = h("div", { class: "adulte" });
    ajoute(racine, barre(hist.titre, h("span", { class: "compte" }, "question " + (k + 1) + " / " + hist.questions.length)), feuille, adulte);
    ajoute(feuille, h("div", { class: "scene", "aria-hidden": "true" }, hist.image),
      Voix.dispo() ? h("button", { class: "question", onclick: () => Voix.dire(q.q) }, ic("haut"), "« " + q.q + " »")
        : h("div", { class: "question" }, "Demandez-lui : « " + q.q + " »"),
      h("div", { class: "choix" }, melanger([q.bonne, ...q.faux]).map(e => h("button", { "aria-label": "Image", onclick: ev => {
        const b = ev.currentTarget;
        if (e === q.bonne) { b.classList.add("juste"); bip("ok"); noter("comprehension-ecrite", hist.id + ":" + k, !rate); setTimeout(() => questions(k + 1), 1000); }
        else { rate = true; b.classList.add("non", "secoue"); bip("non"); }
      } }, e))));
    bandeAdulte(adulte, [astuce(Voix.dispo() ? "La voix pose la question. Touchez-la pour la répéter." : "Posez la question à voix haute."), bSuivant(() => questions(k + 1), "Passer")]);
    setTimeout(() => Voix.dire(q.q), 500);
  }

  function fin() {
    etat.histoires[hist.id] = (etat.histoires[hist.id] || 0) + 1; sauver();
    vider(); bip("fin"); pluie(hist.image);
    ajoute(racine, barre(hist.titre),

}

// Une ligne d'histoire : chaque mot se touche. Le texte lu par la voix est gardé
// en parallèle, avec la place de chaque mot, pour l'éclairer au fil de la lecture.
function ligneInteractive(js, mots, texte) {
  const out = [];
  js.forEach((j, k) => {
    if (k > 0 && !j.colle) {
      if (j.ponct) { if (/[?!:;]/.test(j.t)) { out.push(" "); texte.t += " "; } }
      else { out.push(" "); texte.t += " "; }
    }
    if (j.ponct) { out.push(j.t); texte.t += j.t; return; }
    const seul = jetonLisible(j, etat);
    const el = j.outil ? h("span", { class: "mot outil" }, j.t) : j.mot ? rendreMot(j.mot, j.t) : h("span", { class: "mot" }, j.t);
    el.classList.add("touche");
    if (!seul) el.classList.add("grand");
    el.setAttribute("role", "button"); el.tabIndex = 0;
    el.title = seul ? "Une touche : les syllabes. Deux touches : la voix." : "Un mot pour l'adulte : touchez pour l'entendre.";
    let n = 0;
    const aider = () => {
      n++;
      if (seul && !j.outil && n === 1) el.classList.add("decoupe");
      else Voix.dire(j.t);
    };
    el.addEventListener("click", aider);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); aider(); } });
    mots.push({ el, debut: texte.t.length, fin: texte.t.length + j.t.length });
    texte.t += j.t;
    out.push(el);
  });
  return out;
}

// Un ou deux cadres de dix ; groupes = [{n, c}] avec c = "a" (rouge), "b" (bleu), "v" (case vide marquée)
function cadres(groupes, taille = 10) {
  const jetons = groupes.flatMap(g => Array(g.n).fill(g.c));
  const total = Math.max(taille, Math.ceil(jetons.length / taille) * taille);
  const el = h("div", { class: "cadres" });
  for (let d = 0; d < total; d += taille)
    el.append(h("div", { class: "cadre" + (taille === 5 ? " cinq" : "") },
      Array.from({ length: taille }, (_, i) => h("span", { class: "cc" }, jetons[d + i] ? h("i", { class: "jeton " + jetons[d + i] }) : null))));
  return el;
}
// La face d'un dé, de 1 à 6
const FACES = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const de = n => h("div", { class: "de" }, Array.from({ length: 9 }, (_, i) => h("span", null, FACES[n].includes(i) ? h("i") : null)));
// Au-delà de 6 : cinq, et encore… La structure « 5 et quelque chose » est celle des doigts.
const des = n => h("div", { class: "des" }, n <= 6 ? de(n) : [de(5), de(n - 5)]);
const tas = (n, e) => h("div", { class: "tas" }, Array.from({ length: n }, () => h("span", { style: "transform:translate(" + entier(-6, 6) + "px," + entier(-6, 6) + "px) rotate(" + entier(-12, 12) + "deg)" }, e)));

// La maison du nombre : le tout en haut, les deux parties en bas.
function maisonNombre(tout, a, b) {
  const NS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 260 180"); s.setAttribute("class", "lien"); s.setAttribute("role", "img");
  s.setAttribute("aria-label", "Le tout " + tout + ", les parties " + a + " et " + b);
  const rond = (x, y, v) => {
    const g = document.createElementNS(NS, "g");
    g.innerHTML = '<circle cx="' + x + '" cy="' + y + '" r="34" class="' + (v === "?" ? "nb-inconnu" : "nb-cercle") + '"/>'
      + '<text x="' + x + '" y="' + (y + 11) + '" text-anchor="middle" class="nb-txt">' + v + "</text>";
    s.append(g);
  };
  s.innerHTML = '<path d="M112 70 72 112M148 70l40 42" class="nb-trait"/>';
  rond(130, 42, tout); rond(60, 136, a); rond(200, 136, b);
  return s;
}

// ---------- Je lis vite : la fluence, une minute chrono ----------
// Le format du point d'étape de mi-CP : lire à voix haute le plus de mots possible en une minute.
// L'adulte touche les mots ratés ; la page compte les mots lus correctement par minute (MCLM).
// Repères de fin de CP (programme 2024, tels que les académies les relaient) : 30 mots sur un
// texte jamais lu, 50 sur un texte préparé. Le texte de la semaine reste le même sept jours :
// c'est la lecture répétée, qui fait monter le score et la confiance.

ICONES.chrono = '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/>';
const FLUENCE_REPERES = [{ v: 30, t: "30 : fin de CP, texte jamais lu" }, { v: 50, t: "50 : fin de CP, texte préparé" }];

function semaineIso(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const j = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - j);
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 864e5 + 1) / 7);
}

// Les textes : les histoires entièrement lisibles avec ses sons (toutes les lignes), puis,
// à défaut, un texte fait des phrases lisibles.
function textesFluence() {
  const tous = Object.assign({}, etat, { niveau: 3 });
  const out = HISTOIRES_L.map(hh => {
    const lignes = pagesDuGroupe(hh, tous).flatMap(p => p.lignes);
    const js = lignes.flatMap(l => l.jetons);
    return js.length && js.every(j => j.ponct || jetonLisible(j, etat)) ? { id: "h:" + hh.id, titre: hh.titre, lignes: lignes.map(l => l.jetons) } : null;
  }).filter(Boolean);
  if (!out.length) {
    const ps = PHRASES_L.filter(p => phraseLisible(p, etat)).slice(0, 8);
    if (ps.length >= 3) out.push({ id: "phrases", titre: "Petites phrases", lignes: ps.map(p => p.jetons) });
  }
  return out;
}
function texteDeLaSemaine(frais) {
  const t = textesFluence();
  if (!t.length) return null;
  if (!frais) return t[semaineIso() % t.length];
  const lus = new Set(etat.fluence.map(f => f.id));
  return t.find(x => !lus.has(x.id)) || hasard(t);
}
function motsFluence(n) {
  let l = parNiveau(motsLisibles(etat), etat, 20).filter(m => m.forme.length > 1);
  if (!l.length) return [];
  const out = [];
  while (out.length < n) out.push(...melanger(l));
  return out.slice(0, n);
}

// mode : "mots" ou "texte" · opts : { finir(score), etape: "lire-mots" | "lire-texte", frais }
function lisvite(mode, opts) {
  opts = opts || {};
  ecran = "lisvite";
  const texte = mode === "texte" ? texteDeLaSemaine(opts.frais) : null;
  const mots = mode === "mots" ? motsFluence(etat.niveau === 1 ? 30 : 45) : null;
  const choixMode = opts.finir ? null : h("div", { class: "modes", role: "group", "aria-label": "Ce qu'on lit" },
    [["mots", "Des mots"], ["texte", "Le texte de la semaine"]].map(([m, t]) =>
      h("button", { "aria-pressed": String(mode === m), onclick: () => lisvite(m) }, t)));
  const { feuille, adulte } = ecranModule("Je lis vite", h("div", { class: "ligne" }, pastillesSeance(), choixMode));
  if ((mode === "mots" && !mots.length) || (mode === "texte" && !texte)) {
    ajoute(feuille, h("p", { class: "consigne" }, mode === "mots" ? "Pas encore assez de mots avec les sons vus en classe." :
      "Pas encore de texte entièrement lisible avec ses sons. Essayez les mots, ou revenez dans quelques semaines."));
    bandeAdulte(adulte, [opts.finir ? bSuivant(() => opts.finir(null), "Étape suivante") : null]);
    return;
  }
  const cases = [];
  const chrono = h("div", { class: "lisvite-chrono", "aria-live": "polite" }, "1:00");
  const zone = h("div", { class: "lisvite-zone flou" + (mode === "mots" ? " lisvite-mots" : " lisvite-texte") });
  const bouton = (j, el) => {
    el.classList.add("lisvite-mot");
    el.addEventListener("click", () => toucher(cases.length && cases.find(c => c.el === el)));
    cases.push({ el, t: j });
    return el;
  };
  if (mode === "mots") mots.forEach(m => zone.append(bouton(m.forme, h("span", { class: "lecture" }, rendreMot(m, m.forme)))));
  else texte.lignes.forEach(js => {
    const p = h("p", { class: "lecture" });
    js.forEach((j, k) => {
      if (k > 0 && !j.colle) p.append(j.ponct ? (/[?!:;]/.test(j.t) ? " " : "") : " ");
      if (j.ponct) p.append(j.t);
      else p.append(bouton(j.t, j.outil ? h("span", { class: "mot outil" }, j.t) : j.mot ? rendreMot(j.mot, j.t) : h("span", null, j.t)));
    });
    zone.append(p);
  });
  ajoute(feuille, h("p", { class: "consigne" }, mode === "mots" ? "Lis le plus de mots possible, dans l'ordre, ligne par ligne." : "Lis le texte à voix haute : « " + texte.titre + " »."),
    chrono, zone);

  let etatL = "pret", t0 = 0, fin = 0, horloge = null, dernier = -1;
  function toucher(c) {
    if (!c) return;
    if (etatL === "lecture") c.el.classList.toggle("rate");
    else if (etatL === "dernier") { dernier = cases.indexOf(c); resultat(); }
  }
  function partir() {
    etatL = "lecture"; zone.classList.remove("flou"); t0 = Date.now();
    // le temps se lit sur l'horloge : un onglet en arrière-plan ralentit les minuteries
    horloge = setInterval(() => {
      const reste = Math.max(0, 60 - (Date.now() - t0) / 1000);
      chrono.textContent = "0:" + String(Math.ceil(reste)).padStart(2, "0");
      chrono.classList.toggle("fin-proche", reste < 10);
      if (reste <= 0) arreter(false);
    }, 200);
    bandeAdulte(adulte, [astuce("Touchez chaque mot raté ou sauté : il passe en rouge. Un mot corrigé tout seul compte juste."),
      h("button", { class: "btn", onclick: () => arreter(true) }, ic("ok"), "Elle a tout lu")]);
  }
  function arreter(toutLu) {
    clearInterval(horloge); fin = Date.now();
    if (toutLu) { dernier = cases.length - 1; return resultat(); }
    etatL = "dernier"; chrono.textContent = "0:00"; bip("fin");
    zone.classList.add("choisir");
    bandeAdulte(adulte, [astuce("Le temps est fini. Touchez le dernier mot qu'elle a lu.")]);
  }
  function resultat() {
    etatL = "fini"; zone.classList.remove("choisir");
    // Au moins 15 secondes : un « Elle a tout lu » touché trop tôt ne fabrique pas un score absurde.
    const secondes = Math.min(60, Math.max(15, (fin - t0) / 1000));
    const erreurs = cases.slice(0, dernier + 1).filter(c => c.el.classList.contains("rate")).length;
    const justes = Math.max(0, dernier + 1 - erreurs);
    const mclm = Math.round(justes * 60 / secondes);
    cases.forEach((c, i) => { if (i > dernier) c.el.classList.add("pas-lu"); });
    const id = mode === "mots" ? "mots" : texte.id;
    const avant = etat.fluence.filter(f => f.id === id && mode === "texte").slice(-1)[0];
    etat.fluence.push({ d: aujourdhui(), type: mode, id, mclm, err: erreurs, lus: dernier + 1 });
    etat.jours[aujourdhui()] = (etat.jours[aujourdhui()] || 0) + 1;
    if (journalEtape) journalEtape.push({ domaine: opts.etape || (mode === "mots" ? "lire-mots" : "lire-texte"), score: mclm });
    sauver(); bip("ok");
    const msg = h("div", { class: "lisvite-score" }, h("b", null, mclm), h("span", null, "mots lus correctement en une minute"),
      erreurs ? h("small", null, erreurs + " mot" + (erreurs > 1 ? "s" : "") + " raté" + (erreurs > 1 ? "s" : "")) : null,
      avant ? h("small", null, mclm > avant.mclm ? "+" + (mclm - avant.mclm) + " depuis la dernière lecture de ce texte !" : "La dernière fois : " + avant.mclm + ".") : null);
    feuille.prepend(msg);
    if (mclm > (avant ? avant.mclm : 0)) etoile(feuille);
    if (opts.finir) { bandeAdulte(adulte, [bSuivant(() => opts.finir(mclm), "Étape suivante")]); return; }
    ajoute(feuille, graphiqueFluence(mode));
    bandeAdulte(adulte, [astuce(mode === "texte" ? "Relire le même texte demain : le score monte, et la lecture devient plus fluide." : "Les mots changent à chaque fois."),
      h("button", { class: "btn", onclick: () => lisvite(mode) }, ic("encore"), mode === "texte" ? "Relire le texte" : "D'autres mots"),
      bSuivant(accueil, "Retour")]);
  }
  bandeAdulte(adulte, [astuce("Elle lit à voix haute, le doigt sous les mots. Vous lancez le chrono quand elle est prête."),
    h("button", { class: "btn plein", onclick: partir }, ic("chrono"), "Partez !")]);
}

// La courbe des scores, à l'échelle, avec les deux repères de fin de CP.
function graphiqueFluence(type) {
  const pts = etat.fluence.filter(f => !type || f.type === type).slice(-12);
  if (!pts.length) return h("p", { class: "lisvite-vide" }, "La courbe apparaîtra après la première lecture chronométrée.");
  const L = 640, H = 240, g = 44, d = 16, hautG = 16, basG = 34;
  const max = Math.max(60, ...pts.map(p => p.mclm)) + 5;
  const x = i => g + (pts.length === 1 ? (L - g - d) / 2 : i * (L - g - d) / (pts.length - 1));
  const y = v => H - basG - v * (H - basG - hautG) / max;
  const NS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 " + L + " " + H); s.setAttribute("class", "lisvite-courbe"); s.setAttribute("role", "img");
  s.setAttribute("aria-label", "Mots lus par minute : " + pts.map(p => p.mclm).join(", "));
  let c = "";
  for (let v = 0; v <= max; v += 10) c += '<line class="fl-grille" x1="' + g + '" x2="' + (L - d) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="fl-txt" x="' + (g - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + "</text>";
  FLUENCE_REPERES.forEach(r => { c += '<line class="fl-cible" x1="' + g + '" x2="' + (L - d) + '" y1="' + y(r.v) + '" y2="' + y(r.v) + '"/><text class="fl-cible-t" x="' + (L - d) + '" y="' + (y(r.v) - 5) + '" text-anchor="end">' + r.t + "</text>"; });
  c += '<polyline class="fl-ligne" points="' + pts.map((p, i) => x(i) + "," + y(p.mclm)).join(" ") + '"/>';
  pts.forEach((p, i) => {
    c += '<circle class="fl-point" cx="' + x(i) + '" cy="' + y(p.mclm) + '" r="' + (i === pts.length - 1 ? 6 : 4) + '"/>';
    c += '<text class="fl-txt" x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle">' + p.d.slice(8, 10) + "/" + p.d.slice(5, 7) + "</text>";
  });
  const der = pts[pts.length - 1];
  c += '<text class="fl-val" x="' + x(pts.length - 1) + '" y="' + (y(der.mclm) - 12) + '" text-anchor="middle">' + der.mclm + "</text>";
  s.innerHTML = c;
  return h("figure", { class: "lisvite-fig" }, s, h("figcaption", null, type === "texte" ? "Le texte, en mots par minute" : type === "mots" ? "Les listes de mots, en mots par minute" : "Mots par minute"));
}

}

// ---------- Le coin des parents ----------

function bloc(titre, texte, ...contenu) {
  return h("section", { class: "bloc" }, h("h2", null, titre), texte ? h("p", null, texte) : null, ...contenu);
}
function interrupteur(id, libelle, valeur, changer) {
  return h("button", { id, class: "interrupteur", role: "switch", "aria-checked": String(valeur), onclick: () => { changer(!valeur); } },
    h("span", null, libelle), h("span", { class: "rail" }));
}

function parents() {
  const y = ecran === "parents" ? window.scrollY : 0;
  ecran = "parents"; seance = null; vider();
  const refaire = () => { etat.regle = true; sauver(); appliquerAffichage(); parents(); };

  const classeEn = h("select", { id: "classe-en", onchange: e => {
    const k = ID_SONS.indexOf(e.target.value); etat.sons = ID_SONS.slice(0, k + 1); etat.focus = e.target.value; refaire();
  } }, SONS.map((s, k) => h("option", { value: s.id, selected: s.id === etat.focus ? true : null }, (k + 1) + ". " + s.g.join(" · ") + " (" + s.rep + ")")));

  const semaine = h("select", { id: "son-semaine", onchange: e => { etat.focus = e.target.value; refaire(); } },
    etat.sons.map(id => h("option", { value: id, selected: id === etat.focus ? true : null }, SON[id].g.join(" · "))));

  const coches = h("div", { class: "coches" }, SONS.map(s => h("button", {
    "aria-pressed": String(etat.sons.includes(s.id)), class: s.id === etat.focus ? "focus" : null, title: s.rep,
    onclick: () => {
      etat.sons = etat.sons.includes(s.id) ? etat.sons.filter(x => x !== s.id) : ID_SONS.filter(x => x === s.id || etat.sons.includes(x));
      if (!etat.sons.length) etat.sons = ["a"];
      if (!etat.sons.includes(etat.focus)) etat.focus = etat.sons[etat.sons.length - 1];
      refaire();
    } }, s.g[0])));

  const outils = h("div", { class: "coches" }, OUTILS.map(o => h("button", {
    "aria-pressed": String(etat.outils.includes(o.id)), style: "font-weight:700",
    onclick: () => { etat.outils = etat.outils.includes(o.id) ? etat.outils.filter(x => x !== o.id) : [...etat.outils, o.id]; refaire(); } }, o.id)));

  const groupes = h("div", { class: "oeufs" }, [1, 2, 3].map(n => h("button", {
    "aria-pressed": String(etat.niveau === n), "aria-label": "Groupe " + n + " œuf" + (n > 1 ? "s" : ""),
    onclick: () => { etat.niveau = n; refaire(); } }, oeufs(n, COULEURS_OEUFS[n - 1]), h("span", { style: "margin-left:6px" }, ["1 œuf", "2 œufs", "3 œufs"][n - 1]))));

  const son = SON[etat.focus];
  const cols = (etat.dictees[etat.focus]) || DICTEES[etat.focus] || [[], [], []];
  const zones = [0, 1, 2].map(k => h("label", { style: "display:grid;gap:6px" },
    h("span", { class: "ligne" }, oeufs(k + 1, COULEURS_OEUFS[k]), k === 0 ? "Pour tous" : k === 1 ? "En plus pour 2 œufs" : "En plus pour 3 œufs"),
    h("textarea", { id: "dictee-" + k, rows: 2, onchange: () => {
      etat.dictees[etat.focus] = zones.map(z => z.querySelector("textarea").value.split(/[\n,]+/).map(x => x.trim()).filter(Boolean));
      etat.regle = true; sauver();
    } }, (cols[k] || []).join("\n"))));

  const ecriture = h("div", { class: "modes" }, [["script", "Script"], ["cursive", "Attachée"]].map(([v, t]) =>
    h("button", { "aria-pressed": String(etat.ecriture === v), class: v === "cursive" ? "f-cur" : "f-scr", onclick: () => { etat.ecriture = v; refaire(); } }, t)));

  const lus = Object.values(etat.lus).reduce((a, b) => a + b, 0);
  const resistent = Object.entries(etat.difficiles).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([m]) => m);

  let confirme = false;
  const raz = h("button", { class: "btn discret danger", onclick: () => {
    if (!confirme) { confirme = true; raz.lastChild.textContent = "Confirmer : tout effacer"; return; }
    etat = etatPropre(null); sauver(); appliquerAffichage(); accueil();
  } }, ic("encore"), h("span", null, "Tout remettre à zéro"));

  ajoute(racine, 
    barre("Coin des parents"),
    h("div", { class: "reglages" },
      typeof guide === "function" ? bloc("Le guide du CP", "La méthode de la classe, l'année en un coup d'œil, ce qui est évalué en janvier, la routine à la maison et les bons gestes.",
        h("div", { class: "ligne" }, h("button", { class: "btn plein", onclick: guide }, ic("guide"), "Ouvrir le guide"),
          typeof bilan === "function" ? h("button", { class: "btn", onclick: bilan }, ic("parent"), "Le bilan") : null)) : null,
      bloc("Où en est la classe ?", "Choisissez le dernier son vu en classe : les sons d'avant se cochent, et celui-ci devient le son de la semaine. Pour la période 1, l'ordre est celui des dictées de la classe : a, i, puis r, o, l, é, u, s, f, e, m, ch, ou.",
        h("div", { class: "ligne" }, h("label", { for: "classe-en" }, "La classe en est à"), classeEn)),
      bloc("Les sons déjà vus", "Touchez un son pour le cocher ou le décocher, si la classe ne suit pas cet ordre. Le son de la semaine revient plus souvent dans les exercices.",
        coches, h("div", { class: "ligne" }, h("label", { for: "son-semaine" }, "Le son de la semaine"), semaine)),
      bloc("Les mots-outils appris", "Les mots de la boîte à outils du fichier : ils se reconnaissent sans se déchiffrer et s'affichent sans arcs, comme dans le fichier. Une phrase n'est proposée que si tous ses mots-outils sont cochés.", outils),
      bloc("Son groupe en dictée", "Comme sur la feuille des dictées : 1, 2 ou 3 œufs. Le groupe règle aussi la longueur des mots et des phrases proposés.", groupes),
      bloc("La dictée de la semaine : son « " + son.g[0] + " »", DICTEES[etat.focus] ? "Reprise de la feuille de la classe. Vous pouvez la modifier : un mot ou une syllabe par ligne." : "Recopiez ici la dictée de la semaine, un mot ou une syllabe par ligne : elle servira dans « J'écris ».",
        ...zones, etat.dictees[etat.focus] && DICTEES[etat.focus] ? h("button", { class: "btn discret", onclick: () => { delete etat.dictees[etat.focus]; refaire(); } }, ic("encore"), "Revenir à la liste de la classe") : null),
      bloc("L'écriture et les aides", "Retirez les aides quand elle n'en a plus besoin. Les arcs et les lettres grises reprennent les conventions du fichier de la classe.",
        h("div", { class: "ligne" }, h("span", null, "Écriture des mots :"), ecriture),
        interrupteur("arcs", "Arcs sous les syllabes", etat.arcs, v => { etat.arcs = v; refaire(); }),
        interrupteur("muettes", "Lettres muettes en gris", etat.muettes, v => { etat.muettes = v; refaire(); }),
        interrupteur("couleurs", "Syllabes en couleur, une sur deux", etat.couleurs, v => { etat.couleurs = v; refaire(); }),
        interrupteur("bruit", "Petits sons de réussite", etat.bruit, v => { etat.bruit = v; refaire(); })),
      blocFiches(),
      blocVoix(),
      bloc("Où elle en est", null,
        h("div", { class: "chiffres" },
          h("div", null, h("b", null, etat.seances), h("span", null, "séances finies")),
          h("div", null, h("b", null, lus), h("span", null, "mots lus")),
          h("div", null, h("b", null, Object.keys(etat.lus).length), h("span", null, "mots différents")),
          h("div", null, h("b", null, etat.album.length), h("span", null, "autocollants"))),
        etat.derniere ? h("p", null, "Dernière séance : " + new Date(etat.derniere + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }) + ".") : null,
        resistent.length ? h("p", null, "Les mots qui résistent, à relire : ", h("b", { class: "lecture" }, resistent.join(", ")), ". Ils reviennent plus souvent.") : null),
      bloc("La méthode en six gestes", null, h("ol", { class: "methode" },
        h("li", null, "On apprend le son des lettres, pas leur nom : « mmm », et non « ème »."),
        h("li", null, "On fusionne : un son tenu glisse vers le suivant, « mmm… a » donne « ma ». C'est le cœur du CP."),
        h("li", null, "On ne lit que des mots faits de sons déjà vus. L'image vient après la lecture, jamais avant : on ne devine pas."),
        h("li", null, "On écrit ce qu'on lit : dicter des syllabes et des mots fixe les sons."),
        h("li", null, "On comprend : après la phrase, une question. Et on relit pour lire plus vite."),
        h("li", null, "Peu et souvent : dix minutes chaque jour valent mieux qu'une heure le dimanche. On s'arrête avant la fatigue."))),
      bloc("Sauvegarde", sauvegarde === "compte"
        ? "Les réglages et les progrès sont enregistrés dans votre compte : vous les retrouvez depuis un autre ordinateur."
        : "Les réglages et les progrès sont enregistrés dans ce navigateur, sur cet ordinateur.", raz)));
  window.scrollTo(0, y);
}

function blocFiches() {
  const base = SUR_SITE ? "assets/fiches/" : "https://forneris.fr/lire/assets/fiches/";
  const lien = (fichier, texte, cls) => h("a", { class: cls || "", href: base + fichier, target: "_blank", rel: "noopener" }, texte);
  return bloc("Les fiches d'écriture à imprimer",
    "Une fiche par son, dans l'ordre de la classe : la lettre en attachée, son point de départ, le geste à dire en traçant, puis des syllabes et des mots qu'elle sait lire. Dix minutes par fiche. Imprimez en taille réelle (100 %), sans « ajuster à la page » : les lignes sont aux mesures du cahier de CP.",
    h("div", { class: "coches fiches" }, SONS.map((s, k) => lien("fiche-" + String(k + 1).padStart(2, "0") + ".pdf", s.g[0],
      (etat.sons.includes(s.id) ? "vu" : "") + (s.id === etat.focus ? " focus" : "")))),
    h("div", { class: "ligne" }, lien("periode-1.pdf", "Toute la période 1 (13 fiches)", "btn"), lien("toutes-les-fiches.pdf", "Toutes les fiches", "btn discret")));
}

function blocVoix() {
  if (!Voix.ok) return bloc("La lecture à voix haute", "Ce navigateur ne sait pas lire à voix haute. Chrome, Edge et Safari le font.");
  const sansFr = Voix.toutes > 0 && !Voix.liste.length;
  const choix = Voix.liste.length > 1 ? h("div", { class: "ligne" }, h("label", { for: "voix" }, "La voix"),
    h("select", { id: "voix", onchange: e => { etat.voix = e.target.value; Voix.charger(); sauver(); Voix.dire("Bonjour ! On lit ensemble ?"); } },
      Voix.liste.map(v => h("option", { value: v.voiceURI, selected: Voix.choisie && v.voiceURI === Voix.choisie.voiceURI ? true : null }, v.name + " (" + v.lang + ")")))) : null;
  return bloc("La lecture à voix haute",
    sansFr ? "Aucune voix française n'est installée sur cet ordinateur : la lecture à voix haute reste muette. Elle s'ajoute dans les réglages de langue du système."
      : "La voix lit le mot une fois qu'elle l'a lu, la phrase après sa lecture, et dicte dans « J'écris ». Elle ne dit jamais un son seul : une voix de synthèse dirait le nom de la lettre, « èle », au lieu de son son.",
    interrupteur("voix-haute", "Lire les mots à voix haute", etat.voixHaute, v => { etat.voixHaute = v; etat.regle = true; sauver(); parents(); }),
    choix,
    etat.voixHaute && !sansFr ? h("button", { class: "btn", onclick: () => Voix.dire("Bonjour ! On lit ensemble ?") }, ic("haut"), "Essayer la voix") : null);
}

// ---------- Démarrage ----------

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.closest && e.target.closest("button,select,textarea,summary")) return;
  const b = [...document.querySelectorAll(".adulte .btn.ok, .adulte .btn.plein")].filter(x => !x.hidden).pop();
  if (b) { e.preventDefault(); b.click(); }
});
appliquerAffichage();
accueil();
brancherNuage();

</script>
</body>
</html>
