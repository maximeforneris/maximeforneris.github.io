      reponse: c.id, cle: "ranger:" + c.id, domaine: "vocabulaire", choix: boites.map(b => b.id),
      dire: "Dans quelle boîte ranges-tu " + it.nom + " ?",
      // la phrase à faire dire suit l'image montrée : « Un tee-shirt, c'est un vêtement. »
      astuce: "La voix nomme l'image et les boîtes ; elle choisit. Demandez-lui de dire la phrase : « "
        + it.nom.charAt(0).toUpperCase() + it.nom.slice(1)
        + (/^des /.test(it.nom) ? ", ce sont des " + c.nom.replace(/^les /, "") : ", c'est " + c.un) + ". »",
      rendre(feuille, repondre) {
        bts = boites.map(b => h("button", { onclick: ev => repondre(b.id, ev.currentTarget) }, h("b", null, b.nom),
          h("span", { "aria-hidden": "true" }, tirer(b.items.filter(x => x !== it), 2).map(x => x.e).join(""))));
        ajoute(feuille, consigne("Dans quelle boîte ?"), h("div", { class: "langue-objet", role: "img", "aria-label": it.nom }, it.e),
          h("div", { class: "langue-boites" }, bts));
      },
      apres() { marquer(bts[boites.indexOf(c)]); Voix.dire(Cmp.cap(it.nom) + ", ça va avec " + c.nom + "."); }
    };
  }

  // L'intrus
  function qIntrus() {
    const c = hasard(CATS), d = autresCats(c, 1)[0];
    const trois = tirer(c.items, 3), intrus = hasard(d.items.filter(x => !/^(des|du) /.test(x.nom)));
    const cases = melanger([...trois, intrus]), bonne = cases.indexOf(intrus);
    let bts = [];
    return {
      reponse: bonne, cle: "intrus:" + c.id, domaine: "vocabulaire", choix: cases.map((x, i) => i),
      dire: "Trouve l'intrus : l'image qui ne va pas avec les autres.",
      astuce: "Après sa réponse, demandez-lui pourquoi : les trois autres, ce sont " + c.nom + ".",
      rendre(feuille, repondre) {
        bts = cases.map((x, i) => h("button", { "aria-label": x.nom, onclick: ev => repondre(i, ev.currentTarget) }, x.e));
        ajoute(feuille, consigne("Trouve l'intrus."), h("div", { class: "langue-quatre" }, bts));
      },
      apres() { marquer(bts[bonne]); Voix.dire("L'intrus, c'est " + intrus.nom + " : ce n'est pas " + c.un + "."); }
    };
  }

  // Les contraires
  function qContraires() {
    const p = hasard(LANGUE_CONTRAIRES), sens = Math.random() < 0.5;
    const [mot, img, contraire, img2] = sens ? p : [p[2], p[3], p[0], p[1]];
    const autres = tirer(LANGUE_CONTRAIRES.filter(x => x !== p), etat.niveau === 1 ? 1 : 2).map(x => Math.random() < 0.5 ? [x[0], x[1]] : [x[2], x[3]]);
    const opts = melanger([[contraire, img2], ...autres]);
    const bonne = opts.findIndex(o => o[0] === contraire);
    let bts = [];
    return {
      reponse: bonne, cle: "contraire:" + p[0], domaine: "vocabulaire", choix: opts.map((o, i) => i),
      dire: "Quel est le contraire de « " + mot + " » ?",
      astuce: "Les petits mots sous les images sont pour vous. Après, faites-lui dire : « Le contraire de " + mot + ", c'est " + contraire + ". »",
      rendre(feuille, repondre) {
        bts = opts.map((o, i) => h("button", { "aria-label": o[0], onclick: ev => repondre(i, ev.currentTarget) }, image(o[1]), h("small", null, o[0])));
        ajoute(feuille, consigne("Quel est le contraire ?"), h("div", { class: "langue-cible" }, image(img), h("small", null, mot)),
          h("div", { class: "langue-choix" }, bts));
      },
      apres() { marquer(bts[bonne]); Voix.dire("Le contraire de " + mot + ", c'est " + contraire + "."); }
    };
  }

  // Phrase ou pas phrase ?
  function qPhrase() {
    const l = phrasesLisibles();
    if (!l.length) return null;
    const p = hasard(l), mots = p.replace(/\.$/, "").split(" ");
    if (mots.length < 3) return null;
    const genre = tirer(["phrase", "melange", "coupe", "sans"], 1, x => ({ phrase: 5, melange: 3, coupe: 2, sans: 1 })[x])[0];
    let texte = p;
    if (genre === "melange") {
      let m = mots.slice().reverse();
      if (m.join(" ") === mots.join(" ")) m = melanger(mots);
      texte = Cmp.cap(m.map(minuscule).join(" ")) + ".";
    } else if (genre === "coupe") texte = mots.slice(0, -1).join(" ") + ".";
    else if (genre === "sans") texte = minuscule(mots[0]) + " " + mots.slice(1).join(" ");
    if (genre !== "phrase" && texte === p) return null;
    const oui = genre === "phrase";
    const POURQUOI = { phrase: "C'est une phrase : elle veut dire quelque chose, elle commence par une majuscule et finit par un point.",
      melange: "Ce n'est pas une phrase : les mots sont dans le désordre.", coupe: "Ce n'est pas une phrase : il manque la fin.",
      sans: "Ce n'est pas une phrase bien écrite : il manque la majuscule et le point." };
    let bO, bN;
    return {
      reponse: oui ? "oui" : "non", cle: "phrase:" + genre, domaine: "grammaire", choix: ["oui", "non"], lu: [texte],
      dire: "Lis. Est-ce que c'est une phrase ?",
      astuce: "Une phrase veut dire quelque chose, commence par une majuscule et finit par un point.",
      rendre(feuille, repondre) {
        bO = h("button", { onclick: ev => repondre("oui", ev.currentTarget) }, h("span", { "aria-hidden": "true" }, "✅"), "C'est une phrase");
        bN = h("button", { onclick: ev => repondre("non", ev.currentTarget) }, h("span", { "aria-hidden": "true" }, "❌"), "Pas une phrase");
        ajoute(feuille, consigne("Est-ce une phrase ?"), Cmp.phrase(texte), h("div", { class: "langue-oui-non" }, bO, bN));
      },
      apres() { marquer(oui ? bO : bN); Voix.dire(POURQUOI[genre]); }
    };
  }

  // La phrase bien écrite
  function qBienEcrite() {
    const l = phrasesLisibles().filter(p => p.split(" ").length >= 3);
    if (!l.length) return null;
    const p = hasard(l), mots = p.replace(/\.$/, "").split(" ");
    const vs = [{ t: p, ok: 1 }];
    if (!PROPRE.has(mots[0].toLowerCase())) vs.push({ t: minuscule(mots[0]) + " " + mots.slice(1).join(" ") + ".", pourquoi: "il manque la majuscule" });
    vs.push({ t: mots.join(" "), pourquoi: "il manque le point" });
    const milieu = mots.findIndex((w, i) => i > 0 && !PROPRE.has(w.toLowerCase()) && w.length > 2);
    if (etat.niveau > 1 && milieu > 0 && vs.length < 3) vs.push({ t: mots.map((w, i) => i === milieu ? Cmp.cap(w) : w).join(" ") + ".", pourquoi: "une majuscule est au milieu" });
    if (vs.length < 2) return null;
    const ordre = melanger(vs), bonne = ordre.findIndex(v => v.ok);
    let bts = [];
    return {
      reponse: bonne, cle: "bien-ecrite", domaine: "grammaire", choix: ordre.map((v, i) => i), lu: ordre.map(v => v.t),
      dire: "Quelle phrase est bien écrite ?",
      astuce: "Elle lit les phrases et cherche la majuscule au début et le point à la fin.",
      rendre(feuille, repondre) {
        bts = ordre.map((v, i) => h("button", { class: "lecture moyen", onclick: ev => repondre(i, ev.currentTarget) }, rendreJetons(jetons(v.t))));
        ajoute(feuille, consigne("Touche la phrase bien écrite."), h("div", { class: "langue-versions" }, bts));
      },
      apres() { marquer(bts[bonne]); Voix.dire("Celle-ci est bien écrite : une majuscule au début, un point à la fin."); }
    };
  }

  // Le ou la, un ou une
  function qGenre() {
    const une = lit("une");
    const modes = ["le"].concat(une ? ["un"] : []);
    const mode = hasard(modes);
    const l = NOMS.filter(n => lit(n.f) && (mode === "un" || !voyelle(n.f)));
    if (!l.length) return null;
    const n = tirer(l, 1, x => (x.e ? 2 : 1) * (Cmp.aFocus(x.f) ? 3 : 1))[0];
    const dets = mode === "le" ? ["le", "la"] : ["un", "une"];
    const bon = dets[n.g === "f" ? 1 : 0];
    let bts = [], trou;
    return {
      reponse: bon, cle: "genre:" + mode, domaine: "grammaire", choix: dets, lu: [n.f, ...dets],
      dire: "Quel petit mot va avant ce mot : " + dets[0] + " ou " + dets[1] + " ?",
      astuce: "Elle lit le mot, puis essaie à voix haute : « " + dets[0] + " " + n.f + " ? " + dets[1] + " " + n.f + " ? » L'oreille entend lequel va.",
      rendre(feuille, repondre) {
        trou = h("span", { class: "langue-trou" }, "?");
        bts = dets.map(d => h("button", { class: "lecture moyen", onclick: ev => repondre(d, ev.currentTarget) }, rendreJetons(jetons(d))));
        ajoute(feuille, consigne(Cmp.cap(dets[0]) + " ou " + dets[1] + " ?"), n.e ? h("div", { class: "image", "aria-hidden": "true" }, n.e) : null,
          h("div", { class: "lecture grand" }, trou, rendreJetons(jetons(n.f))), h("div", { class: "langue-det" }, bts));
      },
      apres() { trou.replaceChildren(...rendreJetons(jetons(bon))); marquer(bts[dets.indexOf(bon)]); Voix.dire(bon + " " + n.f); }
    };
  }

  // Un ou des : le s du pluriel ne s'entend pas, mais il s'écrit.
  function qNombre() {
    const det = lit("des") ? ["un", "une", "des"] : lit("les") ? ["le", "la", "les"] : null;
    if (!det) return null;
    const l = NOMS.filter(n => n.pl && n.e && lit(n.f) && lit(n.pl) && lit(det[n.g === "f" ? 1 : 0]) && (det[0] === "un" || !voyelle(n.f)));
    if (!l.length) return null;
    const n = tirer(l, 1, x => Cmp.aFocus(x.f) ? 3 : 1)[0];
    const sing = det[n.g === "f" ? 1 : 0] + " " + n.f, plur = det[2] + " " + n.pl;
    const plusieurs = Math.random() < 0.5, sens = Math.random() < 0.5 ? "image" : "mot";
    const imgs = [h("span", null, n.e), h("span", null, n.e.repeat(3))];
    let bts = [];
    const bonne = plusieurs ? 1 : 0;
    return {
      reponse: bonne, cle: "nombre:" + sens, domaine: "grammaire", choix: [0, 1], lu: [sing, plur],
      dire: sens === "image" ? "Quel mot va avec l'image ?" : "Lis, et touche la bonne image.",
      astuce: "On n'entend pas le s de « " + n.pl + " », mais on l'écrit : le petit mot « " + det[2] + " » dit qu'il y en a plusieurs.",
      rendre(feuille, repondre) {
        if (sens === "image") {
          bts = [sing, plur].map((t, i) => h("button", { class: "lecture moyen", onclick: ev => repondre(i, ev.currentTarget) }, rendreJetons(jetons(t))));
          ajoute(feuille, consigne("Quel mot va avec l'image ?"), h("div", { class: "langue-tas", role: "img", "aria-label": plusieurs ? "Plusieurs" : "Un seul" }, imgs[bonne]),
            h("div", { class: "langue-det" }, bts));
        } else {
          bts = imgs.map((im, i) => h("button", { class: "langue-tas", onclick: ev => repondre(i, ev.currentTarget) }, im));
          ajoute(feuille, consigne("Touche la bonne image."), h("div", { class: "lecture grand" }, rendreJetons(jetons(plusieurs ? plur : sing))),
            h("div", { class: "langue-det" }, bts));
        }
      },
      apres() { marquer(bts[bonne]); Voix.dire(sing + ". " + plur + ". On n'entend pas le s, mais on l'écrit."); }
    };
  }

  const essayer = f => { for (let i = 0; i < 10; i++) { const q = f(); if (q) return q; } return null; };
  const JEUX = {
    ranger: { titre: "Dans quelle boîte ?", pic: "🗃️", court: "Je range les images", q: qRanger, dom: "vocabulaire",
      conseil: ["La voix nomme l'image ; elle la range dans la boîte qui va. Faites-lui dire la phrase : « La pomme, c'est un fruit. »", "Les mots des catégories (fruits, légumes, véhicules…) sont ceux de la classe de CP."] },
    intrus: { titre: "L'intrus", pic: "🔎", court: "Je trouve l'image qui ne va pas", q: qIntrus, dom: "vocabulaire",
      conseil: ["Trois images vont ensemble, une non. Faites-lui dire pourquoi : c'est cela qui construit le vocabulaire.", "Nommez les images ensemble si elle hésite : on ne range bien que ce qu'on sait nommer."] },
    contraires: { titre: "Les contraires", pic: "🔁", court: "Chaud, froid : je trouve le contraire", q: qContraires, dom: "vocabulaire",
      conseil: ["La voix dit un mot ; elle touche l'image du contraire. Les petits mots sous les images sont pour vous.", "Jouez-le aussi à l'oral, sans écran : « Le contraire de grand ? »"] },
    phrase: { titre: "Phrase ou pas ?", pic: "✅", court: "Je dis si c'est une phrase", q: qPhrase, dom: "grammaire",
      conseil: ["Une phrase veut dire quelque chose, commence par une majuscule et finit par un point.", "Les mots mélangés ou la phrase qui s'arrête au milieu ne sont pas des phrases, même avec majuscule et point."] },
    bien: { titre: "La phrase bien écrite", pic: "✍️", court: "Je trouve la majuscule et le point", q: qBienEcrite, dom: "grammaire",
      conseil: ["Trois fois la même phrase : une seule a sa majuscule au début et son point à la fin.", "Les prénoms gardent toujours leur majuscule."] },
    genre: { titre: "Le ou la ?", pic: "🔤", court: "Le rat, la fée : le bon petit mot", q: qGenre, dom: "grammaire",
      conseil: ["Elle lit le mot, puis essaie les deux à voix haute : l'oreille sait. « Un » et « une » arrivent quand le mot-outil « une » est appris.", "Les mots qui commencent par une voyelle (l'os, l'âne) ne sont proposés qu'avec un ou une."] },
    nombre: { titre: "Un ou des ?", pic: "🐀", court: "Un rat, des rats : le s qu'on n'entend pas", q: qNombre, dom: "grammaire",
      conseil: ["On n'entend pas le s du pluriel : c'est le petit mot « des » (ou « les ») qui dit qu'il y en a plusieurs.", "Ce jeu arrive quand le mot-outil « des » ou « les » est appris (coin des parents)."] }
  };
  const IDS = Object.keys(JEUX), series = {};
  IDS.forEach(id => { const J = JEUX[id]; series[id] = serie({ id: "langue-" + id, titre: J.titre, icone: "langue", conseil: J.conseil, domaine: J.dom, n: 6, question: () => essayer(J.q) }); });
  const melange = (id, titre, ids, conseils) => serie({ id: "langue-" + id, titre, icone: "langue", domaine: JEUX[ids[0]].dom, n: 6, conseil: conseils,
    question: () => { const l = ids.filter(x => faisable(x)); for (let i = 0; i < 6 && l.length; i++) { const q = essayer(JEUX[hasard(l)].q); if (q) return q; } return null; } });
  const faisable = id => !!essayer(JEUX[id].q);
  series.vocabulaire = melange("vocabulaire", "Les mots", ["ranger", "intrus", "contraires"], ["La voix nomme, elle choisit : catégories, intrus, contraires."]);
  series.grammaire = melange("grammaire", "Les phrases", ["phrase", "bien", "genre", "nombre"], ["Elle lit seule : phrase ou pas, majuscule et point, le ou la, un ou des."]);

  // Combien de questions différentes chaque jeu peut offrir avec les réglages (pour les essais).
  function offre(e) {
    e = e || etat;
    const L = t => Cmp.lisibleTexte(t, e);
    const ph = PHRASES_L.filter(p => phraseLisible(p, e)).length + Cmp.combien(e, ["A", "B", "C", "D"]);
    const nb = L("des") ? NOMS.filter(n => n.pl && n.e && L(n.f) && L(n.pl) && L(n.g === "f" ? "une" : "un")).length
      : L("les") ? NOMS.filter(n => n.pl && n.e && L(n.f) && L(n.pl) && !voyelle(n.f)).length : 0;
    return {
      ranger: CATS.reduce((s, c) => s + c.items.length, 0), intrus: CATS.length * 3, contraires: LANGUE_CONTRAIRES.length * 2,
      phrase: ph, bien: ph,
      genre: NOMS.filter(n => L(n.f) && (!voyelle(n.f) || L("une"))).length, nombre: nb
    };
  }

  function ouvrir() {
    const o = offre();
    Cmp.menu("Les mots et les phrases", "Des mots qu'on range, des phrases qu'on regarde de près.", [
      ...["ranger", "intrus", "contraires"].map(id => ({ titre: JEUX[id].titre, pic: JEUX[id].pic, court: JEUX[id].court, n: null, ouvrir: () => jouerSerie(series[id]) })),
      ...["phrase", "bien", "genre", "nombre"].map(id => ({ titre: JEUX[id].titre, pic: JEUX[id].pic, court: JEUX[id].court, n: o[id] ? null : 0, ouvrir: () => jouerSerie(series[id]) }))
    ], ["Les trois premiers jeux sont du vocabulaire, à l'oral : la voix nomme, elle choisit une image.",
      "Les quatre suivants sont de la petite grammaire du CP : elle lit seule des phrases faites de sons qu'elle connaît.",
      "Un jeu grisé arrive plus tard, avec d'autres sons ou mots-outils."],
    "Choisissez un jeu. Les trois premiers se jouent à l'oral ; les quatre suivants, elle lit seule.");
  }

  rubrique({ id: "langue", onglet: "lire", section: "Les mots et les phrases", ordre: 10, titre: "Les mots et les phrases", icone: "langue",
    court: "Ranger, les contraires, la phrase, le ou la, un ou des", ouvrir });
  pointEtape("vocabulaire", "Le vocabulaire", suite => jouerSerie(series.vocabulaire, { n: 5, evaluation: true, finir: suite }));
  pointEtape("grammaire", "La phrase, le genre, le nombre", suite => jouerSerie(series.grammaire, { n: 5, evaluation: true, finir: suite }));

  Cmp.langue = { series, offre, JEUX };
})();

// ---------- Les lettres : leur nom, leur son, leurs quatre écritures ----------
// Ici, et seulement ici, la voix dit le NOM des lettres : c'est l'objet de l'exercice.
// Le son d'une lettre, lui, n'est jamais dit par la voix : on montre l'image du son de la classe.
(() => {
  const ALPHA = "abcdefghijklmnopqrstuvwxyz".split("");
  // Le nom écrit pour l'adulte, et le même nom écrit pour que la voix française le dise bien
  // (relu sur la voix de Windows : « ème » y devient « ième », « èss » s'y bégaie, « cu » s'y épelle).
  const NOM = { a: "a", b: "bé", c: "cé", d: "dé", e: "e", f: "èfe", g: "gé", h: "ache", i: "i", j: "ji", k: "ka", l: "èle", m: "ème",
    n: "ène", o: "o", p: "pé", q: "qu", r: "èr", s: "èsse", t: "té", u: "u", v: "vé", w: "double vé", x: "ixe", y: "i grec", z: "zède" };
  const DIT = { a: "a", b: "bé", c: "sé", d: "dé", e: "e", f: "èf", g: "gé", h: "ache", i: "i", j: "ji", k: "ka", l: "èl", m: "èm",
    n: "ène", o: "o", p: "pé", q: "q", r: "erre", s: "esse", t: "té", u: "u", v: "vé", w: "double vé", x: "ixe", y: "i grec", z: "zède" };
  // Les lettres qui se ressemblent à l'œil, minuscules puis capitales, et à l'oreille.
  const OEIL = [["b", "d", "p", "q"], ["m", "n", "u", "h", "r"], ["a", "o", "e", "c"], ["i", "l", "j", "t", "f"], ["v", "w", "y", "x"], ["s", "z"], ["g", "q", "y", "j"], ["k", "h", "x"]];
  const OEIL_CAP = [["e", "f", "l", "t"], ["o", "q", "c", "g", "d"], ["m", "n", "w", "v"], ["i", "j", "l", "t"], ["p", "r", "b", "d"], ["u", "v", "y"], ["k", "x", "y"], ["s", "z"]];
  const OREILLE = [["b", "c", "d", "g", "p", "t", "v", "w"], ["f", "l", "m", "n", "r", "s"], ["i", "j", "y"], ["a", "k", "h"], ["q", "u"], ["o", "x", "z"]];
  // La lettre qui fait chaque son, pour les sons d'une seule lettre (é et è comptent ici).
  const LETTRE_DU_SON = { a: "a", i: "i", r: "r", o: "o", l: "l", "é": "é", u: "u", s: "s", f: "f", e: "e", m: "m", n: "n", p: "p",
    t: "t", v: "v", d: "d", j: "j", b: "b", k: "c", "è": "è", z: "z", g: "g" };

  const ECRITURES = {
    script: { nom: "en script", cur: false, cap: false }, attachee: { nom: "en attachée", cur: true, cap: false },
    capitale: { nom: "en capitale", cur: false, cap: true }, capattachee: { nom: "en capitale attachée", cur: true, cap: true }
  };
  const lettre = (l, ecr, cls) => h("span", { class: "lettres-l " + (ECRITURES[ecr].cur ? "f-cur" : "f-scr") + (cls ? " " + cls : "") },
    ECRITURES[ecr].cap ? l.toUpperCase() : l);
  // La lettre telle que l'enfant l'écrit en classe : la police de lecture suit le réglage script / attachée.
  const lettreClasse = (l, cap) => h("span", { class: "lettres-l lecture" }, cap ? l.toUpperCase() : l);

  const vues = () => [...new Set(etat.sons.map(s => SON[s].g[0]).filter(g => g.length === 1))];
  const poids = l => (vues().includes(l) ? 3 : 1);
  const recents = [];
  function tirerLettre(liste) {
    const l = tirer(liste || ALPHA, 1, x => recents.includes(x) ? 0.05 : poids(x))[0];
    recents.push(l); if (recents.length > 8) recents.shift();
    return l;
  }
  // Trois intrus : d'abord des sosies, puis au hasard.
  function sosies(l, groupes, n, exclus) {
    const pres = [...new Set(groupes.filter(g => g.includes(l)).flat())].filter(x => x !== l && !(exclus || []).includes(x));
    const out = tirer(pres, n);
    if (out.length < n) out.push(...tirer(ALPHA.filter(x => x !== l && !out.includes(x) && !(exclus || []).includes(x)), n - out.length));
    return out;
  }
  function duRepere(id) {

// ---------- Je lis vite : la fluence, une minute chrono ----------
// Le format du point d'étape de mi-CP : lire à voix haute le plus de mots possible en une minute.
// L'adulte touche les mots ratés ; la page compte les mots lus correctement par minute (MCLM).
// Repères de fin de CP (programme 2024, tels que les académies les relaient) : 30 mots sur un
// texte jamais lu, 50 sur un texte préparé. Le texte de la semaine reste le même sept jours :
// c'est la lecture répétée, qui fait monter le score et la confiance.

ICONES.chrono = '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/>';
const FLUENCE_REPERES = [{ v: 30, t: "30 : fin de CP, texte jamais lu" }, { v: 50, t: "50 : fin de CP, texte préparé" }];

function semaineIso(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const j = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - j);
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 864e5 + 1) / 7);
}

// Les textes : les histoires entièrement lisibles avec ses sons (toutes les lignes), puis,
// à défaut, un texte fait des phrases lisibles.
function textesFluence() {
  const tous = Object.assign({}, etat, { niveau: 3 });
  const out = HISTOIRES_L.map(hh => {
    const lignes = pagesDuGroupe(hh, tous).flatMap(p => p.lignes);
    const js = lignes.flatMap(l => l.jetons);
    return js.length && js.every(j => j.ponct || jetonLisible(j, etat)) ? { id: "h:" + hh.id, titre: hh.titre, lignes: lignes.map(l => l.jetons) } : null;
  }).filter(Boolean);
  if (!out.length) {
    const ps = PHRASES_L.filter(p => phraseLisible(p, etat)).slice(0, 8);
    if (ps.length >= 3) out.push({ id: "phrases", titre: "Petites phrases", lignes: ps.map(p => p.jetons) });
  }
  return out;
}
function texteDeLaSemaine(frais) {
  const t = textesFluence();
  if (!t.length) return null;
  if (!frais) return t[semaineIso() % t.length];
  const lus = new Set(etat.fluence.map(f => f.id));
  return t.find(x => !lus.has(x.id)) || hasard(t);
}
function motsFluence(n) {
  let l = parNiveau(motsLisibles(etat), etat, 20).filter(m => m.forme.length > 1);
  if (!l.length) return [];
  const out = [];
  while (out.length < n) out.push(...melanger(l));
  return out.slice(0, n);
}

// mode : "mots" ou "texte" · opts : { finir(score), etape: "lire-mots" | "lire-texte", frais }
function lisvite(mode, opts) {
  opts = opts || {};
  ecran = "lisvite";
  const texte = mode === "texte" ? texteDeLaSemaine(opts.frais) : null;
  const mots = mode === "mots" ? motsFluence(etat.niveau === 1 ? 30 : 45) : null;
  const choixMode = opts.finir ? null : h("div", { class: "modes", role: "group", "aria-label": "Ce qu'on lit" },
    [["mots", "Des mots"], ["texte", "Le texte de la semaine"]].map(([m, t]) =>
      h("button", { "aria-pressed": String(mode === m), onclick: () => lisvite(m) }, t)));
  const { feuille, adulte } = ecranModule("Je lis vite", h("div", { class: "ligne" }, pastillesSeance(), choixMode));

// La courbe des scores, à l'échelle, avec les deux repères de fin de CP.
function graphiqueFluence(type) {
  const pts = etat.fluence.filter(f => !type || f.type === type).slice(-12);
  if (!pts.length) return h("p", { class: "lisvite-vide" }, "La courbe apparaîtra après la première lecture chronométrée.");
  const L = 640, H = 240, g = 44, d = 16, hautG = 16, basG = 34;
  const max = Math.max(60, ...pts.map(p => p.mclm)) + 5;
  const x = i => g + (pts.length === 1 ? (L - g - d) / 2 : i * (L - g - d) / (pts.length - 1));
  const y = v => H - basG - v * (H - basG - hautG) / max;
  const NS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 " + L + " " + H); s.setAttribute("class", "lisvite-courbe"); s.setAttribute("role", "img");
  s.setAttribute("aria-label", "Mots lus par minute : " + pts.map(p => p.mclm).join(", "));
  let c = "";
  for (let v = 0; v <= max; v += 10) c += '<line class="fl-grille" x1="' + g + '" x2="' + (L - d) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="fl-txt" x="' + (g - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + "</text>";
  FLUENCE_REPERES.forEach(r => { c += '<line class="fl-cible" x1="' + g + '" x2="' + (L - d) + '" y1="' + y(r.v) + '" y2="' + y(r.v) + '"/><text class="fl-cible-t" x="' + (L - d) + '" y="' + (y(r.v) - 5) + '" text-anchor="end">' + r.t + "</text>"; });
  c += '<polyline class="fl-ligne" points="' + pts.map((p, i) => x(i) + "," + y(p.mclm)).join(" ") + '"/>';
  pts.forEach((p, i) => {
    c += '<circle class="fl-point" cx="' + x(i) + '" cy="' + y(p.mclm) + '" r="' + (i === pts.length - 1 ? 6 : 4) + '"/>';
    c += '<text class="fl-txt" x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle">' + p.d.slice(8, 10) + "/" + p.d.slice(5, 7) + "</text>";
  });
  const der = pts[pts.length - 1];
  c += '<text class="fl-val" x="' + x(pts.length - 1) + '" y="' + (y(der.mclm) - 12) + '" text-anchor="middle">' + der.mclm + "</text>";
  s.innerHTML = c;
  return h("figure", { class: "lisvite-fig" }, s, h("figcaption", null, type === "texte" ? "Le texte, en mots par minute" : type === "mots" ? "Les listes de mots, en mots par minute" : "Mots par minute"));
}

    function controle1() {

      places.forEach((p, i) => p.el.classList.toggle("maphrase-faux", p.t !== mots[i]));
      if (bon || evaluation) {
        if (!bon) rate = true;
        places.forEach(p => p.el.classList.add("maphrase-juste"));
        bip(bon ? "ok" : "non");
        return setTimeout(phase2, bon ? 700 : 400);
      }
      rate = true; essais++; bip("non"); zone.classList.add("secoue"); setTimeout(() => zone.classList.remove("secoue"), 420);
      bandeAdulte(adulte, [astuce("Les places orange sont à revoir : touchez-les pour rendre l'étiquette. Faites réécouter la phrase, mot par mot."), souffle, voir]);
    }
    ajoute(feuille, ecoute || h("div", { class: "oreille" }, ic("oreille"), "Écoute bien."), h("p", { class: "consigne", style: "align-self:center" }, "Compose la phrase avec les étiquettes."), zone, tas, verifier);
    bandeAdulte(adulte, [astuce(astuceDictee), souffle, voir]);
    if (ecoute) setTimeout(() => Voix.dire(texte, true), 450);

    // Phase 2 : chaque mot qu'on déchiffre s'écrit avec des étiquettes-lettres ; les mots-outils restent.
    function phase2() {
      feuille.replaceChildren();
      const blocs = mots.map(m => ({ m, e: aEcrire(m) }));
      const cases = [];
      const ecrit = h("div", { class: "maphrase-ecrit lecture" }, blocs.map(b => {
        if (!b.e) return h("div", { class: "maphrase-bloc" }, h("span", { class: "maphrase-fixe" }, rendreJetons(jetons(b.m))));
        const cs = b.e.cases.map((c, j) => {
          const s = { attendu: c, t: null };
          s.el = h("button", { class: "case" + (b.e.chut[j] ? " chut" : ""), "aria-label": "Case " + (cases.length + 1), onclick: () => rendre(s) });
          cases.push(s); return s.el;
        });
        return h("div", { class: "maphrase-bloc" }, h("div", { class: "cases" }, h("div", { class: "m" }, cs)),
          Voix.dispo() ? h("button", { class: "maphrase-dire", onclick: () => Voix.dire(b.m.replace(/[.!?]/g, ""), true) }, ic("haut"), "le mot") : null);
      }));
      if (!cases.length) return fin2(true);
      const attendus = cases.map(s => s.attendu);
      const vus = [...new Set(etat.sons.map(id => SON[id].g[0]))].filter(g => !attendus.includes(g) && g !== "h");
      const capitales = attendus.filter(g => g[0] !== g[0].toLowerCase()).map(g => g.toLowerCase()).filter(g => !attendus.includes(g));
      const lettres = melanger([...attendus, ...tirer(vus, 3), ...capitales]).map(t => { const tu = { t }; tu.b = h("button", { class: "tuile lecture", onclick: () => mettre(tu) }, t); return tu; });
      const tas2 = h("div", { class: "tuiles maphrase-tuiles" }, lettres.map(x => x.b));
      const verif = h("button", { class: "btn plein", disabled: true, onclick: controle2 }, ic("ok"), "Vérifier");
      let essais2 = 0;
      function mettre(tu) {
        const s = cases.find(x => !x.t); if (!s) return;
        s.t = tu; s.el.textContent = tu.t; s.el.classList.add("pleine"); s.el.classList.remove("faux"); tu.b.disabled = true;
        verif.disabled = cases.some(x => !x.t);
      }
      function rendre(s) { if (!s.t) return; s.t.b.disabled = false; s.t = null; s.el.textContent = ""; s.el.classList.remove("pleine", "faux"); verif.disabled = true; }
      function controle2() {
        const bon = cases.every(s => s.t && s.t.t === s.attendu);
        cases.forEach(s => s.el.classList.toggle("faux", !(s.t && s.t.t === s.attendu)));
        if (bon || evaluation) { if (!bon) rate = true; return fin2(bon); }
        rate = true; essais2++; bip("non"); ecrit.classList.add("secoue"); setTimeout(() => ecrit.classList.remove("secoue"), 420);
        bandeAdulte(adulte, [astuce("Les cases orange sont à revoir : touchez-les pour rendre la lettre. Faites dire le mot lentement, son par son."),
          essais2 >= 2 ? h("button", { class: "btn encore", onclick: () => { cases.forEach(rendre); cases.forEach(s => { const tu = lettres.find(x => x.t === s.attendu && !x.b.disabled); if (tu) mettre(tu); }); fin2(false); } }, ic("oeil"), "Montrer la réponse") : null]);
      }
      ajoute(feuille, h("p", { class: "consigne", style: "align-self:center" }, "Écris maintenant chaque mot avec les lettres."), ecrit, tas2, verif);
      bandeAdulte(adulte, [astuce("Les mots-outils sont déjà écrits. Pour les autres, elle dit le mot lentement et pose les sons dans l'ordre ; une case « chut » attend une lettre muette."), souffle, voir]);
    }
    function fin2(bon) {
      noter(DOM, "compose:" + texte, !rate && bon);
      bip(bon ? "ok" : "non");
      if (evaluation) return setTimeout(() => suivant(!rate && bon), 600);
      feuille.replaceChildren(h("p", { class: "consigne", style: "align-self:center" }, "Relis ta phrase."), h("div", { class: "lecture moyen comprendre-phrase apparait" }, rendreJetons(jetons(texte))));
      if (!rate) etoile(feuille);
      Voix.dire(texte);
      bandeAdulte(adulte, [astuce("Elle relit sa phrase, le doigt sous les mots. Montrez la majuscule au début et le point à la fin."), bSuivant(() => suivant(!rate && bon))]);
    }
    return true;
  }

  // ---------- 2. J'écris sur une image ----------
  const IMAGE = serie({ id: "maphrase-image", titre: "J'écris sur une image", icone: "maphrase", domaine: DOM, n: 5,
    conseil: ["Elle regarde l'image, puis choisit une étiquette dans chaque colonne pour fabriquer la phrase qui la dit.",
      "Il peut y avoir deux bonnes phrases : « Le rat lit sur le mur » et « Le rat est sur le mur » disent toutes deux l'image.",
      "Faites relire la phrase finie, d'une traite."],
    question() {
      let f = null;
      for (let i = 0; i < 8 && !f; i++) { f = Cmp.fabriquer({ modeles: ["A", "C", "D"] }); if (f && !f.morceaux) f = null; }
      if (!f) return null;
      const P = Cmp.pieces(etat), mo = f.morceaux, avecComp = !!mo.comp;
      const sujets = melanger([mo.sujet, ...tirer(P.persos.filter(p => p.e !== f.sujet.e && p.gn !== mo.sujet), 2).map(p => p.gn)]);
      const bonsVerbes = f.modele === "D" ? [mo.verbe, "est"].filter(lit) : [mo.verbe];
      const imgs = new Set([f.action && f.action.img]);
      const autresV = tirer((avecComp ? P.actionsLieu : P.actions).filter(a => !imgs.has(a.img) && !bonsVerbes.includes(a.v)), 3 - bonsVerbes.length).map(a => a.v);
      const verbes = melanger([...bonsVerbes, ...autresV]);
      const comps = avecComp ? melanger([mo.comp, ...tirer(P.places.filter(x => x.txt !== mo.comp && x.lieu.id !== f.place.lieu.id), 2).map(x => x.txt)]) : null;
      const cols = [["Qui ?", sujets, "s"], ["Fait quoi ?", verbes, "v"]].concat(avecComp ? [["Où ?", comps, "c"]] : []);
      if (cols.some(c => c[1].length < 2)) return null;
      const valide = v => v.s === mo.sujet && bonsVerbes.includes(v.v) && (!avecComp || v.c === mo.comp);
      const choisi = {};
      let ligne, btnV, boutons = {};
      const assembler = () => [choisi.s ? Cmp.cap(choisi.s) : null, choisi.v, choisi.c].filter(Boolean).join(" ") + (cols.every(c => choisi[c[2]]) ? "." : "");
      return {
        verifier: valide, cle: "image:" + f.modele, lu: [...sujets.map(Cmp.cap), ...verbes, ...(comps || [])], format: "image",
        solution: { s: mo.sujet, v: mo.verbe, c: mo.comp || undefined },
        dire: "Regarde l'image. Fabrique la phrase qui la dit.",
        astuce: "Une étiquette par colonne. Elle lit chaque étiquette avant de choisir.",
        rendre(feuille, repondre) {
          ligne = h("div", { class: "maphrase-ligne lecture moyen" });
          btnV = h("button", { class: "btn plein", disabled: true, onclick: () => {
            const v = { s: choisi.s, v: choisi.v, c: choisi.c };
            if (!valide(v)) {
              Object.entries(boutons).forEach(([k, l]) => l.forEach(b => b.classList.remove("maphrase-faux")));
              if (v.s !== mo.sujet) boutons.s.find(b => b.dataset.v === v.s).classList.add("maphrase-faux");
              if (!bonsVerbes.includes(v.v)) boutons.v.find(b => b.dataset.v === v.v).classList.add("maphrase-faux");
              if (avecComp && v.c !== mo.comp) boutons.c.find(b => b.dataset.v === v.c).classList.add("maphrase-faux");
            }
            repondre(v, null);
          } }, ic("ok"), "Vérifier");
          const colonnes = cols.map(([titre, liste, cle]) => {
            boutons[cle] = liste.map(t => h("button", { "data-v": t, "aria-pressed": "false", class: "lecture", onclick: ev => {
              choisi[cle] = t;
              boutons[cle].forEach(b => { b.setAttribute("aria-pressed", String(b === ev.currentTarget)); b.classList.remove("maphrase-faux"); });
              ligne.replaceChildren(...rendreJetons(jetons(assembler())));
              btnV.disabled = !cols.every(c => choisi[c[2]]);
            } }, rendreJetons(jetons(cle === "s" ? Cmp.cap(t) : t))));
            return h("div", { class: "maphrase-col" }, h("h3", null, titre), boutons[cle]);
          });
          ajoute(feuille, h("p", { class: "consigne" }, "Fabrique la phrase qui dit l'image."), Cmp.dessiner(f.juste, { classe: "maphrase-scene" }),
            h("div", { class: "maphrase-colonnes", style: "--n:" + cols.length }, colonnes), ligne, btnV);
        },
        apres() { btnV.hidden = true; Voix.dire(assembler()); }
      };
    } });

  // ---------- Le menu, et le papier ----------
  function offre(e) {
    e = e || etat;
    return { composer: phrases(e).length, image: Cmp.combien(e, ["A", "C", "D"]) };
  }
  const CONSEILS = ["« Je compose la phrase » : la voix dicte, elle remet les étiquettes-mots dans l'ordre, puis écrit les mots qu'elle sait déchiffrer avec des étiquettes-lettres. Les mots-outils, appris par cœur, sont déjà là.",
    "La copie et la dictée se font à la main, sur papier : une page par son, à imprimer en taille réelle. Celle de la semaine suit le son de la semaine réglé dans le coin des parents.",
    "En copie, elle lit la phrase, la repasse en attaché, puis l'écrit seule, mot par mot, sans lettre à lettre."];
  function ouvrir() {
    const o = offre(), son = etat.focus, g = SON[son].g[0];
    Cmp.menu("Ma phrase", "J'écris une phrase.", [
      { titre: "Je compose la phrase", pic: "🧩", court: "La voix dicte, je pose les étiquettes", n: o.composer ? null : 0, plein: 1, ouvrir: () => partie("Je compose la phrase", 3, composer, { conseil: CONSEILS.slice(0, 1) }) },
      { titre: "J'écris sur une image", pic: "🖼️", court: "Je fabrique la phrase qui dit l'image", n: o.image ? null : 0, ouvrir: () => jouerSerie(IMAGE) }
    ], CONSEILS, "À l'écran, elle compose avec des étiquettes. La copie et la dictée se font sur papier : les deux pages de la semaine sont ci-dessus.",
    [lienImprimer("copie/copie-" + nn(son) + ".pdf", "La copie de la semaine · son « " + g + " »", "btn"),
      lienImprimer("copie/dictee-" + nn(son) + ".pdf", "La dictée de la semaine · son « " + g + " »", "btn")]);
  }
  function ecranPapier() {
    const { feuille, adulte } = ecranModule("La copie et la dictée");
    const ligne = (prefixe) => h("div", { class: "coches fiches" }, SONS.map(s => h("a", { class: (etat.sons.includes(s.id) ? "vu" : "") + (s.id === etat.focus ? " focus" : ""),
      href: BASE_IMPRIMER + "copie/" + prefixe + "-" + nn(s.id) + ".pdf", target: "_blank", rel: "noopener" }, s.g[0])));
    ajoute(feuille, h("p", { class: "consigne" }, "Une page par son, dans l'ordre de la classe."),
      h("h3", null, "Le cahier de copie"), ligne("copie"),
      h("h3", null, "Les dictées"), ligne("dictee"),
      h("div", { class: "comprendre-papier" }, lienImprimer("copie/copie-periode-1.pdf", "Copie : toute la période 1", "btn discret"),
        lienImprimer("copie/dictees-periode-1.pdf", "Dictées : toute la période 1", "btn discret"),
        lienImprimer("copie/cahier-de-copie.pdf", "Tout le cahier de copie", "btn discret"), lienImprimer("copie/dictees.pdf", "Toutes les dictées", "btn discret")));
    bandeAdulte(adulte, [astuce("Le son de la semaine est entouré. Imprimez en taille réelle (100 %), sans « ajuster à la page » : les lignes sont aux mesures du cahier de CP.")]);
  }

  rubrique({ id: "maphrase", onglet: "ecrire", section: "Écrire", ordre: 20, titre: "Ma phrase", icone: "maphrase",
    court: "Je compose une phrase dictée, j'écris sur une image", ouvrir,
    dispo: () => { const o = offre(); return o.composer + o.image > 0; } });
  rubrique({ id: "maphrase-papier", onglet: "ecrire", section: "À imprimer", ordre: 20, titre: "La copie et la dictée", icone: "imprimer",
    court: "Une page de copie et une page de dictée par son", ouvrir: ecranPapier });
  pointEtape(DOM, "Écrire une phrase dictée", suite => partie("Écrire une phrase dictée", 2, composer, { evaluation: true, finir: suite }));

  Cmp.maphrase = { series: { image: IMAGE }, offre, composer, partie, phrases, decouperMots, aEcrire, ouvrir };
})();

// ---------- Mesurer : la monnaie, les longueurs, le temps ----------
// Payer juste avec des pièces et des billets dessinés pour jouer (ni copie ni imitation des vrais) ;
// comparer et mesurer en centimètres sur une règle dessinée ; les jours, les mois, le calendrier.
// Tout le module est enfermé dans une fonction.
(() => {
  const ID = "mesures";
  const NS = "http://www.w3.org/2000/svg";
  const ty = s => String(s).replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« ");
  const tys = l => l.map(ty);
  let evaluation = false;

  ICONES["c-piece"] = '<circle cx="9" cy="12" r="6"/><circle cx="9" cy="12" r="3"/><rect x="14" y="7" width="8" height="10" rx="1"/>';
  ICONES["c-regle"] = '<rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/>';
  ICONES["c-calendrier"] = '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/>';

  function svgEl(vb, cls, inner, label) {
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", vb); s.setAttribute("class", cls);
    if (label) { s.setAttribute("role", "img"); s.setAttribute("aria-label", label); } else s.setAttribute("aria-hidden", "true");
    s.innerHTML = inner;
    return s;
  }

  // ----- la monnaie : des pièces et des billets dessinés pour jouer -----
  // La pièce de 1 € a le tour doré et le cœur argenté ; celle de 2 €, l'inverse. Les billets
  // gardent la couleur et la taille relative des vrais (5 gris, 10 rouge, 20 bleu), rien d'autre.
  function piece(v) {
    const ext = v === 1 ? "or" : "argent", int = v === 1 ? "argent" : "or", r = v === 1 ? 26.5 : 29.5;
    return svgEl("0 0 60 60", "mesures-piece p" + v,
      '<circle cx="30" cy="30" r="' + r + '" class="mesures-' + ext + '"/><circle cx="30" cy="30" r="' + (r * 0.64).toFixed(1) + '" class="mesures-' + int + '"/>'
      + '<text x="27" y="38" class="mesures-pv">' + v + '</text><text x="38" y="37" class="mesures-pe">€</text>', "pièce de " + v + " euro" + (v > 1 ? "s" : ""));
  }
  const BILLETS = { 5: { w: 120, h: 62 }, 10: { w: 127, h: 67 }, 20: { w: 133, h: 72 } };
  function billet(v) {
    const { w, h: hh } = BILLETS[v];
    let motif = "";
    for (let i = 0; i < 4; i++) motif += '<path d="M' + (w * 0.42) + " " + (14 + i * 11) + " q" + (w * 0.12) + " -7 " + (w * 0.24) + " 0 t" + (w * 0.24) + ' 0" class="mesures-onde"/>';
    return svgEl("0 0 " + w + " " + hh, "mesures-billet b" + v,
      '<rect x="1.5" y="1.5" width="' + (w - 3) + '" height="' + (hh - 3) + '" rx="6" class="mesures-fond"/>'
      + '<rect x="7" y="7" width="' + (w - 14) + '" height="' + (hh - 14) + '" rx="3" class="mesures-cadre"/>' + motif
      + '<circle cx="' + (w - 24) + '" cy="' + (hh / 2) + '" r="13" class="mesures-rond"/><circle cx="' + (w - 24) + '" cy="' + (hh / 2) + '" r="7" class="mesures-rond"/>'
      + '<text x="14" y="' + (hh * 0.62) + '" class="mesures-bv">' + v + '</text><text x="' + (v > 9 ? 56 : 36) + '" y="' + (hh * 0.62) + '" class="mesures-be">€</text>'
      + '<text x="14" y="' + (hh - 11) + '" class="mesures-bj">pour jouer</text>', "billet de " + v + " euros");
  }
  const argent = v => v <= 2 ? piece(v) : billet(v);
  const valeursDispo = () => [1, 2, 5, 10, 20].filter(v => v <= LIMITES[etat.niveauMaths - 1]);
  const ACHATS = [["🧸", "l'ours"], ["⚽", "le ballon"], ["📕", "le livre"], ["🎨", "la peinture"], ["🧩", "le puzzle"], ["🎲", "le jeu de dés"], ["🍦", "la glace"], ["🚂", "le petit train"], ["🎺", "la trompette"], ["🖍️", "la boîte de craies"]];
  // Une somme faite de pièces et de billets (au moins deux), pas plus de max.
  function somme(max) {
    const dispo = valeursDispo();
    let out, t;
    do {
      out = []; t = 0;
      const n = entier(2, 4);
      for (let i = 0; i < n; i++) { const ok = dispo.filter(v => t + v <= max); if (!ok.length) break; const v = hasard(ok); out.push(v); t += v; }
    } while (out.length < 2);
    return out.sort((a, b) => b - a);
  }
  const sMonnaie = serie({ id: "mesures-monnaie", titre: "La monnaie", icone: "c-piece", domaine: "mesures", n: 6,
    conseil: tys(["Payer juste : elle touche les pièces et les billets pour les poser sur le comptoir ; on en retire en les touchant à nouveau.",
      "On compte d'abord les billets, puis les pièces : 10, 15, 17, 18. Un billet de 5, c'est comme cinq pièces de 1.",
      "Les pièces et les billets imprimés servent à jouer à la marchande : avec de vrais prix, sur la table."]),
    question(k) {
      const max = LIMITES[etat.niveauMaths - 1];
      if (k % 2 === 0) {
        const [e, nom] = hasard(ACHATS), prix = entier(Math.min(3, max), max);
        let donne = [], comptoir, payer;
        return {
          cle: "monnaie-payer:" + max, dire: Maj(nom) + " coûte " + prix + " euros. Paye juste.",
          verifier: v => v === prix,
          rendre(feuille, repondre) {
            comptoir = h("div", { class: "mesures-comptoir", "aria-live": "polite" });
            const dessiner = () => {
              comptoir.replaceChildren(...(donne.length ? donne.map((v, i) => h("button", { class: "mesures-sou", "aria-label": "Reprendre", onclick: () => { donne.splice(i, 1); dessiner(); } }, argent(v)))
                : [h("span", { class: "mesures-vide" }, "Touche l'argent pour payer.")]));
              payer.classList.remove("non", "secoue");
            };
            payer = h("button", { class: "btn plein", onclick: () => {
              const t = donne.reduce((s, v) => s + v, 0);
              if (!donne.length) return;
              if (t !== prix && !evaluation) Voix.dire(t > prix ? "C'est trop !" : "Il manque de l'argent.");
              repondre(t, payer);
            } }, ic("ok"), "Payer");
            ajoute(feuille, h("div", { class: "mesures-achat" }, h("span", { class: "mesures-objet" }, e), h("span", { class: "mesures-prix" }, prix + " €")),
              h("p", { class: "consigne" }, ty("Paye juste : touche les pièces et les billets.")),
              h("div", { class: "mesures-caisse" }, valeursDispo().map(v => h("button", { class: "mesures-sou", "aria-label": "Donner " + v + " euros", onclick: () => { if (donne.length < 12) { donne.push(v); donne.sort((a, b) => b - a); dessiner(); } } }, argent(v)))),
              h("div", { class: "mesures-lbl" }, ty("Sur le comptoir :")), comptoir, payer, lienPapier("monnaie"));
            dessiner();
          },
          apres(juste) { if (!juste) Voix.dire(Maj(nom) + " coûte " + prix + " euros."); else Voix.dire("Merci ! " + prix + " euros, c'est juste."); }
        };
      }
      const s = somme(max), t = s.reduce((a, b) => a + b, 0);
      return {
        reponse: t, cle: "monnaie-compter:" + max, dire: "Combien d'argent y a-t-il ?",
        rendre(feuille, repondre) {
          ajoute(feuille, h("p", { class: "consigne" }, ty("Combien d'argent ?")),
            h("div", { class: "mesures-comptoir" }, s.map(argent)), h("div", { class: "mesures-pave" }, pave(0, max, repondre)), lienPapier("monnaie"));
        },
        apres() { Voix.dire(s.join(" et ") + " : " + t + " euros."); }
      };
    }
  });

  // ----- les longueurs : comparer des crayons, mesurer un trait en centimètres -----
  const CM = 40, X0 = 30;     // la règle dessinée : 1 cm = 40 unités, le zéro à x = 30
  function regle(debut, fin) {
    const LONG = fin <= 10 ? 10 : 15;      // une règle de 10 cm quand elle suffit : plus grande à l'écran
    let s = '<rect x="' + (X0 - 16) + '" y="78" width="' + (LONG * CM + 62) + '" height="66" rx="5" class="mesures-regle"/>';
    for (let i = 0; i <= LONG * 2; i++) {
      const x = X0 + i * CM / 2, cm = i % 2 === 0;
      s += '<line x1="' + x + '" y1="78" x2="' + x + '" y2="' + (cm ? 102 : 92) + '" class="mesures-grad"/>';
      if (cm) s += '<text x="' + x + '" y="128" class="mesures-num">' + (i / 2) + "</text>";
    }
    const xa = X0 + debut * CM, xb = X0 + fin * CM;

  }
  const COULEURS_CRAYON = ["var(--syl1)", "var(--syl2)", "var(--ok)", "var(--encore)"];
  function crayon(long, decal, couleur) {
    const x = decal, y = 8, H = 24, pointe = 34;
    return svgEl("0 0 400 40", "mesures-crayon",
      '<rect x="' + x + '" y="' + y + '" width="14" height="' + H + '" rx="4" class="mesures-gomme"/>'

      + '<path d="M' + (x + long - pointe) + " " + y + "l" + pointe + " " + (H / 2) + "l-" + pointe + " " + (H / 2) + 'z" class="mesures-taille"/>'
      + '<path d="M' + (x + long - 11) + " " + (y + H / 2 - 4) + "l11 4-11 4z" + '" class="mesures-mine"/>');

  const sLongueurs = serie({ id: "mesures-longueurs", titre: "Les longueurs", icone: "c-regle", domaine: "mesures", n: 6,
    conseil: tys(["Pour comparer deux longueurs, on regarde les deux bouts : les crayons ne commencent pas tous au même endroit.",
      "Pour mesurer, le bout du trait est sur le 0 de la règle ; on lit le nombre en face de l'autre bout. Le 0 n'est pas le bord de la règle.",
      "Avec la règle en carton imprimée, elle mesure de vrais traits au crayon : c'est là que la mesure s'apprend."]),
    question(k) {
      if (k % 2 === 0) {

        },

        aide() { Voix.dire(decale ? "Le trait ne commence pas au zéro : compte les centimètres de " + debut + " à " + fin + "." : "Regarde le nombre en face du bout du trait."); }

  // ----- le temps : les jours, les mois, le calendrier -----

  function calendrier(opts) {

    const debut = (new Date(an, m, 1).getDay() + 6) % 7, nbj = new Date(an, m + 1, 0).getDate();

    el.jourDe = d => JOURS[(debut + d - 1) % 7];

  const infoMois = () => { const a = new Date(); const debut = (new Date(a.getFullYear(), a.getMonth(), 1).getDay() + 6) % 7; return { debut, nbj: new Date(a.getFullYear(), a.getMonth() + 1, 0).getDate() }; };
  const sTemps = serie({ id: "mesures-temps", titre: "Les jours et les mois", icone: "c-calendrier", domaine: "mesures", n: 8,

// Les mots-outils appris (etat.outils) et les petits mots déjà lisibles (le, la, il, sur…).
// Trois jeux : le mot flashé, le mémory, la chasse dans des phrases. Les mots ratés
// reviennent plus souvent : ils sont gardés dans etat.modules.outils.
(() => {
  const MULTI = { "il y a": ["il a", "il va", "il y va"], "c'est": ["ces", "cet", "sept"] };
  const suivi = () => {
    const m = etat.modules.outils || (etat.modules.outils = {});
    m.rates = m.rates || {}; m.vus = m.vus || {};
    return m;
  };
  // Le mot raté remonte (deux fois plus de chances par raté), le mot réussi redescend.
  function compter(mot, juste) {
    const m = suivi();
    m.vus[mot] = (m.vus[mot] || 0) + 1;
    m.rates[mot] = juste ? Math.max(0, (m.rates[mot] || 0) - 1) : (m.rates[mot] || 0) + 1;
    if (!m.rates[mot]) delete m.rates[mot];
    sauver();
  }
  const estOutil = w => OUTILS.some(o => o.id === w);
  // Les mots du jour : les outils appris, puis les petits mots que ses sons permettent de lire.
  function mots() {
    const petits = OUTILS_PETITS.filter(w => PAR_FORME.has(w) && lisible(PAR_FORME.get(w), etat) && !OUTIL_DE.has(w));
    return [...etat.outils.filter(estOutil), ...petits];
  }
  const recents = [];
  function tirerMots(n, liste) {
    const m = suivi();
    const out = tirer(liste || mots(), n, w => (estOutil(w) ? 1.5 : 1) * (1 + 2 * (m.rates[w] || 0)) * (m.vus[w] ? 1 : 1.3) * (recents.includes(w) ? 0.15 : 1));
    out.forEach(w => { recents.push(w); if (recents.length > 6) recents.shift(); });
    return out;
  }
  // Des mots qui lui ressemblent : même début, même fin, mêmes lettres, longueur voisine.
  const FORMES = [...new Set([...OUTILS.map(o => o.id), ...OUTILS_PETITS, ...MOTS.map(m => m.forme)])]
    .filter(f => f === f.toLowerCase() && !/['\s]/.test(f) && f.length <= 6);
  function sosies(w, n) {
    if (MULTI[w]) return tirer(MULTI[w], n);
    const meme = new Set(((OUTILS.find(o => o.id === w) || {}).mots || [w]).concat(w));
    const note = c => {
      let s = (c[0] === w[0] ? 3 : 0) + (c[c.length - 1] === w[w.length - 1] ? 2 : 0) - 1.5 * Math.abs(c.length - w.length);
      const reste = [...w]; [...c].forEach(x => { const i = reste.indexOf(x); if (i >= 0) { s++; reste.splice(i, 1); } });
      return s;
    };
    const cand = FORMES.filter(c => !meme.has(c)).map(c => ({ c, s: note(c) + Math.random() })).sort((a, b) => b.s - a.s);
    return tirer(cand.slice(0, 7).map(x => x.c), n);
  }
  const motEcrit = (w, cls) => h("span", { class: "outils-mot lecture" + (cls ? " " + cls : "") }, w);

  ICONES["outils-eclair"] = '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>';
  ICONES["outils-paires"] = '<rect x="2" y="5" width="9" height="14" rx="2"/><rect x="13" y="5" width="9" height="14" rx="2"/><path d="M6.5 10v4M17.5 10v4"/>';
  ICONES["outils-chasse"] = '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11h6"/>';

  // ----- 1. Le mot éclair : vu une seconde et demie, puis retrouvé parmi trois -----
  const ECLAIR = serie({ id: "outils-eclair", titre: "Le mot éclair", icone: "outils-eclair", domaine: "mots-outils", n: 8,
    conseil: ["Le mot s'affiche une seconde et demie, puis se cache : elle le retrouve parmi trois mots qui se ressemblent.",
      "On ne déchiffre pas : on reconnaît la forme du mot d'un coup d'œil, comme sur les étiquettes de la classe.",
      "« Revoir le mot » le montre encore une fois ; le mot reviendra alors plus souvent, comme un mot raté."],
    question() {
      const w = tirerMots(1)[0], opts = melanger([w, ...sosies(w, 2)]);
      let rate = false, revu = false, carte;
      return { cle: w, astuce: "Le mot apparaît une seconde et demie. Elle le retrouve parmi les trois ; à la fin, elle le lit à voix haute.",
        verifier(v) { if (v !== w) rate = true; return v === w; },
        rendre(feuille, repondre) {
          carte = h("div", { class: "outils-flash" }, ic("oeil"));
          const zone = h("div", { class: "outils-choix", hidden: true }, opts.map(o => h("button", { onclick: e => repondre(o, e.currentTarget) }, motEcrit(o))));
          const revoir = h("button", { class: "btn discret", hidden: true, onclick: () => { revu = true; montrer(); } }, ic("oeil"), "Revoir le mot");
          function montrer() {
            carte.replaceChildren(motEcrit(w)); zone.hidden = true; revoir.hidden = true;
            setTimeout(() => { if (!carte.isConnected) return; carte.replaceChildren(h("span", { class: "outils-cache" }, "?")); zone.hidden = false; revoir.hidden = false; }, 1500);
          }
          ajoute(feuille, h("p", { class: "consigne" }, "Regarde bien le mot !"), carte, zone, revoir);
          setTimeout(() => { if (carte.isConnected) montrer(); }, 700);
        },
        apres() { compter(w, !rate && !revu); carte.replaceChildren(motEcrit(w, "outils-ok")); Voix.dire(w); } };
    } });

  // ----- 2. Le mémory : des paires de mots, et on lit chaque paire trouvée -----
  function memory(finir) {
    ecran = "outils-memory";
    const n = Math.min([4, 5, 6][etat.niveau - 1] || 4, mots().length);
    const choisis = tirerMots(n);
    const deuxEcritures = etat.niveau === 3;
    const cartesM = melanger(choisis.flatMap((w, i) => [{ w, i, f: "" }, { w, i, f: deuxEcritures ? "autre" : "" }]));
    let ouvertes = [], trouvees = 0, coups = 0, bloque = false, sansAide = 0;
    vider();
    const feuille = h("section", { class: "feuille outils-feuille" }), adulte = h("div", { class: "adulte" });
    const compte = h("span", { class: "compte" }, "0 / " + n);
    ajoute(racine, barre("Le mémory des mots", h("div", { class: "ligne" }, pastillesSeance(), compte)), feuille, adulte,
      conseil({ conseil: ["Elle retourne deux cartes. Deux fois le même mot : elle le lit à voix haute, et la paire reste ouverte.",
        "Au groupe 3 œufs, les deux cartes d'une paire sont écrites différemment : script et attachée.",
        "Le mémory entraîne la mémoire autant que la lecture : on ne compte pas les coups, on compte les mots lus."] }));
    const grille = h("div", { class: "outils-grille" });
    cartesM.forEach(c => {
      c.b = h("button", { class: "outils-carte", "aria-label": "Carte retournée", onclick: () => retourner(c) });
      grille.append(c.b);
    });
    ajoute(feuille, h("p", { class: "consigne" }, "Retourne deux cartes : trouve les paires."), grille);
    const attendre = () => bandeAdulte(adulte, [astuce("Elle retourne deux cartes. Une paire trouvée ? Elle lit le mot, vous validez.")]);
    attendre();
    function face(c) {
      c.b.classList.add("ouverte");
      c.b.replaceChildren(c.f === "autre" ? h("span", { class: "outils-mot " + (etat.ecriture === "cursive" ? "f-scr" : "f-cur") }, c.w) : motEcrit(c.w));
    }
    function dos(c) { c.b.classList.remove("ouverte"); c.b.replaceChildren(); }
    function retourner(c) {
      if (bloque || c.trouve || ouvertes.includes(c)) return;
      face(c); ouvertes.push(c);
      if (ouvertes.length < 2) return;
      coups++;
      const [a, b] = ouvertes;
      if (a.w === b.w) {
        bloque = true; a.trouve = b.trouve = true; a.b.classList.add("trouvee"); b.b.classList.add("trouvee"); bip("ok");
        bandeAdulte(adulte, [astuce("Une paire ! Elle lit le mot à voix haute."),
          bEncore(() => { Voix.dire(a.w); valider(a.w, false); }, "On l'écoute"),
          bOk(() => valider(a.w, true), "Bien lu !")]);
      } else {
        bloque = true;
        setTimeout(() => { dos(a); dos(b); ouvertes = []; bloque = false; }, 1100);
      }
    }
    function valider(w, juste) {
      noter("mots-outils", w, juste); compter(w, juste); if (juste) sansAide++;
      ouvertes = []; bloque = false; trouvees++; compte.textContent = trouvees + " / " + n;
      if (juste) etoile(feuille);
      if (trouvees < n) return attendre();
      const r = { etoiles: sansAide, n };
      record("outils-memory", r);
      if (finir) return setTimeout(() => finir(r), 700);
      setTimeout(() => finPartie("Le mémory des mots", r, () => memory()), 700);
    }
  }

  // ----- 3. La chasse aux mots : toucher toutes les fois où le mot est écrit -----
  const PHRASES_C = OUTILS_PHRASES.trim().split("\n").map(t => ({ texte: t.trim(), jetons: jetons(t.trim()) }));
  const jetonEst = (j, w) => !j.ponct && (j.outil ? j.outil === w : j.t.toLowerCase() === w);
  function phrasesPour(w) {
    const lisibles = [...PHRASES_C, ...PHRASES_L.map(p => ({ texte: p.texte, jetons: p.jetons }))]
      .filter(p => p.jetons.every(j => j.ponct || jetonLisible(j, etat)));
    return lisibles.filter(p => p.jetons.some(j => jetonEst(j, w)));
  }
  function chasse(nTours, finir) {
    ecran = "outils-chasse";
    const possibles = mots().filter(w => !MULTI[w] && phrasesPour(w).length);
    let tour = 0, etoiles = 0;
    const cibles = tirerMots(Math.min(nTours, possibles.length), possibles);
    if (!cibles.length) {
      vider();
      ajoute(racine, barre("La chasse aux mots", pastillesSeance()), h("section", { class: "feuille" },
        h("p", { class: "consigne" }, "Pas encore de phrase à lire avec les sons et les mots-outils cochés."),
        h("button", { class: "btn plein", onclick: () => finir ? finir({ etoiles: 0, n: 0 }) : menu() }, finir ? "Étape suivante" : "Retour", ic("suivant"))));
      return;
    }
    function manche() {
      const w = cibles[tour];
      const choix = phrasesPour(w), avec = tirer(choix, 3, p => p.jetons.filter(j => jetonEst(j, w)).length);
      let total = 0, trouves = 0, erreurs = 0;
      vider();
      const feuille = h("section", { class: "feuille outils-feuille" }), adulte = h("div", { class: "adulte" });
      ajoute(racine, barre("La chasse aux mots", h("div", { class: "ligne" }, pastillesSeance(), h("span", { class: "compte" }, (tour + 1) + " / " + cibles.length))),
        feuille, adulte, conseil({ conseil: ["Elle cherche le mot partout où il est écrit, avec une majuscule aussi, et le touche à chaque fois.",
          "Une fois tout trouvé, elle peut lire les phrases : les mots-outils sans arc se reconnaissent sans se déchiffrer.",
          "Un mot touché par erreur tremble : on compare les deux mots lettre par lettre."] }));
      const reste = h("span", { class: "outils-reste" });
      const maj = () => { reste.textContent = trouves + " / " + total; };
      const lignes = avec.map(p => {
        const out = [];
        p.jetons.forEach((j, k) => {
          if (k > 0 && !j.colle) out.push(j.ponct ? (/[?!;]/.test(j.t) ? " " : /:/.test(j.t) ? " " : "") : " ");
          if (j.ponct) { out.push(j.t); return; }
          const el = j.outil ? h("span", { class: "mot outil" }, j.t) : j.mot ? rendreMot(j.mot, j.t) : h("span", { class: "mot" }, j.t);
          const bon = jetonEst(j, w);
          if (bon) total++;
          const b = h("span", { class: "outils-jeton", role: "button", tabindex: "0" }, el);
          const toucher = () => {
            if (b.classList.contains("trouve")) return;
            if (bon) {
              b.classList.add("trouve"); trouves++; maj(); bip("ok");
              if (trouves === total) gagne();
            } else { erreurs++; b.classList.add("secoue"); bip("non"); setTimeout(() => b.classList.remove("secoue"), 420); }
          };
          b.addEventListener("click", toucher);
          b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toucher(); } });
          out.push(b);
        });
        return h("p", null, out);
      });
      maj();
      ajoute(feuille, h("p", { class: "consigne" }, "Touche ce mot chaque fois que tu le vois."),
        h("div", { class: "outils-cible" }, motEcrit(w), Voix.dispo() ? h("button", { class: "btn ecoute", "aria-label": "Écouter le mot", onclick: () => Voix.dire(w) }, ic("haut")) : null, reste),
        h("div", { class: "lecture moyen outils-phrases" }, lignes));
      bandeAdulte(adulte, [astuce("Elle cherche « " + w + " » dans les phrases et le touche chaque fois. Le compteur dit combien elle en a trouvé."),
        bSuivant(suite, "Passer")]);
      function gagne() {
        const juste = erreurs === 0;
        noter("mots-outils", w, juste); compter(w, juste);
        if (juste) { etoiles++; etoile(feuille); }
        bandeAdulte(adulte, [astuce("Tout est trouvé ! Elle peut maintenant lire les phrases à voix haute."), bSuivant(suite)]);
      }
    }
    function suite() {
      tour++;
      if (tour < cibles.length) return manche();
      const r = { etoiles, n: cibles.length };
      record("outils-chasse", r);
      if (finir) return finir(r);
      finPartie("La chasse aux mots", r, () => chasse(nTours));
    }
    manche();
  }

  // Les meilleurs scores, comme ceux des séries du moteur.
  function record(id, r) {
    const rec = etat.series[id] || (etat.series[id] = { parties: 0, meilleur: 0 });
    rec.parties++; rec.meilleur = Math.max(rec.meilleur, r.etoiles); rec.dernier = aujourdhui(); sauver();
  }
  function finPartie(titre, r, rejouer) {
    ecran = "fin"; vider(); bip("fin"); if (r.etoiles) pluie("⭐");
    ajoute(racine, barre(titre),
      h("section", { class: "feuille" }, h("p", { class: "bravo" }, r.etoiles >= r.n - 1 ? "Bravo !" : "Bien joué !"),
        h("div", { class: "image" }, "⭐".repeat(r.etoiles) || "🙂"),
        h("div", { class: "ligne", style: "justify-content:center" },
          h("button", { class: "btn plein", onclick: rejouer }, ic("encore"), "Rejouer"),
          h("button", { class: "btn", onclick: menu }, ic("outils-eclair"), "Un autre jeu"),
          h("button", { class: "btn discret", onclick: accueil }, ic("maison"), "Accueil"))));
  }

  const JEUX = [
    { id: "outils-eclair", titre: "Le mot éclair", icone: "outils-eclair", court: "Vu une seconde, retrouvé", ouvrir: () => jouerSerie(ECLAIR, { finir: r => finPartie(ECLAIR.titre, r, JEUX[0].ouvrir) }) },
    { id: "outils-memory", titre: "Le mémory des mots", icone: "outils-paires", court: "Des paires à retrouver", ouvrir: () => memory() },
    { id: "outils-chasse", titre: "La chasse aux mots", icone: "outils-chasse", court: "Le mot caché dans les phrases", ouvrir: () => chasse(3) }
  ];
  function menu() {
    ecran = "outils"; seance = null; vider();
    const adulte = h("div", { class: "adulte" }), m = suivi();
    const rates = Object.entries(m.rates).sort((a, b) => b[1] - a[1]).map(([w]) => w).slice(0, 8);
    ajoute(racine, barre("Les mots-outils"),
      h("p", { class: "sous-titre" }, "Les petits mots qu'on reconnaît d'un coup d'œil, sans les déchiffrer."),
      h("div", { class: "outils-liste lecture" }, mots().map(w => h("span", { class: (m.rates[w] ? "rate" : "") }, w))),
      h("div", { class: "jeux" }, JEUX.map(j => {
        const rec = etat.series[j.id];
        return h("button", { class: "jeu", onclick: () => { seance = null; j.ouvrir(); } },
          h("span", { class: "pic" }, ic(j.icone)), h("b", null, j.titre), h("small", null, j.court),
          rec && rec.meilleur ? h("small", { class: "record" }, "★ " + rec.meilleur + " au mieux") : null);
      })),
      adulte, conseil({ conseil: [
        "Les mots-outils de la boîte à outils de la classe se cochent dans le coin des parents ; les petits mots comme « le », « sur », « pour » s'ajoutent tout seuls quand leurs sons sont vus.",
        "Les mots en orange ont été ratés : ils reviennent plus souvent, jusqu'à être réussis.",
        "Les cartes-éclair à imprimer (rubrique À imprimer) font le même jeu sur la table : on montre une carte une seconde, elle lit le mot."] }));
    bandeAdulte(adulte, [astuce(rates.length ? "Les mots en orange résistent : un jeu court par jour les fera revenir." : "Un jeu court par jour : quelques minutes suffisent."),
      lienImprimer("outils/cartes-eclair.pdf", "Les cartes-éclair", "btn")]);
  }

  // ----- sur la table : les cartes-éclair (imprimer/outils) -----
  function papier() {
    ecran = "papier"; seance = null; vider();
    ajoute(racine, barre("Les cartes-éclair"),
      h("div", { class: "reglages" },
        h("section", { class: "bloc" }, h("h2", null, "Les cartes-éclair des mots-outils"),
          h("p", null, "Quatre pages à découper : les mots-outils de la classe, puis les petits mots qui se déchiffrent (le, sur, pour…), chacun en script et en attachée. L'éclair : montrez une carte le temps de dire « un, deux », cachez-la ; elle dit le mot. Bien lu, la carte va dans sa boîte ; sinon, elle revient dans le paquet. Imprimez en taille réelle (100 %)."),
          h("div", { class: "ligne" }, lienImprimer("outils/cartes-eclair.pdf", "Les quatre pages"))),
        h("section", { class: "bloc" }, h("h2", null, "Une page à la fois"),
          h("p", null, "Pour le mémory, imprimez deux fois la même page, ou la page en script avec celle en attachée."),
          h("div", { class: "ligne" }, [["outils-script", "Mots-outils, script"], ["outils-attachee", "Mots-outils, attachée"], ["petits-mots-script", "Petits mots, script"], ["petits-mots-attachee", "Petits mots, attachée"]]
            .map(([f, t]) => lienImprimer("outils/" + f + ".pdf", t, "btn discret"))))));
  }
  rubrique({ id: "imprimer-outils", onglet: "lire", section: "À imprimer", ordre: 16, titre: "Les cartes-éclair", icone: "imprimer",
    court: "Les mots-outils à découper", ouvrir: papier });

  rubrique({ id: "outils", onglet: "lire", section: "Lire", ordre: 30,
    titre: "Les mots-outils", icone: "outils-eclair", court: "Je les reconnais d'un coup d'œil",
    ouvrir: menu, dispo: () => mots().length >= 3 });
  pointEtape("mots-outils", "Les mots-outils", suite => jouerSerie(ECLAIR, { n: 5, evaluation: true, finir: suite }));

  window.OUTILS_M = { mots, sosies, phrasesPour, ECLAIR, memory, chasse, menu, PHRASES_C };

  document.head.append(h("style", null, `

.outils-flash{min-width:min(320px,100%);min-height:140px;display:grid;place-items:center;border-radius:22px;border:4px solid var(--accent);background:var(--papier);padding:8px 24px}
.outils-flash svg.ic{width:56px;height:56px;color:var(--encre-2)}

.cursive .outils-flash .outils-mot.lecture{font-size:clamp(2.4rem,8vw,3.8rem)}
.outils-cache{font-size:3rem;color:var(--trait);font-family:var(--f-lecture)}
.outils-ok{color:var(--ok)}

  background:repeating-linear-gradient(45deg,var(--accent) 0 10px,var(--accent-fort) 10px 20px)}
.outils-carte.ouverte{background:var(--papier);border-color:var(--trait)}

.cursive .outils-carte .outils-mot.lecture,.outils-carte .outils-mot.f-cur{font-size:clamp(1.15rem,3.8vw,1.8rem)}
