}

function blocFiches() {
  const base = SUR_SITE ? "assets/fiches/" : "https://forneris.fr/lire/assets/fiches/";
  const lien = (fichier, texte, cls) => h("a", { class: cls || "", href: base + fichier, target: "_blank", rel: "noopener" }, texte);
  return bloc("Les fiches d'écriture à imprimer",
    "Une fiche par son, dans l'ordre de la classe : la lettre en attachée, son point de départ, le geste à dire en traçant, puis des syllabes et des mots qu'elle sait lire. Dix minutes par fiche. Imprimez en taille réelle (100 %), sans « ajuster à la page » : les lignes sont aux mesures du cahier de CP.",
    h("div", { class: "coches fiches" }, SONS.map((s, k) => lien("fiche-" + String(k + 1).padStart(2, "0") + ".pdf", s.g[0],
      (etat.sons.includes(s.id) ? "vu" : "") + (s.id === etat.focus ? " focus" : "")))),
    h("div", { class: "ligne" }, lien("periode-1.pdf", "Toute la période 1 (13 fiches)", "btn"), lien("toutes-les-fiches.pdf", "Toutes les fiches", "btn discret")));
}

function blocVoix() {
  if (!Voix.ok && !CLES_VOIX.size) return bloc("La lecture à voix haute", "Ce navigateur ne sait pas lire à voix haute. Chrome, Edge et Safari le font.");
  // La voix enregistrée d'abord : elle est la même partout, et plus naturelle que la plupart des voix du système.
  const enregistree = CLES_VOIX.size ? [
    interrupteur("voix-enregistree", "La voix enregistrée, plus naturelle", etat.voixEnregistree !== false, v => { etat.voixEnregistree = v; Voix.taire(); sauver(); parents(); if (v) Voix.dire("Bonjour ! On lit ensemble ?"); }),
    h("p", { class: "voix-credit" }, CLES_VOIX.size.toLocaleString("fr-FR") + " mots et phrases enregistrés d'avance, avec une voix libre. Ce qui n'y est pas, par exemple un problème inventé au hasard, passe par la voix de l'appareil, réglée ci-dessous. Voix : " + (VOIX_REC.credit || "Piper, voix siwis") + ".")] : [];
  const sansFr = Voix.toutes > 0 && !Voix.liste.length;
  // La vitesse : un curseur, entendu dès qu'on le lâche.
  const pct = v => Math.round(v * 100) + " %";
  const curseur = h("input", { type: "range", id: "vitesse-voix", min: "0.7", max: "1.3", step: "0.05", value: String(facteurVitesse()) });
  const valeur = h("output", { for: "vitesse-voix", class: "voix-pct" }, pct(facteurVitesse()));
  curseur.addEventListener("input", () => { valeur.textContent = pct(+curseur.value); });
  curseur.addEventListener("change", () => { etat.vitesseVoix = +curseur.value; sauver(); Voix.dire("Bonjour ! On lit ensemble ?"); });
  const vitesse = h("div", { class: "voix-vitesse" },
    h("label", { for: "vitesse-voix" }, "Vitesse de la voix"),
    h("div", { class: "ligne" }, h("small", null, "plus lente"), curseur, h("small", null, "plus rapide"), valeur),
    Math.abs(facteurVitesse() - 1) > 0.001 ? h("button", { class: "btn discret", onclick: () => { etat.vitesseVoix = 1; sauver(); parents(); } }, "Revenir à la vitesse normale") : null);
  const nomCourt = v => v.name.replace(/^Microsoft\s+/, "").replace(/\s*Online\s*\(Natural\)/i, "").replace(/\s*-\s*French.*$/i, "");
  const choix = Voix.liste.length > 1 ? h("div", { class: "ligne" }, h("label", { for: "voix" }, "La voix"),
    h("select", { id: "voix", onchange: e => { etat.voix = e.target.value; Voix.charger(); sauver(); Voix.dire("Bonjour ! On lit ensemble ?"); } },
      Voix.liste.map(v => h("option", { value: v.voiceURI, selected: Voix.choisie && v.voiceURI === Voix.choisie.voiceURI ? true : null },
        nomCourt(v) + " (" + v.lang + ")" + (voixNaturelle(v) ? " · naturelle" : ""))))) : null;
  const naturelles = Voix.liste.filter(voixNaturelle);
  const conseil = !Voix.liste.length ? null : naturelles.length
    ? h("p", null, naturelles.length + " voix naturelle" + (naturelles.length > 1 ? "s" : "") + " sur cet appareil : ce sont celles qui sonnent humain. " +
        (naturelles.some(v => /eloise/i.test(v.name)) ? "Essayez-les : Éloïse est une voix d'enfant. " : "") +
        (naturelles.some(v => /online/i.test(v.name)) ? "Elles passent par Internet." : ""))
    : h("p", { class: "voix-conseil" }, "Les voix de cet appareil sont anciennes : elles sonnent robotiques. Pour une voix naturelle, gratuite :",
        h("ul", null,
          h("li", null, "sur ordinateur, ouvrez Lire ensemble dans ", h("b", null, "Microsoft Edge"), " : ses voix « naturelles », dont Denise et Éloïse (une voix d'enfant), sonnent humain ;"),
          h("li", null, "sur iPad ou iPhone : Réglages › Accessibilité › Contenu énoncé › Voix › Français, téléchargez une voix « améliorée », puis rechargez la page ;"),
          h("li", null, "sur Android : Paramètres › Synthèse vocale, installez les voix françaises de Google en haute qualité.")));
  return bloc("La lecture à voix haute",
    sansFr ? "Aucune voix française n'est installée sur cet ordinateur : la lecture à voix haute reste muette. Elle s'ajoute dans les réglages de langue du système."
      : "La voix lit le mot une fois qu'elle l'a lu, la phrase après sa lecture, et dicte dans « J'écris ». Elle ne dit jamais un son seul : une voix de synthèse dirait le nom de la lettre, « èle », au lieu de son son. Sans voix, c'est vous qui lisez et dictez : la bande « Pour l'adulte » vous donne les mots. Le haut-parleur, en haut de chaque écran, coupe ou remet la voix d'un geste.",
    interrupteur("voix-haute", "Avec la voix", etat.voixHaute, v => { etat.voixHaute = v; etat.regle = true; Voix.taire(); sauver(); appliquerAffichage(); parents(); }),
    ...enregistree,
    etat.voixHaute ? vitesse : null,
    CLES_VOIX.size && etat.voixEnregistree !== false && Voix.ok ? h("p", { class: "voix-credit" }, "Pour le reste, la voix de l'appareil :") : null,
    Voix.ok ? conseil : null,
    choix,
    etat.voixHaute && (!sansFr || CLES_VOIX.size) ? h("button", { class: "btn", onclick: () => Voix.dire("Bonjour ! On lit ensemble ?") }, ic("haut"), "Essayer la voix") : null);
}

// ---------- Démarrage ----------

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.closest && e.target.closest("button,select,textarea,summary")) return;
  const b = [...document.querySelectorAll(".adulte .btn.ok, .adulte .btn.plein")].filter(x => !x.hidden && !x.classList.contains("passer")).pop();
  if (b) { e.preventDefault(); b.click(); }
});
appliquerAffichage();
accueil();
brancherNuage();
// Sur forneris.fr, l'appli s'installe et marche sans réseau (sw.js, écrit par src/pwa.py).
if (SUR_SITE && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  navigator.serviceWorker.register("sw.js").catch(() => {});

</script>
</body>
</html>
