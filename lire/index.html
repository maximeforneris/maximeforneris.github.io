// ---------- Problèmes : comparer, les parties et le tout, deux étapes, et « invente ton problème » ----------
// La suite de « Petits problèmes » (maths.js). La voix lit l'énoncé ; le modèle en barres de la
// méthode de Singapour se dessine à la demande, ou tout seul après une erreur. Énoncés neufs,
// fabriqués à partir de quelques gabarits ; les nombres restent dans le niveau (5, 10 ou 20).
(() => {
  const ID = "problemes";
  const ty = s => String(s).replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« ");
  const tys = l => l.map(ty);
  let evaluation = false;

  ICONES["c-bulle"] = '<path d="M4 4h16v12H10l-5 4v-4H4z"/><path d="M10 8.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9v.4M12 13.5h.01"/>';
  ICONES["c-deuxbarres"] = '<rect x="3" y="5" width="11" height="5" rx="1"/><rect x="3" y="14" width="18" height="5" rx="1"/>';
  ICONES["c-tout"] = '<rect x="3" y="5" width="18" height="6" rx="1"/><path d="M11 5v6M3 15c0 2 1 3 3 3h12c2 0 3-1 3-3M12 18v3"/>';
  ICONES["c-etapes"] = '<path d="M4 18h5v-5h5V8h6"/><path d="M17 5l3 3-3 3"/>';
  ICONES["c-melange"] = '<path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4"/><path d="M19 5l2 2-2 2M19 15l2 2-2 2"/>';

  // ----- les choses que l'on compte, et comment en parler -----
  const CHOSES = [
    { s: "bille", p: "billes", g: "f", e: "🔵", lieu: "Dans la boîte", poche: true, couleur: true },
    { s: "biscuit", p: "biscuits", g: "m", e: "🍪", lieu: "Dans la boîte" },
    { s: "coquillage", p: "coquillages", g: "m", e: "🐚", lieu: "Dans le seau", poche: true, verbe: "ramasse" },
    { s: "crayon", p: "crayons", g: "m", e: "✏️", lieu: "Dans la trousse", couleur: true },
    { s: "ballon", p: "ballons", g: "m", e: "🎈", lieu: "À la fête", couleur: true },
    { s: "bonbon", p: "bonbons", g: "m", e: "🍬", lieu: "Dans le sachet", poche: true },
    { s: "pomme", p: "pommes", g: "f", e: "🍎", lieu: "Dans le panier", verbe: "cueille" },
    { s: "marron", p: "marrons", g: "m", e: "🌰", lieu: "Dans le panier", poche: true, verbe: "ramasse" },
    { s: "livre", p: "livres", g: "m", e: "📕", lieu: "Sur l'étagère" },
    { s: "fleur", p: "fleurs", g: "f", e: "🌸", lieu: "Dans le vase", verbe: "cueille", couleur: true },
    { s: "petite voiture", p: "petites voitures", g: "f", e: "🚗", lieu: "Sur le tapis", couleur: true }
  ];
  const COULEURS = [["rouge", "rouge", "rouges", "rouges"], ["bleu", "bleue", "bleus", "bleues"], ["vert", "verte", "verts", "vertes"], ["jaune", "jaune", "jaunes", "jaunes"]];
  const couleur = (c, o, n) => c[(o.g === "f" ? 1 : 0) + (n > 1 ? 2 : 0)];
  const nb = (n, o) => n + " " + (n > 1 ? o.p : o.s);
  const EMO = pr => pr === "elle" ? "👧" : "👦";
  const ils = (x, y) => x[1] === "elle" && y[1] === "elle" ? "elles" : "ils";
  const Maj = s => s.charAt(0).toUpperCase() + s.slice(1);
  const verbeN = (n, s, p) => n > 1 ? p : s;
  const max = () => LIMITES[etat.niveauMaths - 1];
  const gens = n => tirer(ENFANTS, n);
  const paveM = (a, b, rep) => h("div", { class: "problemes-pave" }, pave(a, b, rep));

  // ----- le modèle en barres : des rangées, une même échelle -----
  // rangs : [{ qui, segs: [{ n, l (étiquette), c: a|b|v|barre|fantome }], total }] ; bas : une ligne sous le modèle
  function modele(rangs, bas) {
    const echelle = Math.max(...rangs.map(r => r.segs.reduce((s, x) => s + x.n, 0)));
    return h("div", { class: "problemes-modele" }, rangs.map(r => {
      const long = r.segs.reduce((s, x) => s + x.n, 0), larg = (long / echelle * 100).toFixed(2) + "%";
      return h("div", { class: "problemes-rang" },
        h("span", { class: "problemes-qui" }, r.qui || ""),
        h("div", { class: "problemes-piste" },
          h("div", { class: "problemes-barre", style: "width:" + larg }, r.segs.map(sg => h("span", { class: "problemes-seg " + sg.c, style: "flex:" + sg.n + " 1 0" }, sg.l == null ? "" : String(sg.l)))),
          r.total != null ? h("div", { class: "problemes-acc", style: "width:" + larg }, h("span", null, String(r.total))) : null));
    }), bas ? h("p", { class: "problemes-bas" }, ty(bas)) : null);
  }
  const ou = (x, v) => v == null ? "?" : x;    // l'étiquette inconnue : « ? », ou la réponse une fois trouvée

  // ----- les gabarits : chacun rend { texte, reponse, scene, modele(v), fin, cle } -----
  const G = {
    // comparaison : le comparé est inconnu, « de plus »
    plus() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), a = entier(1, M - 1), d = entier(1, M - a), r = a + d;
      return { cle: "comparer-plus", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + ". " + B[0] + " en a " + d + " de plus que " + A[0] + ". Combien de " + o.p + " " + B[0] + " a-t-" + B[1] + " ?",
        modele: v => modele([{ qui: A[0], segs: [{ n: a, l: a, c: "a" }] }, { qui: B[0], segs: [{ n: a, l: a, c: "a" }, { n: d, l: d, c: "b" }], total: ou(v, v) }]),
        fin: B[0] + " a " + nb(r, o) + "." };
    },
    // comparaison : « de moins »
    moins() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), a = entier(2, M), d = entier(1, a - 1), r = a - d;
      return { cle: "comparer-moins", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + ". " + B[0] + " en a " + d + " de moins que " + A[0] + ". Combien de " + o.p + " " + B[0] + " a-t-" + B[1] + " ?",
        modele: v => modele([{ qui: A[0], segs: [{ n: a, l: a, c: "a" }] }, { qui: B[0], segs: [{ n: r, l: ou(v, v), c: "b" }, { n: d, l: d, c: "fantome" }] }]),
        fin: B[0] + " a " + nb(r, o) + "." };
    },
    // comparaison : l'écart est inconnu
    ecart() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), a = entier(2, M), b = entier(1, a - 1), r = a - b, deMoins = Math.random() < 0.4;
      return { cle: "comparer-ecart", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + " et " + B[0] + " en a " + b + ". " + (deMoins
          ? "Combien de " + o.p + " " + B[0] + " a-t-" + B[1] + " de moins que " + A[0] + " ?"
          : "Combien de " + o.p + " " + A[0] + " a-t-" + A[1] + " de plus que " + B[0] + " ?"),
        modele: v => modele([{ qui: A[0], segs: [{ n: b, l: null, c: "a" }, { n: r, l: ou(v, v), c: "v" }], total: a }, { qui: B[0], segs: [{ n: b, l: b, c: "a" }] }]),
        fin: deMoins ? B[0] + " en a " + r + " de moins." : A[0] + " en a " + r + " de plus." };
    },
    // comparaison : le référent est inconnu (« c'est 3 de plus que… ») ; le piège du mot « plus »
    referent() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), b = entier(2, M), d = entier(1, b - 1), r = b - d;
      return { cle: "comparer-referent", reponse: r, scene: [EMO(B[1]) + " " + B[0], EMO(A[1]) + " " + A[0], o.e],
        texte: B[0] + " a " + nb(b, o) + ". C'est " + d + " de plus que " + A[0] + ". Combien de " + o.p + " " + A[0] + " a-t-" + A[1] + " ?",
        modele: v => modele([{ qui: B[0], segs: [{ n: r, l: null, c: "a" }, { n: d, l: d, c: "b" }], total: b }, { qui: A[0], segs: [{ n: r, l: ou(v, v), c: "a" }] }]),
        fin: A[0] + " a " + nb(r, o) + " : " + d + " de moins que " + B[0] + "." };
    },
    // parties et tout : le tout est inconnu
    tout() {
      const M = max(), a = entier(1, M - 1), b = entier(1, M - a), r = a + b;
      if (Math.random() < 0.55) {
        const o = hasard(CHOSES.filter(x => x.couleur)), [c1, c2] = tirer(COULEURS, 2);
        return { cle: "tout-inconnu", reponse: r, scene: [o.e],
          texte: o.lieu + ", il y a " + nb(a, o) + " " + couleur(c1, o, a) + " et " + b + " " + couleur(c2, o, b) + ". Combien de " + o.p + " y a-t-il en tout ?",
          modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }], total: ou(v, v) }]),
          fin: "Il y a " + nb(r, o) + " en tout." };
      }
      const o = hasard(CHOSES), [A, B] = gens(2);
      return { cle: "tout-inconnu", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + ". " + B[0] + " en a " + b + ". Combien de " + o.p + " ont-" + ils(A, B) + " en tout ?",
        modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }], total: ou(v, v) }]),
        fin: Maj(ils(A, B)) + " en ont " + r + " en tout." };
    },
    // parties et tout : une partie est inconnue
    partie() {
      const M = max(), t = entier(2, M), a = entier(1, t - 1), r = t - a;
      if (Math.random() < 0.5) {
        const o = hasard(CHOSES.filter(x => x.couleur)), [c1, c2] = tirer(COULEURS, 2);
        const autres = r > 1 ? "les autres sont " + couleur(c2, o, 2) : "l'autre est " + couleur(c2, o, 1);
        return { cle: "partie-inconnue", reponse: r, scene: [o.e],
          texte: o.lieu + ", il y a " + nb(t, o) + " : " + a + " " + verbeN(a, "est", "sont") + " " + couleur(c1, o, a) + ", " + autres + ". Combien de " + o.p + " " + couleur(c2, o, 2) + " ?",
          modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: r, l: ou(v, v), c: "v" }], total: t }]),
          fin: "Il y a " + nb(r, o) + " " + couleur(c2, o, r) + "." };
      }
      const o = hasard(CHOSES.filter(x => x.poche)), [A] = gens(1);
      return { cle: "partie-inconnue", reponse: r, scene: [EMO(A[1]) + " " + A[0], "👖", o.e],
        texte: A[0] + " a " + nb(t, o) + " dans ses deux poches. Il y en a " + a + " dans la poche de droite. Combien y en a-t-il dans la poche de gauche ?",
        modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: r, l: ou(v, v), c: "v" }], total: t }], "à droite, puis à gauche"),
        fin: "Il y en a " + r + " dans la poche de gauche." };
    },
    // deux étapes : on reçoit, puis on donne
    recoitDonne() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), a = entier(1, M - 1), b = entier(1, M - a), c = entier(1, a + b - 1), r = a + b - c;
      return { cle: "etapes-recoit-donne", reponse: r, scene: [EMO(A[1]) + " " + A[0], o.e, EMO(B[1]) + " " + B[0]],
        texte: A[0] + " a " + nb(a, o) + ". " + Maj(A[1]) + " en reçoit " + b + ", puis " + A[1] + " en donne " + c + " à " + B[0] + ". Combien de " + o.p + " " + A[0] + " a-t-" + A[1] + " maintenant ?",
        modele: v => modele([{ qui: "avant", segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }] }, { qui: "après", segs: [{ n: r, l: ou(v, v), c: "v" }, { n: c, l: c, c: "barre" }] }], "La partie rayée, c'est ce qu'" + A[1] + " donne."),
        fin: A[0] + " a " + nb(r, o) + " maintenant." };
    },
    // deux étapes : trois parties
    troisFois() {
      const M = Math.max(3, max()), a = entier(1, M - 2), b = entier(1, M - a - 1), c = entier(1, M - a - b), r = a + b + c;
      if (Math.random() < 0.5) {
        const en = n => n + (n > 1 ? " enfants montent" : " enfant monte");
        return { cle: "etapes-trois", reponse: r, scene: ["🚌", "🧒"],
          texte: "Dans le bus, il y a " + (a > 1 ? a + " enfants" : "1 enfant") + ". Au premier arrêt, " + en(b) + ". Au deuxième arrêt, " + en(c) + ". Combien d'enfants y a-t-il dans le bus maintenant ?",
          modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }, { n: c, l: c, c: "b" }], total: ou(v, v) }]),
          fin: "Il y a " + r + " enfants dans le bus." };
      }
      const o = hasard(CHOSES.filter(x => x.verbe)), [A] = gens(1);
      return { cle: "etapes-trois", reponse: r, scene: [EMO(A[1]) + " " + A[0], o.e],
        texte: A[0] + " " + o.verbe + " " + nb(a, o) + " le matin, " + b + " à midi et " + c + " le soir. Combien de " + o.p + " " + A[0] + " a-t-" + A[1] + " en tout ?",
        modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }, { n: c, l: c, c: "a" }], total: ou(v, v) }]),
        fin: A[0] + " a " + nb(r, o) + "." };
    },
    // deux étapes : on donne à deux amis
    donneDeux() {
      const M = Math.max(3, max()), t = entier(3, M), a = entier(1, t - 2), b = entier(1, t - a - 1), r = t - a - b;
      const o = hasard(CHOSES), [A, B, C] = gens(3);
      return { cle: "etapes-donne-deux", reponse: r, scene: [EMO(A[1]) + " " + A[0], o.e, EMO(B[1]) + " " + B[0], EMO(C[1]) + " " + C[0]],
        texte: A[0] + " a " + nb(t, o) + ". " + Maj(A[1]) + " en donne " + a + " à " + B[0] + " et " + b + " à " + C[0] + ". Combien lui en reste-t-il ?",
        modele: v => modele([{ segs: [{ n: a, l: a, c: "barre" }, { n: b, l: b, c: "barre" }, { n: r, l: ou(v, v), c: "v" }], total: t }], "Les parties rayées sont données."),
        fin: "Il lui en reste " + r + "." };
    },
    // deux étapes : comparer, puis réunir
    plusEnTout() {
      const M = Math.max(3, max()), a = entier(1, Math.floor((M - 1) / 2)), d = entier(1, M - 2 * a), r = 2 * a + d;
      const o = hasard(CHOSES), [A, B] = gens(2);
      return { cle: "etapes-comparer-reunir", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + ". " + B[0] + " en a " + d + " de plus que " + A[0] + ". Combien de " + o.p + " ont-" + ils(A, B) + " en tout ?",
        modele: v => modele([{ qui: A[0], segs: [{ n: a, l: a, c: "a" }] }, { qui: B[0], segs: [{ n: a, l: a, c: "a" }, { n: d, l: d, c: "b" }] }], "En tout : " + ou(v, v)),
        fin: Maj(ils(A, B)) + " en ont " + r + " en tout." };
    },
    // deux étapes : le bus, des gens descendent et d'autres montent
    bus() {
      const M = Math.max(3, max()), a = entier(2, M), b = entier(1, a - 1), c = entier(1, Math.min(M - (a - b), Math.max(a, 3))), r = a - b + c;
      const vb = (n, s, p) => n + " " + (n > 1 ? p : s);
      return { cle: "etapes-bus", reponse: r, scene: ["🚌", "🧑", "👵"],
        texte: "Dans le bus, il y a " + a + " personnes. À l'arrêt, " + vb(b, "descend", "descendent") + " et " + vb(c, "monte", "montent") + ". Combien de personnes y a-t-il dans le bus maintenant ?",
        modele: v => modele([{ qui: "avant", segs: [{ n: a - b, l: null, c: "a" }, { n: b, l: b, c: "barre" }], total: a }, { qui: "après", segs: [{ n: a - b, l: null, c: "a" }, { n: c, l: c, c: "b" }], total: ou(v, v) }]),
        fin: "Il y a " + r + " personnes dans le bus." };
    }
  };

  // ----- une question du moteur, à partir d'un gabarit -----
  function question(gabarit) {
    const p = gabarit();
    let zone, bouton;
    const montrer = v => { zone.replaceChildren(p.modele(v)); zone.hidden = false; if (bouton) bouton.hidden = true; };
    return {
      reponse: p.reponse, cle: p.cle + ":" + max(), dire: p.texte,
      rendre(feuille, repondre) {
        zone = h("div", { class: "problemes-zone", hidden: true });
        bouton = evaluation ? null : h("button", { class: "btn discret", onclick: () => montrer(null) }, ic("barres"), "Dessiner le modèle");
        const rep = (v, b) => { const bon = v === p.reponse; repondre(v, b); if (!bon && !evaluation) montrer(null); };
        ajoute(feuille, h("div", { class: "problemes-scene", "aria-hidden": "true" }, p.scene.map(x => h("span", null, x))),
          h("p", { class: "enonce" }, ty(p.texte)), bouton, zone, paveM(0, max(), rep));
      },
      apres() { montrer(p.reponse); Voix.dire(p.fin); },
      aide() { Voix.dire("Regarde le modèle. Où est le point d'interrogation ?"); }
    };
  }
  const CONSEIL = tys(["La voix lit l'histoire. Faites-la redire avec ses mots : qui, combien, ce qui se passe, ce qu'on cherche.",
    "« De plus » ne veut pas toujours dire qu'on ajoute : dans « 9 billes, c'est 3 de plus que Léo », Léo en a moins. Le modèle en barres le montre : deux barres, la plus longue au-dessus.",
    "Le modèle en barres : chaque morceau est une quantité, l'accolade dit le tout, le point d'interrogation dit ce qu'on cherche. Le dessiner sur une feuille, c'est déjà résoudre.",
    "Au début, on joue l'histoire avec de vrais objets ; le dessin vient ensuite, le calcul à la fin."]);
  const fabrique = (id, titre, icone, gabarits) => serie({ id: "problemes-" + id, titre, icone, domaine: "problemes", n: 6, conseil: CONSEIL,
    question: () => question(hasard(gabarits.filter(g => g !== G.referent || etat.niveauMaths > 1))) });
  const sComparer = fabrique("comparer", "Plus que, moins que", "c-deuxbarres", [G.plus, G.moins, G.ecart, G.plus, G.moins, G.referent]);
  const sParties = fabrique("parties", "Les parties et le tout", "c-tout", [G.tout, G.partie]);
  const sEtapes = fabrique("etapes", "En deux étapes", "c-etapes", [G.recoitDonne, G.troisFois, G.donneDeux, G.plusEnTout, G.bus]);
  const sMelange = fabrique("melange", "Tous les problèmes", "c-melange", Object.values(G));

  // ----- « invente ton problème » : trois images, elle raconte, l'adulte valide -----
  function scenario() {
    const M = Math.min(max(), 8), o = hasard(CHOSES), [A, B] = gens(2);
    const genre = hasard(["ajout", "retrait", "comparaison", "reunion"]);
    const a = entier(2, Math.max(2, M - 1)), b = genre === "retrait" ? entier(1, a - 1) : entier(1, Math.max(1, M - a));
    const tas = (n, cls) => h("span", { class: "problemes-tas " + (cls || "") }, Array(n).fill(o.e).join(""));
    const perso = p => h("span", { class: "problemes-perso" }, EMO(p[1]), h("small", null, p[0]));
    const v = [];

// ---------- La tour des syllabes : la suite de « Je fusionne » ----------
// Trois sortes de syllabes plus longues, avec les sons vus : deux consonnes collées avec r ou l
// (bra, fli), la syllabe fermée (mor, sil), le son à deux lettres (chou, moi, lon). On les colle
// comme dans « Je fusionne », on lit une tour de bas en haut, puis des mots qui en contiennent.
(() => {
  const GROUPES = { b: ["r", "l"], k: ["r", "l"], d: ["r"], f: ["r", "l"], g: ["r", "l"], p: ["r", "l"], t: ["r"], v: ["r"] };
  const ECRIT = { k: "c" };                      // le son k s'écrit c dans la tour
  const SIMPLES = ["a", "i", "o", "u", "é", "e", "è"];
  const DOUBLES = ["ou", "on", "an", "oi", "in", "eu", "au", "ai"];
  const DURES_T = ["a", "o", "u", "ou", "on", "an", "oi", "au"];
  const CONSONNES = ["l", "r", "m", "s", "f", "ch", "n", "p", "t", "v", "d", "j", "b", "k", "g", "z"];
  const INTERDITES = ["cul"];
  const lettre = s => ECRIT[s] || s;
  const vu = s => etat.sons.includes(s);

  // Toutes les syllabes possibles avec les sons vus, par famille.
  function toutes() {
    const out = [], cs = CONSONNES.filter(vu), poids = (...x) => x.some(s => s === etat.focus) ? 3 : 1;
    Object.keys(GROUPES).filter(vu).forEach(c => GROUPES[c].filter(vu).forEach(L => SIMPLES.filter(vu).forEach(v =>
      out.push({ famille: "groupe", tuiles: [lettre(c), L, v], cons: [true, true, false], tenu: TENUS.has(lettre(c)), w: poids(c, L, v) }))));
    cs.forEach(c => ["a", "i", "o", "u", "è"].filter(vu).forEach(v => ["r", "l"].filter(vu).forEach(F => {
      if (F === c || ((c === "k" || c === "g") && !DURES_T.includes(v))) return;
      const ve = v === "è" ? "e" : v;            // le e de « mer », « sel » : è vu en classe
      out.push({ famille: "fermee", tuiles: [lettre(c), ve, F], cons: [true, false, true], tenu: TENUS.has(lettre(c)), w: poids(c, v, F) });
    })));
    cs.forEach(c => DOUBLES.filter(vu).forEach(v => {
      if ((c === "k" || c === "g") && !DURES_T.includes(v)) return;
      out.push({ famille: "double", tuiles: [lettre(c), SON[v].g[0]], cons: [true, false], tenu: TENUS.has(lettre(c)), w: poids(c, v) });
    }));
    if (vu("ch")) SIMPLES.filter(vu).forEach(v => out.push({ famille: "double", tuiles: ["ch", v], cons: [true, false], tenu: true, w: poids("ch", v) }));
    out.forEach(s => (s.texte = s.tuiles.join("")));
    return out.filter(s => !INTERDITES.includes(s.texte));
  }
  // Un tirage qui mêle les familles, la plus neuve (les groupes) un peu plus souvent.
  function tirerSyllabes(n) {
    const t = toutes(), fam = [...new Set(t.map(s => s.famille))];
    if (!t.length) return [];
    const pf = { groupe: 1.5, fermee: 1.2, double: 0.8 };
    return tirer(t, n, s => s.w * pf[s.famille] / t.filter(x => x.famille === s.famille).length * fam.length);
  }

  // ----- coller les lettres, en une ou deux fois -----
  function rendreColle(it, { feuille, adulte, suivant }) {
    const chev = (t, i) => h("div", { class: "chev" + (i ? " v2" : "") + (it.cons[i] ? " cons" : "") }, h("span", { class: "lecture" }, t));
    const trois = it.tuiles.length === 3;
    const dedans = trois ? h("div", { class: "chevrons" }, chev(it.tuiles[0], 0), chev(it.tuiles[1], 1)) : null;
    const tout = h("div", { class: "chevrons" }, trois ? [dedans, chev(it.tuiles[2], 2)] : [chev(it.tuiles[0], 0), chev(it.tuiles[1], 1)]);
    const res = h("div", { class: "resultat vide lecture" }, "?");
    const coller = h("button", { class: "btn plein", onclick: faire }, ic("fusion"), "On colle !");
    ajoute(feuille, h("p", { class: "consigne" }, "Colle les lettres pour lire la syllabe."),
      h("div", { class: "fusion" + (trois ? " tour-trois" : "") }, tout, h("span", { class: "fleche" }, ic("suivant")), res), coller);
    const [a, b, c] = it.tuiles, ab = a + b;
    const aides = {
      groupe: [it.tenu ? "Faites tenir « " + a + a + a + " » et glisser vers « " + b + " » : on entend « " + ab + " »."
        : "« " + a + " » est bref : il se colle tout de suite à « " + b + " », sans « e » entre les deux : « " + ab + " ».",
        "« " + ab + " », puis on glisse vers « " + c + " » : « " + it.texte + " »."],
      fermee: ["D'abord la syllabe connue : « " + ab + " ».", "« " + ab + " », puis on ferme avec « " + c + " », sans rien ajouter : « " + it.texte + " »."],
      double: [(b.length > 1 ? "« " + b + " » : deux lettres, un seul son. " : "« " + a + " » : deux lettres, un seul son. ")
        + (it.tenu ? "On tient « " + a + " » et on glisse vers « " + b + " » : « " + it.texte + " »." : "« " + a + " » est bref, collé à « " + b + " » : « " + it.texte + " ».")]
    }[it.famille];
    let pas = 0, rate = false;
    const depart = () => bandeAdulte(adulte, [astuce(aides[0])]);
    function faire() {
      if (trois && pas === 0) {
        pas = 1; dedans.classList.add("colle");
        setTimeout(() => { res.textContent = ab; res.classList.remove("vide"); res.classList.add("apparait"); }, 450);
        bandeAdulte(adulte, [astuce(aides[1])]);
        return;
      }
      tout.classList.add("colle"); coller.hidden = true;
      setTimeout(() => { res.textContent = it.texte; res.classList.remove("vide", "apparait"); void res.offsetWidth; res.classList.add("apparait"); }, 480);
      bandeAdulte(adulte, [astuce("Elle lit la syllabe à voix haute : « " + it.texte + " »."),
        bEncore(() => { rate = true; pas = 0; tout.classList.remove("colle"); if (dedans) dedans.classList.remove("colle"); res.textContent = "?"; res.classList.add("vide"); res.classList.remove("apparait"); coller.hidden = false; depart(); }, "On recommence"),
        bOk(e => { if (e.currentTarget.disabled) return; e.currentTarget.disabled = true; noter("decodage", it.texte, !rate); bip("ok"); etoile(feuille); setTimeout(suivant, 600); })]);
    }

  }

  // ----- la tour : on lit de bas en haut, l'adulte valide chaque étage -----
  function rendreTour(syls, { feuille, adulte, suivant }) {
    const briques = syls.map((s, i) => h("div", { class: "tour-brique lecture" + (i % 2 ? " decale" : "") }, s.texte));
    const drapeau = h("div", { class: "tour-drapeau", "aria-hidden": "true" }, "🚩");
    ajoute(feuille, h("p", { class: "consigne" }, "Lis la tour, de bas en haut."), h("div", { class: "tour-tour" }, briques, drapeau));
    let i = 0, dur = false, lues = 0;
    function etage() {
      briques.forEach((b, k) => b.classList.toggle("ici", k === i));
      bandeAdulte(adulte, [astuce("Elle lit l'étage qui brille, puis vous validez. Un étage qui accroche : « On relit »."),
        bEncore(() => { dur = true; briques[i].classList.add("dure"); }, "On relit"),
        bOk(() => {

          i++; dur = false;
          if (i < briques.length) return etage();
          drapeau.classList.add("plante"); etoile(feuille);
          bandeAdulte(adulte, [astuce(lues === briques.length ? "Toute la tour du premier coup ! Elle peut la relire d'en haut, pour le plaisir." : "La tour est lue. Les étages orange sont à relire une fois encore."), bSuivant(suivant)]);
        }, "Bien lu !")]);
    }
    etage();
  }

  // ----- des mots qui contiennent ces syllabes -----
  const VOY = "aeiouyéèêâîôûœ";
  function sorteSyllabe(lettres) {
    const t = lettres.toLowerCase();
    if (/[bcdfgptv][rl]/.test(t) && !/^[rl]/.test(t)) return "groupe";
    if (new RegExp("[^" + VOY + "][" + VOY + "]+[rl]$").test(t)) return "fermee";
    return null;
  }
  const sortes = m => m.syl.map(s => sorteSyllabe(s.filter(l => !l.m).map(l => l.c).join("")));
  function motsTour(n) {
    const l = motsLisibles(etat).filter(m => sortes(m).some(Boolean) && m.forme.length > 2);
    return tirer(l, n, m => poidsMot(etat)(m) * (sortes(m).includes("groupe") ? 2 : 1) * (m.syl.length > 1 ? 1.5 : 1));
  }
  function rendreMotTour(m, { feuille, adulte, suivant }) {
    const el = rendreMot(m, m.forme), s = sortes(m);
    el.querySelectorAll(".syl").forEach((x, k) => { if (s[k]) x.classList.add("tour-cible"); });
    const lec = h("div", { class: "lecture grand" }, el);
    const img = h("div", { class: "image", hidden: true }, m.e || "⭐");

    ajoute(feuille, h("p", { class: "consigne" }, "Lis le mot."), lec, img);
    bandeAdulte(adulte, [astuce("La syllabe surlignée est celle de la tour. Elle lit le mot entier, vous validez."),
      bEncore(() => { aide = true; lec.classList.add("decoupe"); }),
      bOk(() => {
        noter("decodage", m.forme, !aide); etat.lus[m.forme] = (etat.lus[m.forme] || 0) + 1; sauver(); bip("ok");
        img.hidden = false; img.classList.add("apparait"); Voix.dire(m.forme);
        bandeAdulte(adulte, [astuce(m.e ? "L'image vient après la lecture : est-ce bien le mot lu ?" : "Bravo !"), bSuivant(suivant)]);
      })]);

  // ----- l'enchaînement d'une partie -----
  const CONSEIL = ["Comme dans « Je fusionne » : le doigt suit la flèche, on colle les sons sans les séparer.",
    "Deux consonnes collées : « b » et « r » font « br », sans « e » entre elles ; puis la voyelle : « bra ».",

    ecran = "tour";
    if (!items.length) {

    "Une fiche par son, dans l'ordre de la classe : la lettre en attachée, son point de départ, le geste à dire en traçant, puis des syllabes et des mots qu'elle sait lire. Dix minutes par fiche. Imprimez en taille réelle (100 %), sans « ajuster à la page » : les lignes sont aux mesures du cahier de CP.",
    h("div", { class: "coches fiches" }, SONS.map((s, k) => lien("fiche-" + String(k + 1).padStart(2, "0") + ".pdf", s.g[0],
      (etat.sons.includes(s.id) ? "vu" : "") + (s.id === etat.focus ? " focus" : "")))),
    h("div", { class: "ligne" }, lien("periode-1.pdf", "Toute la période 1 (13 fiches)", "btn"), lien("toutes-les-fiches.pdf", "Toutes les fiches", "btn discret")));
}

function blocVoix() {
  if (!Voix.ok) return bloc("La lecture à voix haute", "Ce navigateur ne sait pas lire à voix haute. Chrome, Edge et Safari le font.");
  const sansFr = Voix.toutes > 0 && !Voix.liste.length;
  const choix = Voix.liste.length > 1 ? h("div", { class: "ligne" }, h("label", { for: "voix" }, "La voix"),
    h("select", { id: "voix", onchange: e => { etat.voix = e.target.value; Voix.charger(); sauver(); Voix.dire("Bonjour ! On lit ensemble ?"); } },
      Voix.liste.map(v => h("option", { value: v.voiceURI, selected: Voix.choisie && v.voiceURI === Voix.choisie.voiceURI ? true : null }, v.name + " (" + v.lang + ")")))) : null;
  return bloc("La lecture à voix haute",
    sansFr ? "Aucune voix française n'est installée sur cet ordinateur : la lecture à voix haute reste muette. Elle s'ajoute dans les réglages de langue du système."
      : "La voix lit le mot une fois qu'elle l'a lu, la phrase après sa lecture, et dicte dans « J'écris ». Elle ne dit jamais un son seul : une voix de synthèse dirait le nom de la lettre, « èle », au lieu de son son.",
    interrupteur("voix-haute", "Lire les mots à voix haute", etat.voixHaute, v => { etat.voixHaute = v; etat.regle = true; sauver(); parents(); }),
    choix,
    etat.voixHaute && !sansFr ? h("button", { class: "btn", onclick: () => Voix.dire("Bonjour ! On lit ensemble ?") }, ic("haut"), "Essayer la voix") : null);
}

// ---------- Démarrage ----------

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.closest && e.target.closest("button,select,textarea,summary")) return;
  const b = [...document.querySelectorAll(".adulte .btn.ok, .adulte .btn.plein")].filter(x => !x.hidden && !x.classList.contains("passer")).pop();
  if (b) { e.preventDefault(); b.click(); }
});
appliquerAffichage();
accueil();
brancherNuage();
// Sur forneris.fr, l'appli s'installe et marche sans réseau (sw.js, écrit par src/pwa.py).
if (SUR_SITE && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  navigator.serviceWorker.register("sw.js").catch(() => {});

</script>
</body>
