.maphrase-col button{border-radius:14px;background:var(--papier);box-shadow:var(--ombre);border:3px solid transparent;padding:4px 10px;font-size:1.7rem;line-height:1.6}
.maphrase-col button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-pale)}
.maphrase-col button.maphrase-faux{border-color:var(--faux);background:var(--encore-pale)}
.maphrase-ligne{min-height:64px;width:100%;max-width:900px;text-align:center;background:var(--papier);border-radius:12px;padding:4px 10px}
.maphrase-scene{width:min(420px,100%)}
@media (max-width:760px){.maphrase-colonnes{grid-template-columns:1fr}.maphrase-col{grid-template-columns:repeat(3,minmax(0,1fr))}
  .maphrase-col h3{grid-column:1/-1}.maphrase-col button{font-size:1.25rem;padding:4px 4px}.maphrase-place{min-width:60px;font-size:1.5rem}
  .maphrase-bloc .maphrase-fixe{font-size:1.9rem}
  .maphrase-tuiles{gap:8px}.maphrase-tuiles .tuile{min-width:52px;height:58px;font-size:1.9rem;padding:0 8px}}
`));

  // ---------- Les phrases à composer ----------
  const BANQUE = MAPHRASE_PHRASES.trim().split("\n").flatMap(l => l.split("|").slice(1).map(t => t.trim()));
  function phrases(e) {
    e = e || etat;
    const l = new Set(BANQUE.filter(t => Cmp.lisibleTexte(t, e)));
    PHRASES_L.filter(p => phraseLisible(p, e)).forEach(p => l.add(p.texte));
    CMP_VRAIBETE.trim().split("\n").map(x => x.split("|")).filter(x => x[1] === "v" && Cmp.lisibleTexte(x[0], e)).forEach(x => l.add(x[0]));
    return [...l];
  }
  const nbMots = t => t.split(" ").length;
  // Les étiquettes-mots : « Il y a » reste d'un seul tenant, comme le mot-outil de la classe.
  function decouperMots(t) {
    const brut = t.replace(/\s*([.!?])$/, " $1").split(" ");
    const out = [];
    for (let i = 0; i < brut.length; i++) {
      if (brut[i].toLowerCase() === "il" && (brut[i + 1] || "").toLowerCase() === "y" && (brut[i + 2] || "").toLowerCase() === "a") { out.push(brut.slice(i, i + 3).join(" ")); i += 2; }
      else out.push(brut[i]);
    }
    return out;
  }
  const PROCHES = { et: "est", est: "et", un: "une", une: "un", le: "la", la: "le", les: "des", des: "les", sur: "sous", sous: "sur",
    dans: "sur", a: "à", "à": "a", il: "elle", elle: "il", mon: "ma", ma: "mon", du: "de", de: "du", lit: "rit", rit: "lit" };
  function intrus(mots, n) {
    const bas = mots.map(m => m.toLowerCase());
    const c = [];
    bas.forEach(m => { const p = PROCHES[m]; if (p && !bas.includes(p) && !c.includes(p) && lit(p)) c.push(p); });
    const reste = motsLisibles(etat).map(m => m.forme).filter(f => f.length <= 5 && f === f.toLowerCase() && !bas.includes(f) && !f.includes("'"));
    while (c.length < n && reste.length) c.push(reste.splice(Math.floor(Math.random() * reste.length), 1)[0]);
    return tirer(c, n);
  }
  // Un mot qu'on écrit lettre à lettre : ni mot-outil, ni élision, ni ponctuation.
  function aEcrire(mot) {
    if (/^[.!?]$/.test(mot) || mot.includes("'") || /\s/.test(mot)) return null;
    const js = jetons(mot);
    if (js.length !== 1 || js[0].outil || !js[0].mot) return null;
    const m = js[0].mot;
    const cases = decouper(mot, m.tags)[0];
    if (mot[0] !== mot[0].toLowerCase()) cases[0] = cases[0].charAt(0).toUpperCase() + cases[0].slice(1);
    return { mot, cases, chut: casesMuettes(m, cases) };
  }
  function choisirPhrase() {
    const l = phrases();
    const max = [4, 6, 8][etat.niveau - 1];
    let c = l.filter(t => nbMots(t) <= max && nbMots(t) >= 2);
    if (!c.length) c = l;
    if (!c.length) return null;
    return tirer(c, 1, t => (Cmp.aFocus(t) ? 3 : 1) * (jetons(t).some(j => j.outil) ? 2 : 1))[0];
  }

  // ---------- Une partie à plusieurs écrans : compteur, feuille, bande de l'adulte, fin ----------
  function partie(titre, n, faire, opts) {
    opts = opts || {};
    let k = 0, etoiles = 0;
    ecran = "maphrase";
    const suivant = gagne => { if (gagne) etoiles++; k++; if (k < n) montrer(); else fin(); };
    function montrer() {
      vider();
      const feuille = h("section", { class: "feuille" }), adulte = h("div", { class: "adulte" });
      ajoute(racine, barre(titre, h("div", { class: "ligne" }, pastillesSeance(), h("span", { class: "compte" }, (k + 1) + " / " + n))), feuille, adulte,
        opts.evaluation || !opts.conseil ? null : conseil({ conseil: opts.conseil }));
      if (!faire({ feuille, adulte, suivant, evaluation: !!opts.evaluation })) {
        ajoute(feuille, h("p", { class: "consigne" }, "Pas encore de phrase à écrire avec les sons et les mots-outils de la classe."));
        bandeAdulte(adulte, [bSuivant(() => { k = n; fin(); }, "Retour")]);
      }
    }
    function fin() {
      if (opts.finir) return opts.finir({ etoiles, n });
      vider(); bip("fin"); if (etoiles) pluie("⭐");
      ajoute(racine, barre(titre), h("section", { class: "feuille" }, h("p", { class: "bravo" }, etoiles >= n - 1 ? "Bravo !" : "Bien joué !"),
        h("div", { class: "image" }, "⭐".repeat(etoiles) || "🙂"),
        h("div", { class: "ligne" }, h("button", { class: "btn plein", onclick: () => partie(titre, n, faire, opts) }, ic("encore"), "Encore"),
          h("button", { class: "btn", onclick: ouvrir }, ic("ecris"), "Ma phrase"))));
    }
    montrer();
  }

  // ---------- 1. Je compose la phrase dictée ----------
  function composer({ feuille, adulte, suivant, evaluation }) {
    const texte = choisirPhrase();
    if (!texte) return false;
    const mots = decouperMots(texte);
    const ecoute = Voix.dispo() ? h("button", { class: "btn ecoute dictee", onclick: () => Voix.dire(texte, true) }, ic("haut"), "Écoute") : null;
    const souffle = h("span", { class: "souffle lecture", hidden: true }, texte);
    const voir = h("button", { class: "btn", onclick: () => { souffle.hidden = !souffle.hidden; } }, ic("oeil"), "Ce qu'il faut dicter");
    let rate = false, essais = 0;
    const astuceDictee = Voix.dispo() ? "La voix dicte la phrase ; « Écoute » la redit. Vous pouvez aussi la dicter vous-même :" : "Dictez la phrase lentement, deux fois :";

    // Phase 1 : les étiquettes-mots, dans l'ordre, et le point.
    const places = mots.map(() => ({ el: null, t: null }));
    const zone = h("div", { class: "maphrase-mots", role: "group", "aria-label": "La phrase" });
    places.forEach((p, i) => { p.el = h("button", { class: "maphrase-place lecture", "aria-label": "Place " + (i + 1), onclick: () => retirer(i) }); zone.append(p.el); });
    const tuiles = melanger([...mots, ...intrus(mots.filter(m => !/^[.!?]$/.test(m)), etat.niveau === 1 ? 1 : 2)]).map(t => {
      const b = h("button", { class: "tuile lecture", onclick: () => poser(b, t) }, rendreJetons(jetons(t)));
      return b;
    });
    const tas = h("div", { class: "tuiles maphrase-tuiles" }, tuiles);
    const verifier = h("button", { class: "btn plein", disabled: true, onclick: controle1 }, ic("ok"), "Vérifier");
    function poser(b, t) {
      const p = places.find(x => !x.t); if (!p) return;
      p.t = t; p.b = b; b.disabled = true; p.el.replaceChildren(...rendreJetons(jetons(t))); p.el.classList.add("maphrase-pleine"); p.el.classList.remove("maphrase-faux");
      verifier.disabled = places.some(x => !x.t);
    }
    function retirer(i) {
      const p = places[i]; if (!p.t) return;
      p.b.disabled = false; p.t = null; p.el.replaceChildren(); p.el.classList.remove("maphrase-pleine", "maphrase-faux"); verifier.disabled = true;
    }
    function controle1() {
      const bon = places.every((p, i) => p.t === mots[i]);
      places.forEach((p, i) => p.el.classList.toggle("maphrase-faux", p.t !== mots[i]));
      if (bon || evaluation) {
        if (!bon) rate = true;
        places.forEach(p => p.el.classList.add("maphrase-juste"));
        bip(bon ? "ok" : "non");
        return setTimeout(phase2, bon ? 700 : 400);
      }
      rate = true; essais++; bip("non"); zone.classList.add("secoue"); setTimeout(() => zone.classList.remove("secoue"), 420);
      bandeAdulte(adulte, [astuce("Les places orange sont à revoir : touchez-les pour rendre l'étiquette. Faites réécouter la phrase, mot par mot."), souffle, voir]);
    }
    ajoute(feuille, ecoute || h("div", { class: "oreille" }, ic("oreille"), "Écoute bien."), h("p", { class: "consigne", style: "align-self:center" }, "Compose la phrase avec les étiquettes."), zone, tas, verifier);
    bandeAdulte(adulte, [astuce(astuceDictee), souffle, voir]);
    if (ecoute) setTimeout(() => Voix.dire(texte, true), 450);

    // Phase 2 : chaque mot qu'on déchiffre s'écrit avec des étiquettes-lettres ; les mots-outils restent.
    function phase2() {
      feuille.replaceChildren();
      const blocs = mots.map(m => ({ m, e: aEcrire(m) }));
      const cases = [];
      const ecrit = h("div", { class: "maphrase-ecrit lecture" }, blocs.map(b => {
        if (!b.e) return h("div", { class: "maphrase-bloc" }, h("span", { class: "maphrase-fixe" }, rendreJetons(jetons(b.m))));
        const cs = b.e.cases.map((c, j) => {
          const s = { attendu: c, t: null };
          s.el = h("button", { class: "case" + (b.e.chut[j] ? " chut" : ""), "aria-label": "Case " + (cases.length + 1), onclick: () => rendre(s) });
          cases.push(s); return s.el;
        });
        return h("div", { class: "maphrase-bloc" }, h("div", { class: "cases" }, h("div", { class: "m" }, cs)),
          Voix.dispo() ? h("button", { class: "maphrase-dire", onclick: () => Voix.dire(b.m.replace(/[.!?]/g, ""), true) }, ic("haut"), "le mot") : null);
      }));
      if (!cases.length) return fin2(true);
      const attendus = cases.map(s => s.attendu);
      const vus = [...new Set(etat.sons.map(id => SON[id].g[0]))].filter(g => !attendus.includes(g) && g !== "h");
      const capitales = attendus.filter(g => g[0] !== g[0].toLowerCase()).map(g => g.toLowerCase()).filter(g => !attendus.includes(g));
      const lettres = melanger([...attendus, ...tirer(vus, 3), ...capitales]).map(t => { const tu = { t }; tu.b = h("button", { class: "tuile lecture", onclick: () => mettre(tu) }, t); return tu; });
      const tas2 = h("div", { class: "tuiles maphrase-tuiles" }, lettres.map(x => x.b));
      const verif = h("button", { class: "btn plein", disabled: true, onclick: controle2 }, ic("ok"), "Vérifier");
      let essais2 = 0;
      function mettre(tu) {
        const s = cases.find(x => !x.t); if (!s) return;
        s.t = tu; s.el.textContent = tu.t; s.el.classList.add("pleine"); s.el.classList.remove("faux"); tu.b.disabled = true;
        verif.disabled = cases.some(x => !x.t);
      }
      function rendre(s) { if (!s.t) return; s.t.b.disabled = false; s.t = null; s.el.textContent = ""; s.el.classList.remove("pleine", "faux"); verif.disabled = true; }
      function controle2() {
        const bon = cases.every(s => s.t && s.t.t === s.attendu);
        cases.forEach(s => s.el.classList.toggle("faux", !(s.t && s.t.t === s.attendu)));
        if (bon || evaluation) { if (!bon) rate = true; return fin2(bon); }
        rate = true; essais2++; bip("non"); ecrit.classList.add("secoue"); setTimeout(() => ecrit.classList.remove("secoue"), 420);
        bandeAdulte(adulte, [astuce("Les cases orange sont à revoir : touchez-les pour rendre la lettre. Faites dire le mot lentement, son par son."),
          essais2 >= 2 ? h("button", { class: "btn encore", onclick: () => { cases.forEach(rendre); cases.forEach(s => { const tu = lettres.find(x => x.t === s.attendu && !x.b.disabled); if (tu) mettre(tu); }); fin2(false); } }, ic("oeil"), "Montrer la réponse") : null]);
      }
      ajoute(feuille, h("p", { class: "consigne", style: "align-self:center" }, "Écris maintenant chaque mot avec les lettres."), ecrit, tas2, verif);
      bandeAdulte(adulte, [astuce("Les mots-outils sont déjà écrits. Pour les autres, elle dit le mot lentement et pose les sons dans l'ordre ; une case « chut » attend une lettre muette."), souffle, voir]);
    }
    function fin2(bon) {
      noter(DOM, "compose:" + texte, !rate && bon);
      bip(bon ? "ok" : "non");
      if (evaluation) return setTimeout(() => suivant(!rate && bon), 600);
      feuille.replaceChildren(h("p", { class: "consigne", style: "align-self:center" }, "Relis ta phrase."), h("div", { class: "lecture moyen comprendre-phrase apparait" }, rendreJetons(jetons(texte))));
      if (!rate) etoile(feuille);
      Voix.dire(texte);
      bandeAdulte(adulte, [astuce("Elle relit sa phrase, le doigt sous les mots. Montrez la majuscule au début et le point à la fin."), bSuivant(() => suivant(!rate && bon))]);
    }
    return true;
  }

  // ---------- 2. J'écris sur une image ----------
  const IMAGE = serie({ id: "maphrase-image", titre: "J'écris sur une image", icone: "maphrase", domaine: DOM, n: 5,
    conseil: ["Elle regarde l'image, puis choisit une étiquette dans chaque colonne pour fabriquer la phrase qui la dit.",
      "Il peut y avoir deux bonnes phrases : « Le rat lit sur le mur » et « Le rat est sur le mur » disent toutes deux l'image.",
      "Faites relire la phrase finie, d'une traite."],
    question() {
      let f = null;
      for (let i = 0; i < 8 && !f; i++) { f = Cmp.fabriquer({ modeles: ["A", "C", "D"] }); if (f && !f.morceaux) f = null; }
      if (!f) return null;
      const P = Cmp.pieces(etat), mo = f.morceaux, avecComp = !!mo.comp;
      const sujets = melanger([mo.sujet, ...tirer(P.persos.filter(p => p.e !== f.sujet.e && p.gn !== mo.sujet), 2).map(p => p.gn)]);
      const bonsVerbes = f.modele === "D" ? [mo.verbe, "est"].filter(lit) : [mo.verbe];
      const imgs = new Set([f.action && f.action.img]);
      const autresV = tirer((avecComp ? P.actionsLieu : P.actions).filter(a => !imgs.has(a.img) && !bonsVerbes.includes(a.v)), 3 - bonsVerbes.length).map(a => a.v);
      const verbes = melanger([...bonsVerbes, ...autresV]);
      const comps = avecComp ? melanger([mo.comp, ...tirer(P.places.filter(x => x.txt !== mo.comp && x.lieu.id !== f.place.lieu.id), 2).map(x => x.txt)]) : null;
      const cols = [["Qui ?", sujets, "s"], ["Fait quoi ?", verbes, "v"]].concat(avecComp ? [["Où ?", comps, "c"]] : []);
      if (cols.some(c => c[1].length < 2)) return null;
      const valide = v => v.s === mo.sujet && bonsVerbes.includes(v.v) && (!avecComp || v.c === mo.comp);
      const choisi = {};
      let ligne, btnV, boutons = {};
      const assembler = () => [choisi.s ? Cmp.cap(choisi.s) : null, choisi.v, choisi.c].filter(Boolean).join(" ") + (cols.every(c => choisi[c[2]]) ? "." : "");
      return {
        verifier: valide, cle: "image:" + f.modele, lu: [...sujets.map(Cmp.cap), ...verbes, ...(comps || [])], format: "image",
        solution: { s: mo.sujet, v: mo.verbe, c: mo.comp || undefined },
        dire: "Regarde l'image. Fabrique la phrase qui la dit.",
        astuce: "Une étiquette par colonne. Elle lit chaque étiquette avant de choisir.",
        rendre(feuille, repondre) {
          ligne = h("div", { class: "maphrase-ligne lecture moyen" });
          btnV = h("button", { class: "btn plein", disabled: true, onclick: () => {
            const v = { s: choisi.s, v: choisi.v, c: choisi.c };
            if (!valide(v)) {
              Object.entries(boutons).forEach(([k, l]) => l.forEach(b => b.classList.remove("maphrase-faux")));
              if (v.s !== mo.sujet) boutons.s.find(b => b.dataset.v === v.s).classList.add("maphrase-faux");
              if (!bonsVerbes.includes(v.v)) boutons.v.find(b => b.dataset.v === v.v).classList.add("maphrase-faux");
              if (avecComp && v.c !== mo.comp) boutons.c.find(b => b.dataset.v === v.c).classList.add("maphrase-faux");
            }
            repondre(v, null);
          } }, ic("ok"), "Vérifier");
          const colonnes = cols.map(([titre, liste, cle]) => {
            boutons[cle] = liste.map(t => h("button", { "data-v": t, "aria-pressed": "false", class: "lecture", onclick: ev => {
              choisi[cle] = t;
              boutons[cle].forEach(b => { b.setAttribute("aria-pressed", String(b === ev.currentTarget)); b.classList.remove("maphrase-faux"); });
              ligne.replaceChildren(...rendreJetons(jetons(assembler())));
              btnV.disabled = !cols.every(c => choisi[c[2]]);
            } }, rendreJetons(jetons(cle === "s" ? Cmp.cap(t) : t))));
            return h("div", { class: "maphrase-col" }, h("h3", null, titre), boutons[cle]);
          });
          ajoute(feuille, h("p", { class: "consigne" }, "Fabrique la phrase qui dit l'image."), Cmp.dessiner(f.juste, { classe: "maphrase-scene" }),
            h("div", { class: "maphrase-colonnes", style: "--n:" + cols.length }, colonnes), ligne, btnV);
        },
        apres() { btnV.hidden = true; Voix.dire(assembler()); }
      };
    } });

  // ---------- Le menu, et le papier ----------
  function offre(e) {
    e = e || etat;
    return { composer: phrases(e).length, image: Cmp.combien(e, ["A", "C", "D"]) };
  }
  const CONSEILS = ["« Je compose la phrase » : la voix dicte, elle remet les étiquettes-mots dans l'ordre, puis écrit les mots qu'elle sait déchiffrer avec des étiquettes-lettres. Les mots-outils, appris par cœur, sont déjà là.",
    "La copie et la dictée se font à la main, sur papier : une page par son, à imprimer en taille réelle. Celle de la semaine suit le son de la semaine réglé dans le coin des parents.",
    "En copie, elle lit la phrase, la repasse en attaché, puis l'écrit seule, mot par mot, sans lettre à lettre."];
  function ouvrir() {
    const o = offre(), son = etat.focus, g = SON[son].g[0];
    Cmp.menu("Ma phrase", "J'écris une phrase.", [
      { titre: "Je compose la phrase", pic: "🧩", court: "La voix dicte, je pose les étiquettes", n: o.composer ? null : 0, plein: 1, ouvrir: () => partie("Je compose la phrase", 3, composer, { conseil: CONSEILS.slice(0, 1) }) },
      { titre: "J'écris sur une image", pic: "🖼️", court: "Je fabrique la phrase qui dit l'image", n: o.image ? null : 0, ouvrir: () => jouerSerie(IMAGE) }
    ], CONSEILS, "À l'écran, elle compose avec des étiquettes. La copie et la dictée se font sur papier : les deux pages de la semaine sont ci-dessus.",
    [lienImprimer("copie/copie-" + nn(son) + ".pdf", "La copie de la semaine · son « " + g + " »", "btn"),
      lienImprimer("copie/dictee-" + nn(son) + ".pdf", "La dictée de la semaine · son « " + g + " »", "btn")]);
  }
  function ecranPapier() {
    const { feuille, adulte } = ecranModule("La copie et la dictée");
    const ligne = (prefixe) => h("div", { class: "coches fiches" }, SONS.map(s => h("a", { class: (etat.sons.includes(s.id) ? "vu" : "") + (s.id === etat.focus ? " focus" : ""),
      href: BASE_IMPRIMER + "copie/" + prefixe + "-" + nn(s.id) + ".pdf", target: "_blank", rel: "noopener" }, s.g[0])));
    ajoute(feuille, h("p", { class: "consigne" }, "Une page par son, dans l'ordre de la classe."),
      h("h3", null, "Le cahier de copie"), ligne("copie"),
      h("h3", null, "Les dictées"), ligne("dictee"),
      h("div", { class: "comprendre-papier" }, lienImprimer("copie/copie-periode-1.pdf", "Copie : toute la période 1", "btn discret"),
        lienImprimer("copie/dictees-periode-1.pdf", "Dictées : toute la période 1", "btn discret"),
        lienImprimer("copie/cahier-de-copie.pdf", "Tout le cahier de copie", "btn discret"), lienImprimer("copie/dictees.pdf", "Toutes les dictées", "btn discret")));
    bandeAdulte(adulte, [astuce("Le son de la semaine est entouré. Imprimez en taille réelle (100 %), sans « ajuster à la page » : les lignes sont aux mesures du cahier de CP.")]);
  }

  rubrique({ id: "maphrase", onglet: "ecrire", section: "Écrire", ordre: 20, titre: "Ma phrase", icone: "maphrase",
    court: "Je compose une phrase dictée, j'écris sur une image", ouvrir,
    dispo: () => { const o = offre(); return o.composer + o.image > 0; } });
  rubrique({ id: "maphrase-papier", onglet: "ecrire", section: "À imprimer", ordre: 20, titre: "La copie et la dictée", icone: "imprimer",
    court: "Une page de copie et une page de dictée par son", ouvrir: ecranPapier });
  pointEtape(DOM, "Écrire une phrase dictée", suite => partie("Écrire une phrase dictée", 2, composer, { evaluation: true, finir: suite }));

  Cmp.maphrase = { series: { image: IMAGE }, offre, composer, partie, phrases, decouperMots, aEcrire, ouvrir };
})();

// ---------- Mesurer : la monnaie, les longueurs, le temps ----------
// Payer juste avec des pièces et des billets dessinés pour jouer (ni copie ni imitation des vrais) ;
// comparer et mesurer en centimètres sur une règle dessinée ; les jours, les mois, le calendrier.
// Tout le module est enfermé dans une fonction.
(() => {
  const ID = "mesures";
  const NS = "http://www.w3.org/2000/svg";
  const ty = s => String(s).replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« ");
  const tys = l => l.map(ty);
  let evaluation = false;

  ICONES["c-piece"] = '<circle cx="9" cy="12" r="6"/><circle cx="9" cy="12" r="3"/><rect x="14" y="7" width="8" height="10" rx="1"/>';
  ICONES["c-regle"] = '<rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/>';

  // ----- la monnaie : des pièces et des billets dessinés pour jouer -----
  // La pièce de 1 € a le tour doré et le cœur argenté ; celle de 2 €, l'inverse. Les billets
  // gardent la couleur et la taille relative des vrais (5 gris, 10 rouge, 20 bleu), rien d'autre.
  function piece(v) {
    const ext = v === 1 ? "or" : "argent", int = v === 1 ? "argent" : "or", r = v === 1 ? 26.5 : 29.5;
    return svgEl("0 0 60 60", "mesures-piece p" + v,
      '<circle cx="30" cy="30" r="' + r + '" class="mesures-' + ext + '"/><circle cx="30" cy="30" r="' + (r * 0.64).toFixed(1) + '" class="mesures-' + int + '"/>'
      + '<text x="27" y="38" class="mesures-pv">' + v + '</text><text x="38" y="37" class="mesures-pe">€</text>', "pièce de " + v + " euro" + (v > 1 ? "s" : ""));
  }
  const BILLETS = { 5: { w: 120, h: 62 }, 10: { w: 127, h: 67 }, 20: { w: 133, h: 72 } };
  function billet(v) {
    const { w, h: hh } = BILLETS[v];
    let motif = "";
    for (let i = 0; i < 4; i++) motif += '<path d="M' + (w * 0.42) + " " + (14 + i * 11) + " q" + (w * 0.12) + " -7 " + (w * 0.24) + " 0 t" + (w * 0.24) + ' 0" class="mesures-onde"/>';
    return svgEl("0 0 " + w + " " + hh, "mesures-billet b" + v,
      '<rect x="1.5" y="1.5" width="' + (w - 3) + '" height="' + (hh - 3) + '" rx="6" class="mesures-fond"/>'
      + '<rect x="7" y="7" width="' + (w - 14) + '" height="' + (hh - 14) + '" rx="3" class="mesures-cadre"/>' + motif
      + '<circle cx="' + (w - 24) + '" cy="' + (hh / 2) + '" r="13" class="mesures-rond"/><circle cx="' + (w - 24) + '" cy="' + (hh / 2) + '" r="7" class="mesures-rond"/>'
      + '<text x="14" y="' + (hh * 0.62) + '" class="mesures-bv">' + v + '</text><text x="' + (v > 9 ? 56 : 36) + '" y="' + (hh * 0.62) + '" class="mesures-be">€</text>'
      + '<text x="14" y="' + (hh - 11) + '" class="mesures-bj">pour jouer</text>', "billet de " + v + " euros");
  }
  const argent = v => v <= 2 ? piece(v) : billet(v);
  const valeursDispo = () => [1, 2, 5, 10, 20].filter(v => v <= LIMITES[etat.niveauMaths - 1]);
  const ACHATS = [["🧸", "l'ours"], ["⚽", "le ballon"], ["📕", "le livre"], ["🎨", "la peinture"], ["🧩", "le puzzle"], ["🎲", "le jeu de dés"], ["🍦", "la glace"], ["🚂", "le petit train"], ["🎺", "la trompette"], ["🖍️", "la boîte de craies"]];
  // Une somme faite de pièces et de billets (au moins deux), pas plus de max.
  function somme(max) {
    const dispo = valeursDispo();
    let out, t;
    do {
      out = []; t = 0;
      const n = entier(2, 4);
      for (let i = 0; i < n; i++) { const ok = dispo.filter(v => t + v <= max); if (!ok.length) break; const v = hasard(ok); out.push(v); t += v; }

    return out.sort((a, b) => b - a);
  }
  const sMonnaie = serie({ id: "mesures-monnaie", titre: "La monnaie", icone: "c-piece", domaine: "mesures", n: 6,
    conseil: tys(["Payer juste : elle touche les pièces et les billets pour les poser sur le comptoir ; on en retire en les touchant à nouveau.",
      "On compte d'abord les billets, puis les pièces : 10, 15, 17, 18. Un billet de 5, c'est comme cinq pièces de 1.",
      "Les pièces et les billets imprimés servent à jouer à la marchande : avec de vrais prix, sur la table."]),
    question(k) {
      const max = LIMITES[etat.niveauMaths - 1];
      if (k % 2 === 0) {
        const [e, nom] = hasard(ACHATS), prix = entier(Math.min(3, max), max);
        let donne = [], comptoir, payer;
        return {
          cle: "monnaie-payer:" + max, dire: Maj(nom) + " coûte " + prix + " euros. Paye juste.",
          verifier: v => v === prix,
          rendre(feuille, repondre) {
            comptoir = h("div", { class: "mesures-comptoir", "aria-live": "polite" });

            ajoute(feuille, h("div", { class: "mesures-achat" }, h("span", { class: "mesures-objet" }, e), h("span", { class: "mesures-prix" }, prix + " €")),
              h("p", { class: "consigne" }, ty("Paye juste : touche les pièces et les billets.")),
              h("div", { class: "mesures-caisse" }, valeursDispo().map(v => h("button", { class: "mesures-sou", "aria-label": "Donner " + v + " euros", onclick: () => { if (donne.length < 12) { donne.push(v); donne.sort((a, b) => b - a); dessiner(); } } }, argent(v)))),
              h("div", { class: "mesures-lbl" }, ty("Sur le comptoir :")), comptoir, payer, lienPapier("monnaie"));
            dessiner();

          apres(juste) { if (!juste) Voix.dire(Maj(nom) + " coûte " + prix + " euros."); else Voix.dire("Merci ! " + prix + " euros, c'est juste."); }
        };
      }
      const s = somme(max), t = s.reduce((a, b) => a + b, 0);
      return {
        reponse: t, cle: "monnaie-compter:" + max, dire: "Combien d'argent y a-t-il ?",
        rendre(feuille, repondre) {
          ajoute(feuille, h("p", { class: "consigne" }, ty("Combien d'argent ?")),
            h("div", { class: "mesures-comptoir" }, s.map(argent)), h("div", { class: "mesures-pave" }, pave(0, max, repondre)), lienPapier("monnaie"));
        },
        apres() { Voix.dire(s.join(" et ") + " : " + t + " euros."); }
      };
    }
  });

  // ----- les longueurs : comparer des crayons, mesurer un trait en centimètres -----
  const CM = 40, X0 = 30;     // la règle dessinée : 1 cm = 40 unités, le zéro à x = 30
  function regle(debut, fin) {
    const LONG = fin <= 10 ? 10 : 15;      // une règle de 10 cm quand elle suffit : plus grande à l'écran
    let s = '<rect x="' + (X0 - 16) + '" y="78" width="' + (LONG * CM + 62) + '" height="66" rx="5" class="mesures-regle"/>';
    for (let i = 0; i <= LONG * 2; i++) {
      const x = X0 + i * CM / 2, cm = i % 2 === 0;
      s += '<line x1="' + x + '" y1="78" x2="' + x + '" y2="' + (cm ? 102 : 92) + '" class="mesures-grad"/>';
      if (cm) s += '<text x="' + x + '" y="128" class="mesures-num">' + (i / 2) + "</text>";
    }
    const xa = X0 + debut * CM, xb = X0 + fin * CM;
    s += '<line x1="' + xa + '" y1="44" x2="' + xa + '" y2="78" class="mesures-guide"/><line x1="' + xb + '" y1="44" x2="' + xb + '" y2="78" class="mesures-guide"/>'
      + '<line x1="' + xa + '" y1="44" x2="' + xb + '" y2="44" class="mesures-trait"/>'
      + '<line x1="' + xa + '" y1="32" x2="' + xa + '" y2="56" class="mesures-bout"/><line x1="' + xb + '" y1="32" x2="' + xb + '" y2="56" class="mesures-bout"/>'
      + '<text x="' + (X0 + LONG * CM + 20) + '" y="128" class="mesures-unite">cm</text>';
    return svgEl("0 0 " + (X0 + LONG * CM + 60) + " 152", "mesures-svg-regle", s, "Un trait au-dessus d'une règle graduée en centimètres");
  }
  const COULEURS_CRAYON = ["var(--syl1)", "var(--syl2)", "var(--ok)", "var(--encore)"];
  function crayon(long, decal, couleur) {
    const x = decal, y = 8, H = 24, pointe = 34;
    return svgEl("0 0 400 40", "mesures-crayon",
      '<rect x="' + x + '" y="' + y + '" width="14" height="' + H + '" rx="4" class="mesures-gomme"/>'
      + '<rect x="' + (x + 12) + '" y="' + y + '" width="' + (long - pointe - 12) + '" height="' + H + '" style="fill:' + couleur + '" class="mesures-bois"/>'
      + '<path d="M' + (x + long - pointe) + " " + y + "l" + pointe + " " + (H / 2) + "l-" + pointe + " " + (H / 2) + 'z" class="mesures-taille"/>'
      + '<path d="M' + (x + long - 11) + " " + (y + H / 2 - 4) + "l11 4-11 4z" + '" class="mesures-mine"/>');
  }
  const sLongueurs = serie({ id: "mesures-longueurs", titre: "Les longueurs", icone: "c-regle", domaine: "mesures", n: 6,
    conseil: tys(["Pour comparer deux longueurs, on regarde les deux bouts : les crayons ne commencent pas tous au même endroit.",
      "Pour mesurer, le bout du trait est sur le 0 de la règle ; on lit le nombre en face de l'autre bout. Le 0 n'est pas le bord de la règle.",
      "Avec la règle en carton imprimée, elle mesure de vrais traits au crayon : c'est là que la mesure s'apprend."]),
    question(k) {
      if (k % 2 === 0) {
        const plusLong = Math.random() < 0.6;
        let longs;
        do longs = [entier(120, 330), entier(120, 330), entier(120, 330)]; while (Math.min(Math.abs(longs[0] - longs[1]), Math.abs(longs[1] - longs[2]), Math.abs(longs[0] - longs[2])) < 40);
        const cible = longs.indexOf(plusLong ? Math.max(...longs) : Math.min(...longs));
        const cols = tirer(COULEURS_CRAYON, 3);
        const q = plusLong ? "Touche le crayon le plus long." : "Touche le crayon le plus court.";

          reponse: cible, cle: plusLong ? "longueur-plus-long" : "longueur-plus-court", dire: q,
          rendre(feuille, repondre) {
            ajoute(feuille, h("p", { class: "consigne" }, q),

                crayon(L, entier(4, 400 - L - 4), cols[i])))), lienPapier("regle"));
          },
          apres() { Voix.dire(plusLong ? "Voilà le plus long." : "Voilà le plus court."); }
        };
      }
      const decale = etat.niveauMaths === 3 && k >= 3 && Math.random() < 0.5;
      const haut = etat.niveauMaths === 3 ? 15 : 10;
      const debut = decale ? entier(1, 4) : 0, L = entier(2, haut - debut - (decale ? 1 : 0)), fin = debut + L;

        reponse: L, cle: decale ? "mesurer-decale" : "mesurer-zero", dire: "Combien de centimètres mesure le trait ?",
        rendre(feuille, repondre) {
          ajoute(feuille, h("p", { class: "consigne" }, ty("Combien mesure le trait ?")), regle(debut, fin), h("div", { class: "mesures-pave" }, pave(1, haut, repondre)),
            h("p", { class: "mesures-unite-txt" }, "en centimètres"), lienPapier("regle"));
        },
        apres() { Voix.dire(decale ? "De " + debut + " à " + fin + " : le trait mesure " + L + " centimètres." : "Le trait mesure " + L + " centimètres."); },
        aide() { Voix.dire(decale ? "Le trait ne commence pas au zéro : compte les centimètres de " + debut + " à " + fin + "." : "Regarde le nombre en face du bout du trait."); }
      };
    }
  });

  // ----- le temps : les jours, les mois, le calendrier -----
  const JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const Maj = s => s.charAt(0).toUpperCase() + s.slice(1);
  const ouListe = l => l.slice(0, -1).join(", ") + " ou " + l[l.length - 1];
  function choixMots(bonne, liste, n) {
    const autres = tirer(liste.filter(x => x !== bonne), n - 1);

  }
  const boutonsMots = (mots, repondre) => h("div", { class: "mesures-mots" }, mots.map(m => h("button", { class: "mesures-mot", onclick: e => repondre(m, e.currentTarget) }, m)));
  function calendrier(opts) {

        Array.from({ length: nbj }, (_, i) => { const d = i + 1; const c = h(opts.toucher ? "button" : "span", { class: "mesures-cal-d" + (d === opts.marque ? " marque" : ""), onclick: opts.toucher ? e => opts.toucher(d, e.currentTarget) : null }, d); cases[d] = c; return c; })));
    el.jourDe = d => JOURS[(debut + d - 1) % 7];
    el.nbj = nbj; el.cases = cases;
    return el;
  }
  const infoMois = () => { const a = new Date(); const debut = (new Date(a.getFullYear(), a.getMonth(), 1).getDay() + 6) % 7; return { debut, nbj: new Date(a.getFullYear(), a.getMonth() + 1, 0).getDate() }; };
  const sTemps = serie({ id: "mesures-temps", titre: "Les jours et les mois", icone: "c-calendrier", domaine: "mesures", n: 8,
    conseil: tys(["La voix lit la question et les réponses possibles ; vous pouvez relire les mots avec elle.",
      "Les jours reviennent toujours dans le même ordre, comme une ronde : après dimanche, c'est de nouveau lundi.",
      "Le calendrier se lit comme un tableau : la colonne dit le jour de la semaine, la case dit la date."]),
    question(k) {
      const genre = ["apres", "hierdemain", "train", "calendrier", "mois", "calendrier", "apres", "train"][k % 8];
      if (genre === "apres") {
        const i = entier(0, 6), avant = Math.random() < 0.4, bonne = JOURS[(i + (avant ? 6 : 1)) % 7];
        const mots = choixMots(bonne, JOURS.filter(j => j !== JOURS[i]), 3);
        const q = "Quel jour vient " + (avant ? "avant " : "après ") + JOURS[i] + " ?";
        return { reponse: bonne, cle: "temps-jours", dire: q + " " + ouListe(mots) + " ?",
          rendre(feuille, repondre) { ajoute(feuille, h("p", { class: "consigne" }, ty(q)), h("div", { class: "mesures-jour-grand" }, JOURS[i]), boutonsMots(mots, repondre)); },
          apres() { Voix.dire(avant ? bonne + ", puis " + JOURS[i] + "." : JOURS[i] + ", puis " + bonne + "."); } };
      }
      if (genre === "hierdemain") {
        const i = entier(0, 6), demain = Math.random() < 0.5, bonne = JOURS[(i + (demain ? 1 : 6)) % 7];

        const q = "Aujourd'hui, c'est " + JOURS[i] + ". " + (demain ? "Demain, ce sera quel jour ?" : "Hier, c'était quel jour ?");
        return { reponse: bonne, cle: demain ? "temps-demain" : "temps-hier", dire: q + " " + ouListe(mots) + " ?",
          rendre(feuille, repondre) { ajoute(feuille, h("p", { class: "consigne" }, ty(q)), boutonsMots(mots, repondre)); },
          apres() { Voix.dire((demain ? "Demain, ce sera " : "Hier, c'était ") + bonne + "."); } };
      }
      if (genre === "train") {
        const i = entier(0, 6), trou = entier(1, 3), suite = [0, 1, 2, 3].map(d => JOURS[(i + d) % 7]), bonne = suite[trou];

          rendre(feuille, repondre) {
            ajoute(feuille, h("p", { class: "consigne" }, ty("Quel jour manque ?")),
              h("div", { class: "mesures-train" }, suite.map((j, n) => h("span", { class: "mesures-wagon" + (n === trou ? " trou" : "") }, n === trou ? "?" : j))), boutonsMots(mots, repondre));
          },
          apres() { Voix.dire(suite.join(", ") + "."); } };
      }
      if (genre === "mois") {
        const i = entier(0, 11), bonne = MOIS[(i + 1) % 12], mots = choixMots(bonne, MOIS.filter(x => x !== MOIS[i]), 3);
        const q = "Quel mois vient après " + MOIS[i] + " ?";
        return { reponse: bonne, cle: "temps-mois", dire: q + " " + ouListe(mots) + " ?",
          rendre(feuille, repondre) { ajoute(feuille, h("p", { class: "consigne" }, ty(q)), h("div", { class: "mesures-jour-grand" }, MOIS[i]), boutonsMots(mots, repondre)); },
          apres() { Voix.dire(MOIS[i] + ", puis " + bonne + "."); } };
      }

        return { reponse: bonne, cle: "temps-calendrier", dire: "Le " + d + ", c'est quel jour ? " + ouListe(mots) + " ?",
          rendre(feuille, repondre) { ajoute(feuille, h("p", { class: "consigne" }, ty("Le " + d + ", c'est quel jour ?")), calendrier({ marque: d }), boutonsMots(mots, repondre)); },
          apres() { Voix.dire("Le " + d + ", c'est un " + bonne + "."); } };
      }

        apres() { Voix.dire(demain ? "Demain, ce sera le " + bonne + "." : "Voilà le " + d + "."); } };
    }
  });

  // ----- le papier -----
  const PAPIER = { monnaie: ["materiel/monnaie.pdf", "Les pièces et les billets à découper"], regle: ["geometrie/regle-et-traits.pdf", "La règle en carton et des traits à mesurer"] };
  function lienPapier(cle) { return evaluation ? null : lienImprimer(PAPIER[cle][0], ty(PAPIER[cle][1]), "btn discret mesures-papier"); }

  // ----- l'écran du module -----
  const JEUX = [
    { def: sMonnaie, court: "Je paye juste, je compte l'argent", papier: "monnaie" },
    { def: sLongueurs, court: "Le plus long, et combien de centimètres", papier: "regle" },
    { def: sTemps, court: "Hier, aujourd'hui, demain, le calendrier" }

  function finPartie(def, r) {
    ecran = "fin"; vider(); bip("fin"); if (r.etoiles) pluie("⭐");
    const j = JEUX.find(x => x.def === def);
    ajoute(racine, barre(def.titre),
      h("section", { class: "feuille" }, h("p", { class: "bravo" }, ty(r.etoiles >= r.n - 1 ? "Bravo !" : "Bien joué !")),
        h("div", { class: "image" }, "⭐".repeat(r.etoiles) || "🙂"),
        h("p", { class: "consigne", style: "align-self:center" }, r.etoiles + " étoile" + (r.etoiles > 1 ? "s" : "") + " sur " + r.n),
        h("div", { class: "ligne", style: "justify-content:center" },
          h("button", { class: "btn plein", onclick: () => jouer(def) }, ic("encore"), "Rejouer"),
          h("button", { class: "btn", onclick: menu }, ic("suivant"), "Autre jeu")),
        j && j.papier ? lienImprimer(PAPIER[j.papier][0], ty(PAPIER[j.papier][1]), "btn discret") : null));
  }
  function jouer(def) { evaluation = false; seance = null; jouerSerie(def, { finir: r => finPartie(def, r) }); }
  function menu() {
    ecran = ID; seance = null; evaluation = false; vider();
    const adulte = h("div", { class: "adulte" });
    ajoute(racine, barre("Mesurer"),
      h("div", { class: "jeux" }, JEUX.map(j => {

  // ----- un écran de passage : avant le contrôle, avant une révision -----

  // ----- la règle de maîtrise -----
  function prochaine(n) {
    const m = donnees();

  function garderEssai(x) { const m = donnees(); m.essais.push(x); if (m.essais.length > 300) m.essais.splice(0, m.essais.length - 300); }
  // Deux contrôles de suite à 4 sur 5 au moins, deux jours différents : l'étape est gagnée.
  function enregistrer(n, phase, justes) {
    const m = donnees(), auj = aujourdhui(), ok = justes >= 4;

    const res = { ok, justes, acquise: false, compte: false, memeJour: false };

  // Une révision par semaine pendant trois semaines, pour chaque étape gagnée au fil du chemin.

  // ----- la séance : la phase en cours, puis le contrôle -----

  // ----- le chemin en SVG : douze pierres -----
  const POS = Array.from({ length: 12 }, (_, i) => { const r = Math.floor(i / 3), c = i % 3; return { x: [90, 240, 390][r % 2 ? 2 - c : c], y: 70 + 120 * r }; });

    viderZone(zone, h("p", { class: "consigne passer10-invite" }, ty(invite)),
      h("div", { class: "passer10-pave onze" }, ajout ? pave(10, 20, repondre) : pave(0, 10, repondre)));
    pas("total", c.total);
  }
  const mettreAstuce = (adulte, t) => { const a = adulte.querySelector(".astuce"); if (a) a.textContent = ty(t); };
  const finEcrite = c => [c.x, SIGNE[c.sens], c.y, "=", 10, SIGNE[c.sens], c.p2, "=", { rep: c.total }];
  const finDite = c => dit(c) + ", c'est 10" + MOT[c.sens] + c.p2 + " : " + c.total + ".";

  // ----- « je regarde » : quatre temps, une réponse à chaque pas -----
  function qRegarde(sens) {
    const c = tirerNeuf(sens), ajout = sens === "ajout", S = SIGNE[sens];
    const invite1 = ajout ? "Combien de jetons pour remplir le premier cadre ?" : "Combien faut-il en enlever pour redescendre à 10 ?";
    let ecr, sc;
    const Q = {
      reponse: c.total, cle: "p10:" + cleDe(c), fautes: 0, dire: dit(c) + ". " + invite1,
      astuce: ty(ajout ? "Elle regarde les cases vides du premier cadre : c'est ce qui manque pour aller à 10."
        : "Combien de jetons dans le deuxième cadre ? On les enlève d'abord pour retomber sur 10."),
      rendre(feuille, repondre, adulte) {
        feuille.classList.add("passer10-feuille");

        const zone = h("div", { class: "passer10-zone" });
        ajoute(feuille, ecr, sc.el, zone);
        const F = fil(feuille);
        (async () => {
          // 1. on voit, et on cherche ce qui sépare de 10
          await demander(zone, Q, { nom: "temps1", invite: invite1, min: 0, max: 9, bonne: c.p1,
            aide: () => marquer(ajout ? vides(sc.c1) : jetonsDe(sc.c2)) });
          if (!F.vivant()) return;
          demarquer(feuille);
          // 2. les jetons glissent, un par un
          const phrase = ajout ? "On en met " + c.p1 + " dans le premier cadre." : "On enlève les " + c.p1 + " du deuxième cadre.";
          viderZone(zone, h("p", { class: "passer10-recit" }, ty(phrase)));
          mettreAstuce(adulte, ajout ? "Regardez les jetons glisser ensemble, puis faites-lui dire : « Le cadre est plein, ça fait 10. »"
            : "Regardez les jetons partir ensemble, puis faites-lui dire : « Il en reste 10. »");
          pas("animation", null);
          Q.dire = phrase; Voix.dire(phrase);
          await F.pause(900);
          if (ajout) {
            const bleus = jetonsDe(sc.c2).slice(-c.p1).reverse(), cibles = vides(sc.c1);
            for (let i = 0; i < bleus.length; i++) { glisser(bleus[i], cibles[i], DEPLACE); await F.pause(DEPLACE + ENTRE); }
          } else {
            const rouges = jetonsDe(sc.c2).reverse();
            for (let i = 0; i < rouges.length; i++) { glisser(rouges[i], sc.places[i], DEPLACE); await F.pause(DEPLACE + ENTRE); }
          }
          const dix = ajout ? "Le premier cadre est plein : 10." : "Il en reste 10.";
          ajoute(zone, h("p", { class: "passer10-recit fort" }, ty(dix)));
          Q.dire = dix; Voix.dire(dix);
          await F.pause(1500);
          // 3. la maison du nombre : y, c'est p1 et combien ?
          const q3 = c.y + ", c'est " + c.p1 + " et combien ?";
          mettreAstuce(adulte, ajout ? c.y + ", c'est " + c.p1 + " (déjà dans le premier cadre) et combien ? Les jetons bleus qui restent le montrent."
            : c.y + ", c'est " + c.p1 + " (déjà enlevés) et combien ? Les places vides du bac le montrent.");
          await demander(zone, Q, { nom: "maison", invite: q3, voix: q3, min: 0, max: 9, bonne: c.p2, avant: maisonNombre(c.y, c.p1, "?"),
            aide: () => marquer(ajout ? jetonsDe(sc.c2) : sc.places.slice(c.p1)) });
          if (!F.vivant()) return;
          demarquer(feuille);
          ecrire(ecr, [c.x, S, c.y, "=", c.x, S, c.p1, S, c.p2]);
          await F.pause(1300);
          // 4. 10 + p2 : la réponse
          ecrire(ecr, [c.x, S, c.y, "=", 10, S, c.p2, "=", "?"]);
          mettreAstuce(adulte, ajout ? "10 et " + c.p2 + " : elle le sait sans compter, c'est la façon de dire les nombres de 11 à 19."
            : "10 − " + c.p2 + " : c'est un complément à 10 qu'elle connaît.");
          finale(zone, Q, c, repondre, ajout ? "10 + " + c.p2 + ", ça fait combien ?" : "10 − " + c.p2 + ", ça fait combien ?");
          Q.dire = "10" + MOT[sens] + c.p2 + " ?"; Voix.dire(Q.dire);
        })().catch(attraper);
      },
      erreur() { Q.fautes++; },
      aide() { marquer(ajout ? jetonsDe(sc.c2) : jetonsDe(sc.c1).slice(10 - c.p2)); },
      apres(juste) {
        ecrire(ecr, finEcrite(c)); demarquer(ecr.parentNode);
        if (!ajout) jetonsDe(sc.c1).slice(10 - c.p2).forEach((j, i) => glisser(j, sc.places[c.p1 + i], 700));
        Voix.dire(finDite(c));
        enregistrer(sens, "regarde", juste && !Q.fautes);
      }
    };
    return Q;
  }

  // ----- « je fais » : elle déplace les jetons, puis elle donne le total -----
  function qFais(sens) {
    const c = tirerNeuf(sens), ajout = sens === "ajout", S = SIGNE[sens];
    let ecr, sc;
    const invite = ajout ? "Touche les jetons bleus pour remplir le premier cadre." : "Touche les jetons pour en enlever " + c.y + ". D'abord ceux du deuxième cadre !";
    const Q = {
      reponse: c.total, cle: "p10:" + cleDe(c), fautes: 0,
      dire: dit(c) + ". " + (ajout ? "Remplis le premier cadre avec les jetons bleus." : "Enlève " + c.y + " jetons. D'abord ceux du deuxième cadre."),
      astuce: ty(ajout ? "Elle touche les jetons bleus un par un : ils remplissent le premier cadre. Puis elle donne le total."
        : "Elle touche les jetons à enlever, ceux du deuxième cadre d'abord. Puis elle dit combien il en reste."),
      boutons: [lienImprimer(PAPIER[sens], "Les boîtes d'œufs à imprimer", "btn discret")],
      rendre(feuille, repondre) {
        feuille.classList.add("passer10-feuille");
        ecr = egalite([c.x, S, c.y, "=", "?"]); sc = scene(c);
        const zone = h("div", { class: "passer10-zone" }, h("p", { class: "consigne passer10-invite" }, ty(invite)));
        ajoute(feuille, ecr, sc.el, zone);
        let occupe = false, enleves = 0;
        pas(ajout ? "remplir" : "enlever", ajout ? c.p1 : c.y);
        const prenables = () => (ajout ? sc.c2 : sc.c1.concat(sc.c2)).forEach(cell => {
          const ok = !!cell.querySelector(".jeton") && (ajout ? vides(sc.c1).length > 0 : enleves < c.y);

          else { cell.removeAttribute("role"); cell.removeAttribute("tabindex"); cell.removeAttribute("aria-label"); }
        });
        const fini = () => {
          ecrire(ecr, [c.x, S, c.y, "=", 10, S, c.p2, "=", "?"]);
          finale(zone, Q, c, repondre, ajout ? "Le premier cadre est plein. Combien en tout ?" : "Combien en reste-t-il ?");
          Q.dire = ajout ? "Le premier cadre est plein : 10. 10 plus " + c.p2 + " ?" : "Il en reste combien ?";
          Voix.dire(Q.dire);
        };
        const prendre = cell => {
          const j = cell.querySelector(".jeton");
          if (occupe || !j || !document.body.contains(feuille)) return;
          if (ajout) {
            const cible = vides(sc.c1)[0];
            if (!cible) return;
            occupe = true;
            const d = glisser(j, cible, 650);
            setTimeout(() => {
              const d2 = tasser(sc.c2, 320);
              setTimeout(() => { occupe = false; prenables(); if (!vides(sc.c1).length) fini(); }, d2 + 30);
            }, d + 30);
          } else {
            if (enleves >= c.y) return;
            const dans2 = sc.c2.includes(cell);
            if (!dans2 && jetonsDe(sc.c2).length) {
              Q.fautes++; bip("non");
              j.classList.remove("secoue"); void j.offsetWidth; j.classList.add("secoue");
              marquer(jetonsDe(sc.c2));
              Voix.dire("D'abord le deuxième cadre : on redescend à 10.");

            occupe = true;
            const d = glisser(j, sc.places[enleves++], 650);
            setTimeout(() => {
              demarquer(feuille);
              const d2 = tasser(dans2 ? sc.c2 : sc.c1, 320);
              setTimeout(() => {
                occupe = false; prenables();

      },
      erreur() { Q.fautes++; },
      aide() { marquer(ajout ? jetonsDe(sc.c2) : jetonsDe(sc.c1)); },
      apres(juste) { ecrire(ecr, finEcrite(c)); demarquer(ecr.parentNode); Voix.dire(finDite(c)); enregistrer(sens, "fais", juste && !Q.fautes); }

  // ----- « de tête » : seulement l'écriture -----
  function qTete(sens) {

  // ----- les séries -----
  const FAB = { regarde: qRegarde, fais: qFais, tete: qTete };

// ---------- Problèmes : comparer, les parties et le tout, deux étapes, et « invente ton problème » ----------
// La suite de « Petits problèmes » (maths.js). La voix lit l'énoncé ; le modèle en barres de la
// méthode de Singapour se dessine à la demande, ou tout seul après une erreur. Énoncés neufs,
// fabriqués à partir de quelques gabarits ; les nombres restent dans le niveau (5, 10 ou 20).
(() => {
  const ID = "problemes";
  const ty = s => String(s).replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« ");
  const tys = l => l.map(ty);
  let evaluation = false;

  ICONES["c-bulle"] = '<path d="M4 4h16v12H10l-5 4v-4H4z"/><path d="M10 8.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9v.4M12 13.5h.01"/>';
  ICONES["c-deuxbarres"] = '<rect x="3" y="5" width="11" height="5" rx="1"/><rect x="3" y="14" width="18" height="5" rx="1"/>';
  ICONES["c-tout"] = '<rect x="3" y="5" width="18" height="6" rx="1"/><path d="M11 5v6M3 15c0 2 1 3 3 3h12c2 0 3-1 3-3M12 18v3"/>';
  ICONES["c-etapes"] = '<path d="M4 18h5v-5h5V8h6"/><path d="M17 5l3 3-3 3"/>';
  ICONES["c-melange"] = '<path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4"/><path d="M19 5l2 2-2 2M19 15l2 2-2 2"/>';

  // ----- les choses que l'on compte, et comment en parler -----
  const CHOSES = [
    { s: "bille", p: "billes", g: "f", e: "🔵", lieu: "Dans la boîte", poche: true, couleur: true },
    { s: "biscuit", p: "biscuits", g: "m", e: "🍪", lieu: "Dans la boîte" },
    { s: "coquillage", p: "coquillages", g: "m", e: "🐚", lieu: "Dans le seau", poche: true, verbe: "ramasse" },
    { s: "crayon", p: "crayons", g: "m", e: "✏️", lieu: "Dans la trousse", couleur: true },
    { s: "ballon", p: "ballons", g: "m", e: "🎈", lieu: "À la fête", couleur: true },
    { s: "bonbon", p: "bonbons", g: "m", e: "🍬", lieu: "Dans le sachet", poche: true },
    { s: "pomme", p: "pommes", g: "f", e: "🍎", lieu: "Dans le panier", verbe: "cueille" },
    { s: "marron", p: "marrons", g: "m", e: "🌰", lieu: "Dans le panier", poche: true, verbe: "ramasse" },
    { s: "livre", p: "livres", g: "m", e: "📕", lieu: "Sur l'étagère" },
    { s: "fleur", p: "fleurs", g: "f", e: "🌸", lieu: "Dans le vase", verbe: "cueille", couleur: true },
    { s: "petite voiture", p: "petites voitures", g: "f", e: "🚗", lieu: "Sur le tapis", couleur: true }
  ];
  const COULEURS = [["rouge", "rouge", "rouges", "rouges"], ["bleu", "bleue", "bleus", "bleues"], ["vert", "verte", "verts", "vertes"], ["jaune", "jaune", "jaunes", "jaunes"]];
  const couleur = (c, o, n) => c[(o.g === "f" ? 1 : 0) + (n > 1 ? 2 : 0)];
  const nb = (n, o) => n + " " + (n > 1 ? o.p : o.s);
  const EMO = pr => pr === "elle" ? "👧" : "👦";
  const ils = (x, y) => x[1] === "elle" && y[1] === "elle" ? "elles" : "ils";
  const Maj = s => s.charAt(0).toUpperCase() + s.slice(1);
  const verbeN = (n, s, p) => n > 1 ? p : s;
  const max = () => LIMITES[etat.niveauMaths - 1];
  const gens = n => tirer(ENFANTS, n);
  const paveM = (a, b, rep) => h("div", { class: "problemes-pave" }, pave(a, b, rep));

  // ----- le modèle en barres : des rangées, une même échelle -----
  // rangs : [{ qui, segs: [{ n, l (étiquette), c: a|b|v|barre|fantome }], total }] ; bas : une ligne sous le modèle
  function modele(rangs, bas) {
    const echelle = Math.max(...rangs.map(r => r.segs.reduce((s, x) => s + x.n, 0)));
    return h("div", { class: "problemes-modele" }, rangs.map(r => {
      const long = r.segs.reduce((s, x) => s + x.n, 0), larg = (long / echelle * 100).toFixed(2) + "%";
      return h("div", { class: "problemes-rang" },
        h("span", { class: "problemes-qui" }, r.qui || ""),
        h("div", { class: "problemes-piste" },
          h("div", { class: "problemes-barre", style: "width:" + larg }, r.segs.map(sg => h("span", { class: "problemes-seg " + sg.c, style: "flex:" + sg.n + " 1 0" }, sg.l == null ? "" : String(sg.l)))),
          r.total != null ? h("div", { class: "problemes-acc", style: "width:" + larg }, h("span", null, String(r.total))) : null));
    }), bas ? h("p", { class: "problemes-bas" }, ty(bas)) : null);
  }
  const ou = (x, v) => v == null ? "?" : x;    // l'étiquette inconnue : « ? », ou la réponse une fois trouvée

  // ----- les gabarits : chacun rend { texte, reponse, scene, modele(v), fin, cle } -----
  const G = {
    // comparaison : le comparé est inconnu, « de plus »
    plus() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), a = entier(1, M - 1), d = entier(1, M - a), r = a + d;
      return { cle: "comparer-plus", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + ". " + B[0] + " en a " + d + " de plus que " + A[0] + ". Combien de " + o.p + " " + B[0] + " a-t-" + B[1] + " ?",
        modele: v => modele([{ qui: A[0], segs: [{ n: a, l: a, c: "a" }] }, { qui: B[0], segs: [{ n: a, l: a, c: "a" }, { n: d, l: d, c: "b" }], total: ou(v, v) }]),
        fin: B[0] + " a " + nb(r, o) + "." };
    },
    // comparaison : « de moins »
    moins() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), a = entier(2, M), d = entier(1, a - 1), r = a - d;
      return { cle: "comparer-moins", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + ". " + B[0] + " en a " + d + " de moins que " + A[0] + ". Combien de " + o.p + " " + B[0] + " a-t-" + B[1] + " ?",
        modele: v => modele([{ qui: A[0], segs: [{ n: a, l: a, c: "a" }] }, { qui: B[0], segs: [{ n: r, l: ou(v, v), c: "b" }, { n: d, l: d, c: "fantome" }] }]),
        fin: B[0] + " a " + nb(r, o) + "." };
    },
    // comparaison : l'écart est inconnu
    ecart() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), a = entier(2, M), b = entier(1, a - 1), r = a - b, deMoins = Math.random() < 0.4;
      return { cle: "comparer-ecart", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + " et " + B[0] + " en a " + b + ". " + (deMoins
          ? "Combien de " + o.p + " " + B[0] + " a-t-" + B[1] + " de moins que " + A[0] + " ?"
          : "Combien de " + o.p + " " + A[0] + " a-t-" + A[1] + " de plus que " + B[0] + " ?"),
        modele: v => modele([{ qui: A[0], segs: [{ n: b, l: null, c: "a" }, { n: r, l: ou(v, v), c: "v" }], total: a }, { qui: B[0], segs: [{ n: b, l: b, c: "a" }] }]),
        fin: deMoins ? B[0] + " en a " + r + " de moins." : A[0] + " en a " + r + " de plus." };
    },
    // comparaison : le référent est inconnu (« c'est 3 de plus que… ») ; le piège du mot « plus »
    referent() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), b = entier(2, M), d = entier(1, b - 1), r = b - d;
      return { cle: "comparer-referent", reponse: r, scene: [EMO(B[1]) + " " + B[0], EMO(A[1]) + " " + A[0], o.e],
        texte: B[0] + " a " + nb(b, o) + ". C'est " + d + " de plus que " + A[0] + ". Combien de " + o.p + " " + A[0] + " a-t-" + A[1] + " ?",
        modele: v => modele([{ qui: B[0], segs: [{ n: r, l: null, c: "a" }, { n: d, l: d, c: "b" }], total: b }, { qui: A[0], segs: [{ n: r, l: ou(v, v), c: "a" }] }]),
        fin: A[0] + " a " + nb(r, o) + " : " + d + " de moins que " + B[0] + "." };
    },
    // parties et tout : le tout est inconnu
    tout() {
      const M = max(), a = entier(1, M - 1), b = entier(1, M - a), r = a + b;
      if (Math.random() < 0.55) {
        const o = hasard(CHOSES.filter(x => x.couleur)), [c1, c2] = tirer(COULEURS, 2);
        return { cle: "tout-inconnu", reponse: r, scene: [o.e],
          texte: o.lieu + ", il y a " + nb(a, o) + " " + couleur(c1, o, a) + " et " + b + " " + couleur(c2, o, b) + ". Combien de " + o.p + " y a-t-il en tout ?",
          modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }], total: ou(v, v) }]),
          fin: "Il y a " + nb(r, o) + " en tout." };
      }
      const o = hasard(CHOSES), [A, B] = gens(2);
      return { cle: "tout-inconnu", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + ". " + B[0] + " en a " + b + ". Combien de " + o.p + " ont-" + ils(A, B) + " en tout ?",
        modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }], total: ou(v, v) }]),
        fin: Maj(ils(A, B)) + " en ont " + r + " en tout." };
    },
    // parties et tout : une partie est inconnue
    partie() {
      const M = max(), t = entier(2, M), a = entier(1, t - 1), r = t - a;
      if (Math.random() < 0.5) {
        const o = hasard(CHOSES.filter(x => x.couleur)), [c1, c2] = tirer(COULEURS, 2);
        const autres = r > 1 ? "les autres sont " + couleur(c2, o, 2) : "l'autre est " + couleur(c2, o, 1);
        return { cle: "partie-inconnue", reponse: r, scene: [o.e],
          texte: o.lieu + ", il y a " + nb(t, o) + " : " + a + " " + verbeN(a, "est", "sont") + " " + couleur(c1, o, a) + ", " + autres + ". Combien de " + o.p + " " + couleur(c2, o, 2) + " ?",
          modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: r, l: ou(v, v), c: "v" }], total: t }]),
          fin: "Il y a " + nb(r, o) + " " + couleur(c2, o, r) + "." };
      }
      const o = hasard(CHOSES.filter(x => x.poche)), [A] = gens(1);
      return { cle: "partie-inconnue", reponse: r, scene: [EMO(A[1]) + " " + A[0], "👖", o.e],
        texte: A[0] + " a " + nb(t, o) + " dans ses deux poches. Il y en a " + a + " dans la poche de droite. Combien y en a-t-il dans la poche de gauche ?",
        modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: r, l: ou(v, v), c: "v" }], total: t }], "à droite, puis à gauche"),
        fin: "Il y en a " + r + " dans la poche de gauche." };
    },
    // deux étapes : on reçoit, puis on donne
    recoitDonne() {
      const M = max(), o = hasard(CHOSES), [A, B] = gens(2), a = entier(1, M - 1), b = entier(1, M - a), c = entier(1, a + b - 1), r = a + b - c;
      return { cle: "etapes-recoit-donne", reponse: r, scene: [EMO(A[1]) + " " + A[0], o.e, EMO(B[1]) + " " + B[0]],
        texte: A[0] + " a " + nb(a, o) + ". " + Maj(A[1]) + " en reçoit " + b + ", puis " + A[1] + " en donne " + c + " à " + B[0] + ". Combien de " + o.p + " " + A[0] + " a-t-" + A[1] + " maintenant ?",
        modele: v => modele([{ qui: "avant", segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }] }, { qui: "après", segs: [{ n: r, l: ou(v, v), c: "v" }, { n: c, l: c, c: "barre" }] }], "La partie rayée, c'est ce qu'" + A[1] + " donne."),
        fin: A[0] + " a " + nb(r, o) + " maintenant." };
    },
    // deux étapes : trois parties
    troisFois() {
      const M = Math.max(3, max()), a = entier(1, M - 2), b = entier(1, M - a - 1), c = entier(1, M - a - b), r = a + b + c;
      if (Math.random() < 0.5) {
        const en = n => n + (n > 1 ? " enfants montent" : " enfant monte");
        return { cle: "etapes-trois", reponse: r, scene: ["🚌", "🧒"],
          texte: "Dans le bus, il y a " + (a > 1 ? a + " enfants" : "1 enfant") + ". Au premier arrêt, " + en(b) + ". Au deuxième arrêt, " + en(c) + ". Combien d'enfants y a-t-il dans le bus maintenant ?",
          modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }, { n: c, l: c, c: "b" }], total: ou(v, v) }]),
          fin: "Il y a " + r + " enfants dans le bus." };
      }
      const o = hasard(CHOSES.filter(x => x.verbe)), [A] = gens(1);
      return { cle: "etapes-trois", reponse: r, scene: [EMO(A[1]) + " " + A[0], o.e],
        texte: A[0] + " " + o.verbe + " " + nb(a, o) + " le matin, " + b + " à midi et " + c + " le soir. Combien de " + o.p + " " + A[0] + " a-t-" + A[1] + " en tout ?",
        modele: v => modele([{ segs: [{ n: a, l: a, c: "a" }, { n: b, l: b, c: "b" }, { n: c, l: c, c: "a" }], total: ou(v, v) }]),
        fin: A[0] + " a " + nb(r, o) + "." };
    },
    // deux étapes : on donne à deux amis
    donneDeux() {
      const M = Math.max(3, max()), t = entier(3, M), a = entier(1, t - 2), b = entier(1, t - a - 1), r = t - a - b;
      const o = hasard(CHOSES), [A, B, C] = gens(3);
      return { cle: "etapes-donne-deux", reponse: r, scene: [EMO(A[1]) + " " + A[0], o.e, EMO(B[1]) + " " + B[0], EMO(C[1]) + " " + C[0]],
        texte: A[0] + " a " + nb(t, o) + ". " + Maj(A[1]) + " en donne " + a + " à " + B[0] + " et " + b + " à " + C[0] + ". Combien lui en reste-t-il ?",
        modele: v => modele([{ segs: [{ n: a, l: a, c: "barre" }, { n: b, l: b, c: "barre" }, { n: r, l: ou(v, v), c: "v" }], total: t }], "Les parties rayées sont données."),
        fin: "Il lui en reste " + r + "." };
    },
    // deux étapes : comparer, puis réunir
    plusEnTout() {
      const M = Math.max(3, max()), a = entier(1, Math.floor((M - 1) / 2)), d = entier(1, M - 2 * a), r = 2 * a + d;
      const o = hasard(CHOSES), [A, B] = gens(2);
      return { cle: "etapes-comparer-reunir", reponse: r, scene: [EMO(A[1]) + " " + A[0], EMO(B[1]) + " " + B[0], o.e],
        texte: A[0] + " a " + nb(a, o) + ". " + B[0] + " en a " + d + " de plus que " + A[0] + ". Combien de " + o.p + " ont-" + ils(A, B) + " en tout ?",
        modele: v => modele([{ qui: A[0], segs: [{ n: a, l: a, c: "a" }] }, { qui: B[0], segs: [{ n: a, l: a, c: "a" }, { n: d, l: d, c: "b" }] }], "En tout : " + ou(v, v)),
        fin: Maj(ils(A, B)) + " en ont " + r + " en tout." };
    },
    // deux étapes : le bus, des gens descendent et d'autres montent
    bus() {
      const M = Math.max(3, max()), a = entier(2, M), b = entier(1, a - 1), c = entier(1, Math.min(M - (a - b), Math.max(a, 3))), r = a - b + c;
      const vb = (n, s, p) => n + " " + (n > 1 ? p : s);
      return { cle: "etapes-bus", reponse: r, scene: ["🚌", "🧑", "👵"],
        texte: "Dans le bus, il y a " + a + " personnes. À l'arrêt, " + vb(b, "descend", "descendent") + " et " + vb(c, "monte", "montent") + ". Combien de personnes y a-t-il dans le bus maintenant ?",
        modele: v => modele([{ qui: "avant", segs: [{ n: a - b, l: null, c: "a" }, { n: b, l: b, c: "barre" }], total: a }, { qui: "après", segs: [{ n: a - b, l: null, c: "a" }, { n: c, l: c, c: "b" }], total: ou(v, v) }]),
        fin: "Il y a " + r + " personnes dans le bus." };
    }
  };

  // ----- une question du moteur, à partir d'un gabarit -----
  function question(gabarit) {
    const p = gabarit();
    let zone, bouton;
    const montrer = v => { zone.replaceChildren(p.modele(v)); zone.hidden = false; if (bouton) bouton.hidden = true; };
    return {
      reponse: p.reponse, cle: p.cle + ":" + max(), dire: p.texte,
      rendre(feuille, repondre) {
        zone = h("div", { class: "problemes-zone", hidden: true });
        bouton = evaluation ? null : h("button", { class: "btn discret", onclick: () => montrer(null) }, ic("barres"), "Dessiner le modèle");
        const rep = (v, b) => { const bon = v === p.reponse; repondre(v, b); if (!bon && !evaluation) montrer(null); };
        ajoute(feuille, h("div", { class: "problemes-scene", "aria-hidden": "true" }, p.scene.map(x => h("span", null, x))),
          h("p", { class: "enonce" }, ty(p.texte)), bouton, zone, paveM(0, max(), rep));
      },
      apres() { montrer(p.reponse); Voix.dire(p.fin); },
      aide() { Voix.dire("Regarde le modèle. Où est le point d'interrogation ?"); }
    };
  }
  const CONSEIL = tys(["La voix lit l'histoire. Faites-la redire avec ses mots : qui, combien, ce qui se passe, ce qu'on cherche.",
    "« De plus » ne veut pas toujours dire qu'on ajoute : dans « 9 billes, c'est 3 de plus que Léo », Léo en a moins. Le modèle en barres le montre : deux barres, la plus longue au-dessus.",
    "Le modèle en barres : chaque morceau est une quantité, l'accolade dit le tout, le point d'interrogation dit ce qu'on cherche. Le dessiner sur une feuille, c'est déjà résoudre.",
    "Au début, on joue l'histoire avec de vrais objets ; le dessin vient ensuite, le calcul à la fin."]);
  const fabrique = (id, titre, icone, gabarits) => serie({ id: "problemes-" + id, titre, icone, domaine: "problemes", n: 6, conseil: CONSEIL,
    question: () => question(hasard(gabarits.filter(g => g !== G.referent || etat.niveauMaths > 1))) });
  const sComparer = fabrique("comparer", "Plus que, moins que", "c-deuxbarres", [G.plus, G.moins, G.ecart, G.plus, G.moins, G.referent]);
  const sParties = fabrique("parties", "Les parties et le tout", "c-tout", [G.tout, G.partie]);
  const sEtapes = fabrique("etapes", "En deux étapes", "c-etapes", [G.recoitDonne, G.troisFois, G.donneDeux, G.plusEnTout, G.bus]);
  const sMelange = fabrique("melange", "Tous les problèmes", "c-melange", Object.values(G));

  // ----- « invente ton problème » : trois images, elle raconte, l'adulte valide -----
  function scenario() {
    const M = Math.min(max(), 8), o = hasard(CHOSES), [A, B] = gens(2);
    const genre = hasard(["ajout", "retrait", "comparaison", "reunion"]);
    const a = entier(2, Math.max(2, M - 1)), b = genre === "retrait" ? entier(1, a - 1) : entier(1, Math.max(1, M - a));
    const tas = (n, cls) => h("span", { class: "problemes-tas " + (cls || "") }, Array(n).fill(o.e).join(""));
    const perso = p => h("span", { class: "problemes-perso" }, EMO(p[1]), h("small", null, p[0]));
    const v = [];
    if (genre === "ajout") v.push([perso(A), tas(a)], [h("b", { class: "problemes-signe" }, "+"), tas(b, "arrive")], [perso(A), h("b", { class: "problemes-q" }, "?")]);
    if (genre === "retrait") v.push([perso(A), tas(a)], [perso(A), tas(a - b), tas(b, "part"), h("span", { class: "problemes-fl" }, "➜")], [perso(A), h("b", { class: "problemes-q" }, "?")]);
    if (genre === "comparaison") v.push([perso(A), tas(a)], [perso(B), tas(b)], [perso(A), h("b", { class: "problemes-q" }, "?"), perso(B)]);
    if (genre === "reunion") v.push([perso(A), tas(a)], [perso(B), tas(b)], [h("span", { class: "problemes-perso" }, EMO(A[1]) + EMO(B[1])), h("b", { class: "problemes-q" }, "?")]);
    return { genre, vignettes: v };
  }
  const AIDE_INVENTER = {
    ajout: "Une histoire où il en arrive : « … en a 4, on lui en donne 2. Combien en a-t-il maintenant ? »",
    retrait: "Une histoire où il en part : « … en a 6, il en perd 2. Combien lui en reste-t-il ? »",
    comparaison: "Une histoire où l'on compare : « Qui en a le plus ? Combien de plus ? »",
    reunion: "Une histoire où l'on met ensemble : « Combien en ont-ils tous les deux ? »"
  };
  function inventer() {
    let tour = 0, reussis = 0;
    const N = 4;
    function suivant() {
      if (tour >= N) return finir();

// ---------- La tour des syllabes : la suite de « Je fusionne » ----------
// Trois sortes de syllabes plus longues, avec les sons vus : deux consonnes collées avec r ou l
// (bra, fli), la syllabe fermée (mor, sil), le son à deux lettres (chou, moi, lon). On les colle
// comme dans « Je fusionne », on lit une tour de bas en haut, puis des mots qui en contiennent.
(() => {
  const GROUPES = { b: ["r", "l"], k: ["r", "l"], d: ["r"], f: ["r", "l"], g: ["r", "l"], p: ["r", "l"], t: ["r"], v: ["r"] };
  const ECRIT = { k: "c" };                      // le son k s'écrit c dans la tour
  const SIMPLES = ["a", "i", "o", "u", "é", "e", "è"];
  const DOUBLES = ["ou", "on", "an", "oi", "in", "eu", "au", "ai"];
  const DURES_T = ["a", "o", "u", "ou", "on", "an", "oi", "au"];
  const CONSONNES = ["l", "r", "m", "s", "f", "ch", "n", "p", "t", "v", "d", "j", "b", "k", "g", "z"];
  const INTERDITES = ["cul"];
  const lettre = s => ECRIT[s] || s;
  const vu = s => etat.sons.includes(s);

  // Toutes les syllabes possibles avec les sons vus, par famille.
  function toutes() {
    const out = [], cs = CONSONNES.filter(vu), poids = (...x) => x.some(s => s === etat.focus) ? 3 : 1;
    Object.keys(GROUPES).filter(vu).forEach(c => GROUPES[c].filter(vu).forEach(L => SIMPLES.filter(vu).forEach(v =>
      out.push({ famille: "groupe", tuiles: [lettre(c), L, v], cons: [true, true, false], tenu: TENUS.has(lettre(c)), w: poids(c, L, v) }))));
    cs.forEach(c => ["a", "i", "o", "u", "è"].filter(vu).forEach(v => ["r", "l"].filter(vu).forEach(F => {
      if (F === c || ((c === "k" || c === "g") && !DURES_T.includes(v))) return;
      const ve = v === "è" ? "e" : v;            // le e de « mer », « sel » : è vu en classe
      out.push({ famille: "fermee", tuiles: [lettre(c), ve, F], cons: [true, false, true], tenu: TENUS.has(lettre(c)), w: poids(c, v, F) });
    })));
    cs.forEach(c => DOUBLES.filter(vu).forEach(v => {
      if ((c === "k" || c === "g") && !DURES_T.includes(v)) return;
      out.push({ famille: "double", tuiles: [lettre(c), SON[v].g[0]], cons: [true, false], tenu: TENUS.has(lettre(c)), w: poids(c, v) });
    }));
    if (vu("ch")) SIMPLES.filter(vu).forEach(v => out.push({ famille: "double", tuiles: ["ch", v], cons: [true, false], tenu: true, w: poids("ch", v) }));
    out.forEach(s => (s.texte = s.tuiles.join("")));
    return out.filter(s => !INTERDITES.includes(s.texte));
  }
  // Un tirage qui mêle les familles, la plus neuve (les groupes) un peu plus souvent.
  function tirerSyllabes(n) {
    const t = toutes(), fam = [...new Set(t.map(s => s.famille))];
    if (!t.length) return [];
    const pf = { groupe: 1.5, fermee: 1.2, double: 0.8 };
    return tirer(t, n, s => s.w * pf[s.famille] / t.filter(x => x.famille === s.famille).length * fam.length);
  }

  // ----- coller les lettres, en une ou deux fois -----
  function rendreColle(it, { feuille, adulte, suivant }) {
    const chev = (t, i) => h("div", { class: "chev" + (i ? " v2" : "") + (it.cons[i] ? " cons" : "") }, h("span", { class: "lecture" }, t));
    const trois = it.tuiles.length === 3;
    const dedans = trois ? h("div", { class: "chevrons" }, chev(it.tuiles[0], 0), chev(it.tuiles[1], 1)) : null;
    const tout = h("div", { class: "chevrons" }, trois ? [dedans, chev(it.tuiles[2], 2)] : [chev(it.tuiles[0], 0), chev(it.tuiles[1], 1)]);
    const res = h("div", { class: "resultat vide lecture" }, "?");
    const coller = h("button", { class: "btn plein", onclick: faire }, ic("fusion"), "On colle !");
    ajoute(feuille, h("p", { class: "consigne" }, "Colle les lettres pour lire la syllabe."),
      h("div", { class: "fusion" + (trois ? " tour-trois" : "") }, tout, h("span", { class: "fleche" }, ic("suivant")), res), coller);
    const [a, b, c] = it.tuiles, ab = a + b;
    const aides = {
      groupe: [it.tenu ? "Faites tenir « " + a + a + a + " » et glisser vers « " + b + " » : on entend « " + ab + " »."
        : "« " + a + " » est bref : il se colle tout de suite à « " + b + " », sans « e » entre les deux : « " + ab + " ».",
        "« " + ab + " », puis on glisse vers « " + c + " » : « " + it.texte + " »."],
      fermee: ["D'abord la syllabe connue : « " + ab + " ».", "« " + ab + " », puis on ferme avec « " + c + " », sans rien ajouter : « " + it.texte + " »."],
      double: [(b.length > 1 ? "« " + b + " » : deux lettres, un seul son. " : "« " + a + " » : deux lettres, un seul son. ")
        + (it.tenu ? "On tient « " + a + " » et on glisse vers « " + b + " » : « " + it.texte + " »." : "« " + a + " » est bref, collé à « " + b + " » : « " + it.texte + " ».")]
    }[it.famille];
    let pas = 0, rate = false;
    const depart = () => bandeAdulte(adulte, [astuce(aides[0])]);
    function faire() {
      if (trois && pas === 0) {
        pas = 1; dedans.classList.add("colle");
        setTimeout(() => { res.textContent = ab; res.classList.remove("vide"); res.classList.add("apparait"); }, 450);
        bandeAdulte(adulte, [astuce(aides[1])]);
        return;
      }
      tout.classList.add("colle"); coller.hidden = true;
      setTimeout(() => { res.textContent = it.texte; res.classList.remove("vide", "apparait"); void res.offsetWidth; res.classList.add("apparait"); }, 480);
      bandeAdulte(adulte, [astuce("Elle lit la syllabe à voix haute : « " + it.texte + " »."),
        bEncore(() => { rate = true; pas = 0; tout.classList.remove("colle"); if (dedans) dedans.classList.remove("colle"); res.textContent = "?"; res.classList.add("vide"); res.classList.remove("apparait"); coller.hidden = false; depart(); }, "On recommence"),
        bOk(e => { if (e.currentTarget.disabled) return; e.currentTarget.disabled = true; noter("decodage", it.texte, !rate); bip("ok"); etoile(feuille); setTimeout(suivant, 600); })]);
    }
    depart();
  }

  // ----- la tour : on lit de bas en haut, l'adulte valide chaque étage -----
  function rendreTour(syls, { feuille, adulte, suivant }) {
    const briques = syls.map((s, i) => h("div", { class: "tour-brique lecture" + (i % 2 ? " decale" : "") }, s.texte));
    const drapeau = h("div", { class: "tour-drapeau", "aria-hidden": "true" }, "🚩");
    ajoute(feuille, h("p", { class: "consigne" }, "Lis la tour, de bas en haut."), h("div", { class: "tour-tour" }, briques, drapeau));
    let i = 0, dur = false, lues = 0;
    function etage() {
      briques.forEach((b, k) => b.classList.toggle("ici", k === i));
      bandeAdulte(adulte, [astuce("Elle lit l'étage qui brille, puis vous validez. Un étage qui accroche : « On relit »."),
        bEncore(() => { dur = true; briques[i].classList.add("dure"); }, "On relit"),
        bOk(() => {
          noter("decodage", syls[i].texte, !dur); if (!dur) lues++;
          briques[i].classList.remove("ici"); briques[i].classList.add("lue"); bip("ok");
          i++; dur = false;
          if (i < briques.length) return etage();
          drapeau.classList.add("plante"); etoile(feuille);
          bandeAdulte(adulte, [astuce(lues === briques.length ? "Toute la tour du premier coup ! Elle peut la relire d'en haut, pour le plaisir." : "La tour est lue. Les étages orange sont à relire une fois encore."), bSuivant(suivant)]);
        }, "Bien lu !")]);
    }
    etage();
  }

  // ----- des mots qui contiennent ces syllabes -----
  const VOY = "aeiouyéèêâîôûœ";
  function sorteSyllabe(lettres) {
    const t = lettres.toLowerCase();
    if (/[bcdfgptv][rl]/.test(t) && !/^[rl]/.test(t)) return "groupe";
    if (new RegExp("[^" + VOY + "][" + VOY + "]+[rl]$").test(t)) return "fermee";
    return null;
  }
  const sortes = m => m.syl.map(s => sorteSyllabe(s.filter(l => !l.m).map(l => l.c).join("")));
  function motsTour(n) {
    const l = motsLisibles(etat).filter(m => sortes(m).some(Boolean) && m.forme.length > 2);
    return tirer(l, n, m => poidsMot(etat)(m) * (sortes(m).includes("groupe") ? 2 : 1) * (m.syl.length > 1 ? 1.5 : 1));
  }
  function rendreMotTour(m, { feuille, adulte, suivant }) {
    const el = rendreMot(m, m.forme), s = sortes(m);
    el.querySelectorAll(".syl").forEach((x, k) => { if (s[k]) x.classList.add("tour-cible"); });
    const lec = h("div", { class: "lecture grand" }, el);
    const img = h("div", { class: "image", hidden: true }, m.e || "⭐");
    let aide = false;
    ajoute(feuille, h("p", { class: "consigne" }, "Lis le mot."), lec, img);
    bandeAdulte(adulte, [astuce("La syllabe surlignée est celle de la tour. Elle lit le mot entier, vous validez."),
      bEncore(() => { aide = true; lec.classList.add("decoupe"); }),
      bOk(() => {
        noter("decodage", m.forme, !aide); etat.lus[m.forme] = (etat.lus[m.forme] || 0) + 1; sauver(); bip("ok");
        img.hidden = false; img.classList.add("apparait"); Voix.dire(m.forme);
        bandeAdulte(adulte, [astuce(m.e ? "L'image vient après la lecture : est-ce bien le mot lu ?" : "Bravo !"), bSuivant(suivant)]);
      })]);
  }

  // ----- l'enchaînement d'une partie -----
  const CONSEIL = ["Comme dans « Je fusionne » : le doigt suit la flèche, on colle les sons sans les séparer.",
    "Deux consonnes collées : « b » et « r » font « br », sans « e » entre elles ; puis la voyelle : « bra ».",
    "Syllabe fermée : on lit d'abord ce qu'on connaît, « mo », puis on ferme avec « r » : « mor », sans ajouter de « e ».",
    "La tour se lit de bas en haut, un étage après l'autre ; les mots viennent ensuite, la syllabe de la tour surlignée."];
  function partie(titre, items, finir) {
    ecran = "tour";
    if (!items.length) {
      vider();
      ajoute(racine, barre(titre, pastillesSeance()), h("section", { class: "feuille" },
        h("p", { class: "consigne" }, "Pas encore de syllabe de la tour avec les sons vus en classe : il faut r ou l, et une autre consonne."),
        h("button", { class: "btn plein", onclick: () => finir ? finir() : menu() }, finir ? "Étape suivante" : "Retour", ic("suivant"))));
      return;
    }
    let i = 0;
    const suivant = () => { i++; if (i < items.length) montrer(); else if (finir) finir(); else fin(titre, items); };
    function montrer() {
      vider();
      const feuille = h("section", { class: "feuille" }), adulte = h("div", { class: "adulte" });
      ajoute(racine, barre(titre, h("div", { class: "ligne" }, pastillesSeance(), h("span", { class: "compte" }, (i + 1) + " / " + items.length))),
        feuille, adulte, conseil({ conseil: CONSEIL }));

    const rec = etat.series.tour || (etat.series.tour = { parties: 0, meilleur: 0 });

    ajoute(racine, barre(titre), h("section", { class: "feuille" }, h("p", { class: "bravo" }, "Bravo !"), h("div", { class: "image" }, "🏰"),
      h("div", { class: "ligne", style: "justify-content:center" },
        h("button", { class: "btn plein", onclick: () => partie(titre, refaire(items)) }, ic("encore"), "Encore"),
        h("button", { class: "btn", onclick: menu }, ic("tour-tour"), "Un autre jeu"),
        h("button", { class: "btn discret", onclick: accueil }, ic("maison"), "Accueil"))));
  }
  // Une nouvelle partie de la même forme : mêmes types d'étapes, nouveaux tirages.
  function refaire(items) {
    const nc = items.filter(x => !x.tour && !x.mot).length, nm = items.filter(x => x.mot).length, t = items.find(x => x.tour);
    return composer(nc, t ? t.tour.length : 0, nm);
