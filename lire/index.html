  // ----- 3. La ligne graduée : où va ce nombre ? -----
  // Une ligne de a à b ; graduations à chaque unité (jusqu'à 20) ou à chaque dizaine (jusqu'à 100).
  const LIGNE = { W: 640, H: 170, x0: 36, x1: 604, Y: 100 };
  function ligneGraduee(a, b, onPose) {
    const { W, H, x0, x1, Y } = LIGNE, L = x1 - x0;
    const X = v => +(x0 + (v - a) / (b - a) * L).toFixed(2);
    const pas = b - a <= 20 ? 1 : 10;
    const fort = v => v === a || v === b || (b - a <= 20 ? v % 5 === 0 : v % 50 === 0);
    const reperes = b - a === 10 ? [a, b] : b - a === 20 ? [0, 10, 20] : [0, 50, 100];
    const aides = b - a === 10 ? [1, 2, 3, 4, 5, 6, 7, 8, 9] : b - a === 20 ? [5, 15] : [10, 20, 30, 40, 60, 70, 80, 90];
    let s = '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent"/>'
      + '<line x1="' + (x0 - 18) + '" y1="' + Y + '" x2="' + (x1 + 18) + '" y2="' + Y + '" class="cent-axe"/>';
    for (let v = a; v <= b; v += pas) s += '<line x1="' + X(v) + '" y1="' + (Y - (fort(v) ? 16 : 10)) + '" x2="' + X(v) + '" y2="' + (Y + (fort(v) ? 16 : 10)) + '" class="cent-grad" data-v="' + v + '"/>';
    reperes.forEach(v => { s += '<text x="' + X(v) + '" y="' + (Y + 46) + '" class="cent-lab">' + v + "</text>"; });
    aides.forEach(v => { s += '<text x="' + X(v) + '" y="' + (Y + 46) + '" class="cent-lab cent-lab-aide" visibility="hidden">' + v + "</text>"; });
    const curseur = '<g class="cent-curseur" visibility="hidden"><line x1="0" y1="' + (Y - 30) + '" x2="0" y2="' + (Y + 6) + '"/><path d="M-13 ' + (Y - 52) + 'h26l-13 20z"/></g>';
    const sol = '<g class="cent-sol" visibility="hidden"><line x1="0" y1="' + (Y - 30) + '" x2="0" y2="' + (Y + 6) + '"/><path d="M-13 ' + (Y - 52) + 'h26l-13 20z"/><text x="0" y="' + (Y - 60) + '" class="cent-lab"></text></g>';
    const svg = svgEl("0 0 " + W + " " + H, "cent-ligne", s + sol + curseur, "Une ligne graduée de " + a + " à " + b);
    const gC = svg.querySelector(".cent-curseur"), gS = svg.querySelector(".cent-sol");
    let valeur = null, appui = false, figee = false;
    const placer = v => { valeur = v; gC.setAttribute("transform", "translate(" + X(v) + " 0)"); gC.setAttribute("visibility", "visible"); onPose(v); };
    const versValeur = e => {
      const m = svg.getScreenCTM();
      if (!m) return null;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(m.inverse());
      return Math.max(a, Math.min(b, Math.round(a + (p.x - x0) / L * (b - a))));
    };
    svg.addEventListener("pointerdown", e => { if (figee) return; appui = true; try { svg.setPointerCapture(e.pointerId); } catch (x) {} const v = versValeur(e); if (v != null) placer(v); e.preventDefault(); });
    svg.addEventListener("pointermove", e => { if (!appui || figee) return; const v = versValeur(e); if (v != null && v !== valeur) placer(v); });
    ["pointerup", "pointercancel"].forEach(t => svg.addEventListener(t, () => { appui = false; }));
    return {
      svg, X, valeur: () => valeur,
      figer() { figee = true; svg.style.cursor = "default"; },
      reprendre() { figee = false; gC.classList.remove("faux"); svg.style.cursor = ""; },
      faux() { gC.classList.add("faux"); },
      solution(v) { gS.setAttribute("transform", "translate(" + X(v) + " 0)"); gS.querySelector("text").textContent = v; gS.setAttribute("visibility", "visible"); },
      aide() { svg.querySelectorAll(".cent-lab-aide").forEach(t => t.setAttribute("visibility", "visible")); }
    };
  }
  function choisirLigne(max) {
    const lignes = max <= 30 ? [[0, 10], [0, 20]] : max <= 70 ? [[0, 20], [0, 100], [0, 100]] : [[0, 100], [0, 100], [0, 20]];
    const [a, b] = hasard(lignes);
    const reperes = b === 10 ? [0, 10] : b === 20 ? [0, 10, 20] : [0, 50, 100];
    const haut = Math.min(b, max);
    let n;
    do n = entier(b === 100 ? 5 : a + 1, haut); while (reperes.includes(n) || (b === 100 && n % 10 === 0 && Math.random() < 0.6));
    return { a, b, n, tol: b === 10 ? 0 : b === 20 ? 1 : 4 };
  }
  const phraseLigne = (n, b) => b === 100 ? (n % 10 ? n + " est entre " + (n - n % 10) + " et " + (n - n % 10 + 10) + "." : n + ", c'est " + n / 10 + " dizaines.")

  const sLigne = serie({ id: "cent-ligne", titre: "La ligne graduée", icone: "c-ligne", domaine: "ligne", n: 8,

            h("div", { class: "cent-gros" }, n), lg.svg, ok, lienPapier("ligne"));
        },
        apres(juste) { lg.figer(); if (!juste) lg.faux(); lg.solution(n); Voix.dire(phraseLigne(n, b)); },

      };
    }
  });

  // ----- 4. La dictée de nombres -----
  function nombreDicte(max) {

    conseil: tys(["La voix dit le nombre ; elle l'écrit avec les touches, puis valide. Elle peut réécouter autant qu'elle veut.",

        rendre(feuille, repondre) {

            clavier(repondre, 3),
            h("div", { class: "ligne cent-adulte" }, h("button", { class: "btn discret", onclick: () => { vu.hidden = !vu.hidden; } }, ic("parent"), "Voir le nombre (adulte)"), vu),
            lienPapier("dictee"));

  // ----- 5. Le tableau de 100 : le nombre caché, les déplacements -----
  const rangee = v => Math.floor((v - 1) / 10);
  const DEPL = [{ d: 1, dir: "droite", rot: 90 }, { d: -1, dir: "gauche", rot: -90 }, { d: 10, dir: "bas", rot: 180 }, { d: -10, dir: "haut", rot: 0 }];
  const possible = (v, m, max) => { const t = v + m.d; return t >= 1 && t <= max && (Math.abs(m.d) === 10 || rangee(t) === rangee(v)); };
  function fleche(m) { const s = ic("c-fleche"); s.style.transform = "rotate(" + m.rot + "deg)"; return h("span", { class: "cent-fl", title: m.d > 0 ? "+" + m.d : String(m.d) }, s); }
  function tableau(max, opts) {
    const cases = [];
    const el = h("div", { class: "cent-tableau", role: "grid", "aria-label": "Le tableau des nombres de 1 à " + max });
    for (let v = 1; v <= max; v++) {

      const c = h(opts.toucher ? "button" : "span", { class: "cent-case" + (v === opts.depart ? " depart" : "") + (v === opts.cible ? " cible" : "") + (vis ? "" : " cachee"),
        onclick: opts.toucher ? e => opts.toucher(v, e.currentTarget) : null, "aria-label": vis ? String(v) : "case cachée" },
        v === opts.cible ? "?" : vis ? String(v) : "");
      cases[v] = c; el.append(c);
    }
    el.montrer = (v, cls) => { const c = cases[v]; if (!c) return; c.textContent = v; c.classList.remove("cachee", "cible"); if (cls) c.classList.add(cls); };
    return el;
  }
  function visiblesAuHasard(max, part, garder) {
    const s = new Set(garder);
    for (let v = 1; v <= max; v++) if (Math.random() < part || v % 10 === 1) s.add(v);
    return s;
  }
  const sTableau = serie({ id: "cent-tableau", titre: "Le tableau de 100", icone: "c-tableau", domaine: "nombres", n: 6,
    conseil: tys(["Dans le tableau, un pas vers la droite, c'est +1 ; un pas vers le bas, c'est +10 : le chiffre des dizaines change, celui des unités reste.",
      "Pour le nombre caché, elle regarde ses voisins : celui d'à côté, celui du dessus.",
      "Le tableau à trous imprimé se remplit au crayon : la même chose, avec la main."]),
    question(k) {
      const max = plafond();
      if (k % 2 === 0) {          // le nombre caché, à un pas d'un nombre visible
        let s, m;
        do { s = entier(1, max); m = hasard(DEPL); } while (!possible(s, m, max));
        const t = s + m.d;
        const visibles = visiblesAuHasard(max, 0.5, [s]);
        [t, t - 1, t + 1, t - 10, t + 10].forEach(v => { if (v !== s) visibles.delete(v); });
        let tb;
        return {
          reponse: t, cle: "tableau-cache:" + (m.d > 0 ? "+" : "") + m.d, dire: "Quel nombre se cache sous le point d'interrogation ?",
          rendre(feuille, repondre) {
            tb = tableau(max, { visibles, depart: s, cible: t });
            ajoute(feuille, h("p", { class: "consigne" }, ty("Quel nombre se cache sous le « ? »")),
              h("div", { class: "cent-cote" }, tb, clavier(repondre, 3)), lienPapier("tableau"));
          },
          apres() { tb.montrer(t, "juste"); Voix.dire(s + (m.d > 0 ? " plus " : " moins ") + Math.abs(m.d) + ", c'est " + t + "."); },
          aide() { Voix.dire("Regarde la case colorée : c'est " + s + ". Le point d'interrogation est " + (m.d === 1 ? "juste après." : m.d === -1 ? "juste avant." : m.d === 10 ? "juste en dessous : 10 de plus." : "juste au-dessus : 10 de moins.")); }
        };
      }
      // les déplacements : suivre les flèches depuis la case de départ
      const npas = k < 3 ? 2 : 3;
      let s, prog, t;
      for (;;) {
        s = entier(1, max); prog = []; t = s;
        for (let i = 0; i < npas; i++) { const ok = DEPL.filter(m => possible(t, m, max) && !(prog.length && prog[prog.length - 1].d === -m.d)); if (!ok.length) break; const m = hasard(ok); prog.push(m); t += m.d; }
        if (prog.length === npas && t !== s) break;
      }
      const visibles = visiblesAuHasard(max, 0.2, [s]); visibles.delete(t);
      let tb;
      return {
        reponse: t, cle: "tableau-fleches", dire: "Pars de " + s + " et suis les flèches. Touche la case où tu arrives.",
        rendre(feuille, repondre) {
          tb = tableau(max, { visibles, depart: s, toucher: (v, b) => repondre(v, b) });
          ajoute(feuille, h("p", { class: "consigne" }, ty("Pars de la case verte, suis les flèches : où arrives-tu ?")),
            h("div", { class: "cent-fleches" }, h("span", { class: "cent-depart-n" }, s), prog.map(fleche)), tb, lienPapier("tableau"));
        },
        apres() { let v = s; prog.forEach(m => { v += m.d; tb.montrer(v, v === t ? "juste" : "chemin"); }); Voix.dire("On arrive à " + t + "."); },
        aide() { Voix.dire("La flèche vers la droite, c'est plus un ; vers le bas, c'est plus dix."); }
      };
    }
  });

  // ----- 6. Comparer avec < > = -----
  const SIGNES = [["<", "plus petit que"], ["=", "égal à"], [">", "plus grand que"]];
  function paireAComparer(max) {
    const genre = hasard(["dizaines", "dizaines", "unites", "inverses", "egaux", "petit"]);
    const n2 = () => entier(10, max);
    let a, b;
    if (genre === "unites" && max >= 20) { const d = entier(1, Math.floor((max - 1) / 10)); a = 10 * d + entier(0, 9); do b = 10 * d + entier(0, 9); while (b === a); }
    else if (genre === "inverses" && max >= 31) { let x, y; do { x = entier(1, 9); y = entier(1, 9); } while (x === y || 10 * x + y > max || 10 * y + x > max); a = 10 * x + y; b = 10 * y + x; }
    else if (genre === "egaux") { a = b = n2(); }
    else if (genre === "petit") { a = entier(2, 9); do b = entier(10, max); while (b % 10 >= a && Math.random() < 0.7); }
    else { do { a = n2(); b = n2(); } while (Math.floor(a / 10) === Math.floor(b / 10)); }
    if (a == null || b == null) { a = n2(); b = n2(); }
    if (Math.random() < 0.5) [a, b] = [b, a];
    const g = a === b ? "egaux" : genre === "egaux" ? "dizaines" : genre;
    return { a, b, genre: g };
  }
  const sComparer = serie({ id: "cent-comparer", titre: "Comparer", icone: "c-compare", domaine: "comparer", n: 8,
    conseil: tys(["La pointe du signe montre le plus petit nombre ; le côté ouvert est tourné vers le plus grand.",
      "On regarde d'abord les dizaines : 52 a 5 dizaines, 47 n'en a que 4, donc 52 est plus grand, même si 7 est plus grand que 2.",
      "Faites-lui lire la phrase entière : « 47 est plus petit que 52 »."]),
    question() {
      const { a, b, genre } = paireAComparer(plafond());
      const bon = a < b ? "<" : a > b ? ">" : "=";
      let trou, aide;
      return {
        reponse: bon, cle: "comparer:" + genre, dire: "Compare " + a + " et " + b + ". Choisis le bon signe.",
        rendre(feuille, repondre) {
          trou = h("span", { class: "cent-trou" }, "?");

          ajoute(feuille, h("p", { class: "consigne" }, "Choisis le bon signe."),

            aide, lienPapier("comparer"));
        },
        apres() {
          trou.textContent = bon; trou.classList.add("plein");
          Voix.dire(a + " est " + SIGNES.find(x => x[0] === bon)[1] + " " + b + ".");
        },
        aide() { aide.hidden = false; }
      };
    }
  });

  // ----- l'écran du module : le réglage, les six jeux -----

    { def: sDizaines, court: "Je compte les paquets de dix", papier: "buchettes" },

  function finPartie(def, r) {
    ecran = "fin"; vider(); bip("fin"); if (r.etoiles) pluie("⭐");
    const j = JEUX.find(x => x.def === def);
    ajoute(racine, barre(def.titre),

        j && PAPIER[j.papier] ? lienImprimer(PAPIER[j.papier][0], ty(PAPIER[j.papier][1]), "btn discret") : null));
  }
  function jouer(def) { evaluation = false; seance = null; jouerSerie(def, { finir: r => finPartie(def, r) }); }

  rubrique({ id: ID, onglet: "compter", section: "Jusqu'à 100", ordre: 10, titre: "Jusqu'à 100", icone: "c-tableau",

// ---------- Je comprends : des phrases lues seule, et le moteur des scènes ----------
// Au point d'étape de mi-CP, « comprendre des phrases lues seul » est la compétence la moins
// réussie du pays. Cinq formats, repris des évaluations et des fichiers de compréhension :
// quatre images presque pareilles, la consigne à exécuter, vrai ou bête, les mots à remettre
// dans l'ordre, le mot qui manque. Toute phrase lue seule est filtrée à l'exécution : elle
// n'a que des mots lisibles avec les sons vus et les mots-outils appris.
//
// Ce fichier porte aussi « Cmp », le moteur commun des scènes (emoji placés en CSS), des phrases
// fabriquées et des étiquettes : module-ecoute, module-langue et module-maphrase s'en servent.

const Cmp = (() => {
  const NS = "http://www.w3.org/2000/svg";

  // ---------- Le style ----------
  document.head.append(h("style", null, `

:root[data-theme="dark"]{--comprendre-carton:#9a7440;--comprendre-ciel:#1b2733;--comprendre-sol:#25321d;--comprendre-eau:#2f6e98;--comprendre-eau-2:#245a80;

@media (max-width:760px){.comprendre-tuile{font-size:1.55rem;min-height:56px;padding:2px 10px}.comprendre-cartes{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .comprendre-tableau{grid-template-columns:repeat(2,minmax(0,1fr))}
  .comprendre-vb{min-width:130px;min-height:104px}.comprendre-mot{min-width:96px}}
`));

  // ---------- Lire seule : le filtre ----------
  const cache = new Map();
  const sig = e => e.sons.join(",") + "|" + e.outils.join(",");
  function lisibleTexte(t, e) {
    e = e || etat;
    const k = sig(e) + "\u0001" + t;
    if (cache.has(k)) return cache.get(k);
    if (cache.size > 20000) cache.clear();
    const r = jetons(t).every(j => j.ponct || jetonLisible(j, e));
    cache.set(k, r);
    return r;
  }
  // Pour ce que dit la voix : tout est permis.
  const toutLisible = () => true;
  const lecteur = e => (t => lisibleTexte(t, e || etat));
  const aFocus = (t, e) => { e = e || etat; return jetons(t).some(j => j.mot && j.mot.tags.includes(e.focus)); };
  const poidsFocus = (txt, e) => x => aFocus(txt(x), e) ? 3 : 1;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const un = (liste, poids) => tirer(liste, 1, poids)[0];

  // ---------- Les pièces des phrases ----------
  const PERSO = Object.fromEntries(CMP_PERSOS.map(p => [p.id, p]));
  const LIEU = Object.fromEntries(CMP_LIEUX.map(l => [l.id, l]));
  const ACTION = Object.fromEntries(CMP_ACTIONS.map(a => [a.id, a]));
  const deGn = gn => gn.startsWith("le ") ? "du " + gn.slice(3) : gn.startsWith("la ") ? "de la " + gn.slice(3) : "de " + gn;
  const REL = { sur: "sur", sous: "sous", dans: "dans", devant: "devant", derriere: "derrière" };
  const relTxt = (rel, l) => rel === "cote" ? "à côté " + deGn(l.gn) : REL[rel] + " " + l.gn;
  const nomSeul = p => p.gn.replace(/^(le |la |l')/, "");
  const nombre = (n, p) => n === 1 ? (p.g === "f" ? "une " : "un ") + nomSeul(p) : (n === 2 ? "deux " : "trois ") + p.pl;
  const adj = (t, p) => (t === "petit" ? "petit" : "grand") + (p.g === "f" ? "e" : "");
  const leLa = p => p.g === "f" ? "la" : "le";
  const VERBES_CONSIGNE = ["Touche", "Montre", "Trouve"];

  // Les pièces lisibles, selon ce qu'on peut lire : mises en cache par état.
  const cachePieces = new Map();
  function pieces(lis, cle) {
    if (cle && cachePieces.has(cle)) return cachePieces.get(cle);
    const P = {
      persos: CMP_PERSOS.filter(p => lis(p.gn)),
      actions: CMP_ACTIONS.filter(a => lis(a.v)),
      places: CMP_LIEUX.flatMap(l => l.rels.map(rel => ({ lieu: l, rel, txt: relTxt(rel, l) }))).filter(x => lis(x.txt)),
      objets: CMP_OBJETS.filter(o => lis(o.gn)),
      est: lis("est"), et: lis("et"), ilya: lis("Il y a"), ne: lis("ne pas"), qui: lis("qui"),
      deux: lis("deux"), trois: lis("trois"),
      verbes: VERBES_CONSIGNE.filter(v => lis(v))
    };
    P.actionsLieu = P.actions.filter(a => !a.seul);
    P.betes = CMP_PERSOS.filter(p => !p.nom);
    P.compte1 = P.betes.filter(p => lis(nombre(1, p)));
    P.compte2 = P.betes.filter(p => p.pl && lis(p.pl));
    P.tailles = P.betes.filter(p => lis(leLa(p) + " " + adj("petit", p) + " " + nomSeul(p)) || lis(leLa(p) + " " + adj("grand", p) + " " + nomSeul(p)));
    if (cle) { if (cachePieces.size > 40) cachePieces.clear(); cachePieces.set(cle, P); }
    return P;
  }
  const piecesDe = (e, oral) => oral ? pieces(toutLisible, "*tout*") : pieces(lecteur(e), sig(e));

  // Une autre pièce que celle-ci, pour une image fausse : d'abord parmi celles qui se dessinent autrement.
  const autrePerso = (p, sauf = []) => hasard(CMP_PERSOS.filter(x => x.e !== p.e && !sauf.some(s => s && s.e === x.e)));
  const autreBete = (p, sauf = []) => hasard(CMP_PERSOS.filter(x => !x.nom && x.e !== p.e && !sauf.some(s => s && s.e === x.e)));
  const autreAction = (a, sauf = [], avecLieu) => hasard(CMP_ACTIONS.filter(x => x.img !== a.img && !sauf.some(s => s && s.img === x.img) && (!avecLieu || !x.seul)));
  const autreObjet = (o, sauf = []) => hasard(CMP_OBJETS.filter(x => x.e !== o.e && !sauf.some(s => s && s.e === x.e)));
  const autreRel = (l, rel) => { const r = l.rels.filter(x => x !== rel); return r.length ? hasard(r) : null; };
  const autreLieu = (l, rel, sauf = []) => hasard(CMP_LIEUX.filter(x => x.id !== l.id && x.rels.includes(rel) && !sauf.includes(x.id)));

  // Une scène : des stations côte à côte ; chacune, un lieu (ou rien) et ses personnages.
  const st = (lieu, persos) => ({ lieu: lieu ? lieu.id : null, persos });
  const pe = (p, o) => Object.assign({ e: p.e }, o || {});

  // ---------- Les modèles de phrases ----------
  // Chacun : peut(P) dit s'il est faisable, combien(P) compte les phrases, faire(P, e) en tire une
  // avec la bonne scène et trois scènes qui ne diffèrent que d'un détail.
  const MODELES = {
    A: { niv: 1, peut: P => P.persos.length && P.actions.length, combien: P => P.persos.length * P.actions.length,
      faire(P, e, poids) {
        const p = un(P.persos, poids(x => x.gn)), a = un(P.actions, poids(x => x.v));
        const p2 = autrePerso(p), a2 = autreAction(a), p3 = autrePerso(p, [p2]), a3 = autreAction(a, [a2]);
        const sc = (pp, aa) => ({ st: [st(null, [pe(pp, { act: aa.id })])] });
        return { texte: cap(p.gn) + " " + a.v + ".", juste: sc(p, a), faux: [sc(p2, a), sc(p, a2), Math.random() < 0.5 ? sc(p3, a) : sc(p, a3)],
          morceaux: { sujet: p.gn, verbe: a.v, comp: null }, sujet: p, action: a };
      } },
    B: { niv: 1, peut: P => P.persos.some(p => P.objets.some(o => !o.gens || p.nom)), combien: P => P.persos.reduce((n, p) => n + P.objets.filter(o => !o.gens || p.nom).length, 0),
      faire(P, e, poids) {
        const p = un(P.persos, poids(x => x.gn)), objets = P.objets.filter(x => !x.gens || p.nom);
        if (!objets.length) return null;
        const o = un(objets, poids(x => x.gn));
        const sc = (pp, oo) => ({ st: [st(null, [pe(pp, { obj: oo ? oo.id : null })])] });
        const o2 = autreObjet(o);
        return { texte: cap(p.gn) + " a " + o.gn + ".", juste: sc(p, o), faux: [sc(autrePerso(p), o), sc(p, o2), sc(p, null)],
          morceaux: { sujet: p.gn, verbe: "a", comp: o.gn }, sujet: p, objet: o };
      } },
    C: { niv: 2, peut: P => P.est && P.persos.length && P.places.length, combien: P => P.persos.length * P.places.length,
      faire(P, e, poids) {
        const p = un(P.persos, poids(x => x.gn)), pl = un(P.places, poids(x => x.txt));
        const sc = (pp, l, rel) => ({ st: [st(l, [pe(pp, { rel })])] });
        const r2 = autreRel(pl.lieu, pl.rel), l2 = autreLieu(pl.lieu, pl.rel), l3 = autreLieu(pl.lieu, pl.rel, [l2 && l2.id]);
        return { texte: cap(p.gn) + " est " + pl.txt + ".", juste: sc(p, pl.lieu, pl.rel),
          faux: [sc(autrePerso(p), pl.lieu, pl.rel), r2 ? sc(p, pl.lieu, r2) : sc(p, l3, pl.rel), sc(p, l2, pl.rel)],
          morceaux: { sujet: p.gn, verbe: "est", comp: pl.txt }, sujet: p, place: pl };
      } },
    D: { niv: 2, peut: P => P.persos.length && P.actionsLieu.length && P.places.length,
      combien: P => P.persos.length * P.actionsLieu.length * P.places.length,
      faire(P, e, poids) {
        const p = un(P.persos, poids(x => x.gn));
        const a = un(P.actionsLieu, poids(x => x.v));
        const places = P.places.filter(x => !(a.id === "lit" && x.lieu.id === "lit"));
        if (!places.length) return null;
        const pl = un(places, poids(x => x.txt));
        const sc = (pp, aa, l, rel) => ({ st: [st(l, [pe(pp, { rel, act: aa.id })])] });
        const r2 = autreRel(pl.lieu, pl.rel), l2 = autreLieu(pl.lieu, pl.rel);
        return { texte: cap(p.gn) + " " + a.v + " " + pl.txt + ".", juste: sc(p, a, pl.lieu, pl.rel),
          faux: [sc(autrePerso(p), a, pl.lieu, pl.rel), sc(p, autreAction(a, [], true), pl.lieu, pl.rel), r2 && Math.random() < 0.6 ? sc(p, a, pl.lieu, r2) : sc(p, a, l2, pl.rel)],
          morceaux: { sujet: p.gn, verbe: a.v, comp: pl.txt }, sujet: p, action: a, place: pl };
      } },
    E: { niv: 2, peut: P => P.ilya && P.places.length && (P.compte1.length || (P.deux && P.compte2.length)),
      combien: P => P.places.length * (P.compte1.length + (P.deux ? P.compte2.length : 0) + (P.trois ? P.compte2.length : 0)),
      faire(P, e, poids, niv) {
        const ns = [];
        if (P.compte1.length) ns.push(1);
        if (niv >= 3 && P.deux && P.compte2.length) ns.push(2);
        if (niv >= 3 && P.trois && P.compte2.length) ns.push(3);
        if (!ns.length && P.deux && P.compte2.length) ns.push(2);
        if (!ns.length) return null;
        const n = hasard(ns), p = un(n === 1 ? P.compte1 : P.compte2, poids(x => n === 1 ? nombre(1, x) : x.pl));
        const pl = un(P.places, poids(x => x.txt));
        const sc = (pp, nn, l, rel) => ({ st: [st(l, Array.from({ length: nn }, () => pe(pp, { rel })))] });
        const autres = [1, 2, 3].filter(x => x !== n);
        return { texte: "Il y a " + nombre(n, p) + " " + pl.txt + ".", juste: sc(p, n, pl.lieu, pl.rel),
          faux: [sc(p, autres[0], pl.lieu, pl.rel), sc(p, autres[1], pl.lieu, pl.rel), Math.random() < 0.5 ? sc(autreBete(p), n, pl.lieu, pl.rel) : sc(p, n, autreLieu(pl.lieu, pl.rel), pl.rel)],
          morceaux: null, sujet: p, place: pl, n };
      } },
    F: { niv: 3, peut: P => P.est && P.et && P.persos.length > 1 && new Set(P.places.map(x => x.lieu.id)).size > 1,
      combien: P => P.persos.length * (P.persos.length - 1) * P.places.length * (P.places.length - 1) / 2,
      faire(P, e, poids) {
        const [p1, p2] = tirer(P.persos.filter((x, i, l) => l.findIndex(y => y.e === x.e) === i), 2, poids(x => x.gn));
        const pl1 = un(P.places, poids(x => x.txt));
        const autres = P.places.filter(x => x.lieu.id !== pl1.lieu.id);
        if (!p2 || !autres.length) return null;
        const pl2 = un(autres, poids(x => x.txt));
        const sc = (a, la, b, lb) => ({ st: [st(la.lieu, [pe(a, { rel: la.rel })]), st(lb.lieu, [pe(b, { rel: lb.rel })])] });
        const r1 = autreRel(pl1.lieu, pl1.rel);
        return { texte: cap(p1.gn) + " est " + pl1.txt + " et " + p2.gn + " est " + pl2.txt + ".", juste: sc(p1, pl1, p2, pl2),
          faux: [sc(p2, pl1, p1, pl2), sc(p1, pl1, autrePerso(p1, [p2]), pl2), r1 ? sc(p1, { lieu: pl1.lieu, rel: r1 }, p2, pl2) : sc(p1, pl2, p2, pl1)],
          morceaux: null, sujet: p1 };
      } },
    G: { niv: 3, peut: P => P.est && P.tailles.length && P.places.some(x => x.rel !== "cote"),
      combien: P => P.tailles.length * P.places.filter(x => x.rel !== "cote").length * 2,
      faire(P, e, poids) {
        const p = un(P.tailles, poids(x => x.gn));
        const t = ["petit", "grand"].filter(x => (e === "*" ? toutLisible : lecteur(e))(leLa(p) + " " + adj(x, p) + " " + nomSeul(p)));
        const taille = hasard(t.length ? t : ["petit"]);
        const pl = un(P.places.filter(x => x.rel !== "cote"), poids(x => x.txt));
        const T = { petit: 0.62, grand: 1.25 }, autre = taille === "petit" ? "grand" : "petit";
        const sc = (a, b, l) => ({ st: [st(l || pl.lieu, [pe(p, Object.assign({ t: T[taille] }, a)), pe(p, Object.assign({ t: T[autre] }, b))])] });
        const l2 = autreLieu(pl.lieu, pl.rel);
        return { texte: cap(leLa(p) + " " + adj(taille, p) + " " + nomSeul(p)) + " est " + pl.txt + ".",
          juste: sc({ rel: pl.rel }, { rel: "cote" }),
          faux: [sc({ rel: "cote" }, { rel: pl.rel }), sc({ rel: "cote" }, { rel: "cote" }), sc({ rel: pl.rel }, { rel: "cote" }, l2)],
          morceaux: null, sujet: p };
      } },
    H: { niv: 3, peut: P => P.ne && P.persos.length && P.actionsLieu.length > 1, combien: P => P.persos.length * P.actionsLieu.length,
      faire(P, e, poids) {
        const p = un(P.persos, poids(x => x.gn)), a = un(P.actionsLieu, poids(x => x.v));
        const a2 = autreAction(a, [], true), p2 = autrePerso(p);
        const sc = (pp, aa) => ({ st: [st(null, [pe(pp, { act: aa.id })])] });
        return { texte: cap(p.gn) + " ne " + a.v + " pas.", juste: sc(p, a2), faux: [sc(p, a), sc(p2, a2), sc(p2, a)], morceaux: null, sujet: p };
      } }
  };
  const POIDS_NIV = { 1: { A: 3, B: 2 }, 2: { C: 3, D: 2, B: 1, E: 1 }, 3: { D: 2, E: 2, F: 2, G: 2, H: 2, C: 1 } };

  // Tire une phrase et ses images. opts : { e (état), oral (pas de filtre), niveau, modeles: ["A", …] }
  function fabriquer(opts) {
    opts = opts || {};
    const e = opts.e || etat, P = piecesDe(e, opts.oral);
    const niv = opts.niveau || e.niveau;
    const poids = txt => opts.oral ? (() => 1) : poidsFocus(txt, e);
    const ordre = [niv, niv - 1, niv - 2, niv + 1, niv + 2].filter(n => n >= 1 && n <= 3);
    for (const n of ordre) {
      let liste = Object.entries(POIDS_NIV[n]).filter(([m]) => (!opts.modeles || opts.modeles.includes(m)) && MODELES[m].peut(P));
      if (!liste.length) continue;
      for (let essai = 0; essai < 12; essai++) {
        const m = un(liste, x => x[1])[0];
        const r = MODELES[m].faire(P, opts.oral ? "*" : e, poids, n);
        if (!r) continue;
        if (!opts.oral && !lisibleTexte(r.texte, e)) continue;   // garde-fou : jamais une phrase illisible
        const vus = new Set([JSON.stringify(r.juste)]);

    const sts = ordre.map(i => stations[i]), bonne = ordre.indexOf(0);
    let zones = [];
    return {
      reponse: bonne, cle: "consigne:" + mode, lu: [texte], choix: sts.map((x, i) => i), format: "consigne",
      dire: "Lis la consigne, et fais ce qu'elle dit.",
      astuce: "Elle lit la consigne seule, puis touche le bon endroit de l'image.",
      rendre(feuille, repondre) {
        const tab = h("div", { class: "comprendre-tableau", role: "group", "aria-label": "L'image" },
          sts.map((sta, i) => Cmp.dessiner({ st: [sta] }, { clic: (j, el) => repondre(i, el), label: "Coin " + (i + 1) })));
        zones = [...tab.querySelectorAll(".comprendre-zone")];
        ajoute(feuille, consigne("Lis, et fais ce qui est écrit."), Cmp.phrase(texte), tab);
      },
      apres() { montrerJuste(zones[bonne]); Voix.dire(texte); }
    };
  }

  // 3. Vrai ou bête ?
  function qVraiBete() {
    const l = vbLisibles(etat);
    if (!l.length) return null;
    const x = tirer(l, 1, y => Cmp.aFocus(y.texte) ? 3 : 1)[0];
    let bV, bB, image;
    return {
      reponse: x.v, cle: "vraibete", lu: [x.texte], choix: ["v", "b"], format: "vraibete",
      dire: "Lis la phrase. Est-ce que c'est vrai, ou est-ce que c'est bête ?",
      astuce: "Elle lit seule, puis choisit. « Bête », c'est ce qui ne peut pas arriver pour de vrai.",
      rendre(feuille, repondre) {
        bV = h("button", { class: "comprendre-vb", onclick: ev => repondre("v", ev.currentTarget) }, h("span", { "aria-hidden": "true" }, "👍"), "C'est vrai");
        bB = h("button", { class: "comprendre-vb", onclick: ev => repondre("b", ev.currentTarget) }, h("span", { "aria-hidden": "true" }, "🤪"), "C'est bête !");
        image = h("div", { class: "image", hidden: true, "aria-hidden": "true" }, x.img);
        ajoute(feuille, consigne("Vrai ou bête ?"), Cmp.phrase(x.texte), h("div", { class: "comprendre-deux" }, bV, bB), image);
      },
      apres() { montrerJuste(x.v === "v" ? bV : bB); if (x.img) { image.hidden = false; image.classList.add("apparait"); } Voix.dire(x.texte + (x.v === "v" ? " C'est vrai." : " C'est bête !")); }
    };
  }

  // 4. Les mots à remettre dans l'ordre
  function qOrdre() {
    const f = Cmp.fabriquer({ modeles: ["A", "B", "C", "D", "E"] });
    if (!f) return null;
    const mots = f.texte.split(" ");
    if (mots.length < 3) return null;
    let comp, verifier, zoneImage;
    return {
      verifier: v => v === f.texte, cle: "ordre:" + mots.length + "mots", lu: [f.texte], format: "ordre", solution: f.texte,
      dire: "Remets les mots dans l'ordre pour dire ce que montre l'image.",
      astuce: "La majuscule dit le premier mot, le point dit le dernier. L'image aide à trouver le sens.",
      rendre(feuille, repondre) {
        zoneImage = Cmp.dessiner(f.juste, { classe: "comprendre-moyenne" });
        comp = Cmp.composer({ tuiles: mots, rendu: t => rendreJetons(jetons(t)), change: () => { verifier.disabled = !comp.plein(); } });
        verifier = h("button", { class: "btn plein", disabled: true, onclick: () => {
          const v = comp.valeur().join(" ");
          if (v !== f.texte) { comp.marquer(mots); comp.reponse.classList.add("secoue"); setTimeout(() => comp.reponse.classList.remove("secoue"), 420); }
          repondre(v, null);
        } }, ic("ok"), "Vérifier");
        ajoute(feuille, consigne("Remets les mots dans l'ordre."), zoneImage, comp.el, verifier);
      },
      apres() { comp.marquer(mots); verifier.hidden = true; Voix.dire(f.texte); },
      aide() { comp.vider(); const tu = comp.tuiles.find(t => t.t === mots[0]); if (tu) comp.poser(tu); }
    };
  }

  // 5. Le mot qui manque
  function qCompleter() {
    const l = trousLisibles(etat);
    if (!l.length) return null;
    const x = tirer(l, 1, y => Cmp.aFocus(y.t + " " + y.bonne) ? 3 : 1)[0];
    const choixMots = melanger([x.bonne, ...x.faux]);
    let boutons = [], trou;
    const [avant, apres] = x.t.split("…");
    return {
      reponse: x.bonne, cle: "completer", lu: [x.t.replace("…", x.bonne), ...x.faux], choix: choixMots, format: "completer",
      dire: "Lis la phrase. Quel mot va dans le trou ?",
      astuce: "Elle lit la phrase en entier, puis essaie chaque mot dans le trou : un seul a du sens.",
      rendre(feuille, repondre) {
        trou = h("span", { class: "comprendre-trou" }, "?");
        const lec = h("div", { class: "lecture moyen comprendre-phrase" }, rendreJetons(jetons(avant.trim())), " ", trou, apres ? rendreJetons(jetons(apres.trim())) : null, apres && /[.!?]$/.test(apres) ? null : ".");
        boutons = choixMots.map(m => h("button", { class: "comprendre-mot lecture moyen", onclick: ev => repondre(m, ev.currentTarget) }, rendreJetons(jetons(m))));
        ajoute(feuille, consigne("Quel mot va dans le trou ?"), lec, h("div", { class: "comprendre-mots" }, boutons));
      },
      apres() { trou.replaceChildren(...rendreJetons(jetons(x.bonne))); montrerJuste(boutons[choixMots.indexOf(x.bonne)]); Voix.dire(x.t.replace("…", x.bonne)); }
    };
  }

  // Un tirage peut échouer (une phrase de deux mots à remettre en ordre…) : on retente avant
  // d'abandonner, car une question vide arrête la série.
  const essayer = f => { for (let i = 0; i < 10; i++) { const q = f(); if (q) return q; } return null; };
  const FORMATS = {
    images: { titre: "Quatre images", pic: "🖼️", court: "Je lis et je trouve l'image", q: qImages,
      conseil: ["Les quatre images ne diffèrent que d'un détail : qui, ce qu'il fait, où il est, combien. Il faut lire toute la phrase pour choisir.",
        "Elle lit seule. Si elle choisit trop vite, demandez-lui de relire la phrase en montrant chaque mot, puis de comparer les images.",
        "Après la réponse, la voix relit la phrase : elle vérifie son choix en l'entendant."] },
    consigne: { titre: "La consigne", pic: "👆", court: "Je lis et je fais ce qui est écrit", q: qConsigne,
      conseil: ["Comme les consignes de la classe : lire, puis faire exactement ce qui est demandé, pas plus.",
        "La scène contient des pièges : le même animal ailleurs, un autre animal au même endroit.",
        "Ce jeu arrive avec les sons de « touche », « montre » ou « trouve »."] },
    vraibete: { titre: "Vrai ou bête ?", pic: "🤪", court: "Je lis et je dis si c'est possible", q: qVraiBete,
      conseil: ["« Bête », c'est ce qui ne peut pas arriver pour de vrai : un mur qui rit, une poule qui a des dents.",
        "Ce jeu oblige à comprendre le sens, pas seulement à déchiffrer : on ne peut pas répondre en devinant un mot.",
        "Demandez-lui pourquoi c'est bête : la justification compte autant que la réponse."] },
    ordre: { titre: "Les mots en ordre", pic: "🧩", court: "Je remets les mots dans l'ordre", q: qOrdre,
      conseil: ["La majuscule dit quel mot commence, le point dit lequel finit. L'image dit ce que la phrase doit raconter.",
        "Une étiquette posée se retire en la touchant. Après deux essais, le premier mot se pose tout seul.",
        "Faites relire la phrase finie, d'une traite."] },
    completer: { titre: "Le mot qui manque", pic: "🕳️", court: "Je trouve le mot qui a du sens", q: qCompleter,
      conseil: ["Les trois mots se lisent ; un seul donne une phrase qui a du sens.",
        "Faites-lui essayer chaque mot dans le trou, à voix haute : « Le rat a un mur ? Non ! »"] }
  };
  const IDS = Object.keys(FORMATS);
  const series = {};
  IDS.forEach(id => {
    const F = FORMATS[id];
    series[id] = serie({ id: "comprendre-" + id, titre: F.titre, icone: "comprendre", conseil: F.conseil, domaine: DOM, n: 6, question: () => essayer(F.q) });
  });
  // Un peu de tout : un format différent à chaque question, selon ce qui est faisable.
  let dernier = null;
  const POIDS = { images: 4, consigne: 2, vraibete: 2, ordre: 2, completer: 2 };
  series.melange = serie({ id: "comprendre-melange", titre: "Je comprends", icone: "comprendre", domaine: DOM, n: 6,
    conseil: ["Elle lit seule, puis montre qu'elle a compris : une image, un geste, un mot, une phrase remise en ordre.",
      "Comprendre des phrases lues seul est la compétence la moins réussie au point d'étape de mi-CP : quelques minutes chaque jour comptent.",
      "Si elle a déchiffré mais pas compris, faites-lui relire la phrase d'une traite : le sens arrive quand la lecture est fluide."],
    question: () => {
      const o = offre();
      const ids = IDS.filter(id => o[id] > 0 && id !== dernier);
      for (let essai = 0; essai < 6 && ids.length; essai++) {
        const id = tirer(ids, 1, x => POIDS[x])[0];
        const q = essayer(FORMATS[id].q);
        if (q) { dernier = id; return q; }
      }
      return null;
    } });

  function ouvrir() {
    const o = offre();
    const total = IDS.reduce((s, id) => s + o[id], 0);
    Cmp.menu("Je comprends", "Lis seule, puis montre que tu as compris.", [
      { titre: "Un peu de tout", pic: "⭐", court: "Six questions mélangées", n: total ? null : 0, plein: 1, ouvrir: () => jouerSerie(series.melange) },
      ...IDS.map(id => ({ titre: FORMATS[id].titre, pic: FORMATS[id].pic, court: FORMATS[id].court, n: o[id], ouvrir: () => jouerSerie(series[id]) }))
    ], series.melange.conseil, "Choisissez un jeu, ou « Un peu de tout ». Elle lit seule : vous ne lisez pas la phrase à sa place.");
  }

  rubrique({ id: "comprendre", onglet: "lire", section: "Lire", ordre: 40, titre: "Je comprends", icone: "comprendre",
    court: "Je lis seule et je montre que j'ai compris",
    ouvrir,
    seance: suite => jouerSerie(series.melange, { n: 3, finir: suite }),
    dispo: () => { const o = offre(); return IDS.reduce((s, id) => s + o[id], 0) >= 6; } });
  pointEtape(DOM, "Comprendre des phrases lues seule", suite => jouerSerie(series.images, { n: 5, evaluation: true, finir: suite }));

  // Pour les essais : la page d'essai y trouve les séries et le compte de ce qui est faisable.
  Cmp.comprendre = { series, offre, FORMATS };
})();

// ---------- J'écoute une histoire : la compréhension à l'oral ----------
// Sur le modèle de Narramus (Cèbe et Goigoux), avec des histoires neuves (donnees-ecoute.js) :
// avant, les mots difficiles et leur image ; pendant, la voix lit page par page ; après, des
// questions dont la réponse est dans le texte, et d'autres où il faut comprendre ce qui n'est
// pas dit ; pour finir, remettre les scènes dans l'ordre et raconter avec ses mots.
// Et une série courte, « phrases entendues », pour le point d'étape.

(() => {
  ICONES.ecoute = '<path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-5.5 1.6"/><path d="M10 9.5a2 2 0 0 1 4 0"/><path d="M19.5 4.5c1.2 1.4 2 3.2 2 5.2M2.5 9.7c0-2 .8-3.8 2-5.2"/>';
  const DOM = "comprehension-orale";
  const FINE = " ";
  const typo = s => s.replace(/\s*([;:!?])(?=\s|$|»)/g, FINE + "$1").replace(/«\s*/g, "«" + FINE).replace(/\s*»/g, FINE + "»");
  const memo = () => etat.modules.ecoute || (etat.modules.ecoute = { ecoutees: {} });
  const H = Object.fromEntries(ECOUTE_HISTOIRES.map(x => [x.id, x]));

  document.head.append(h("style", null, `

  // Une scène d'histoire : un fond, quelques emoji.
  function scene(s, petite) {
    const [fond, emo] = s.split("|");
    return h("div", { class: "ecoute-scene ecoute-fond-" + fond + (petite ? " ecoute-petite" : ""), style: "--fond:" + (ECOUTE_FONDS[fond] || "#9ccf6e"), role: "img", "aria-label": "Une image de l'histoire" },
      emo.split(" ").map(e => h("span", { "aria-hidden": "true" }, e)));
  }
  const phrases = t => t.split(/(?<=[.!?…])\s+(?=[A-ZÀ-ÖÙ-Ý«])/);

  // La voix lit une page phrase par phrase (une voix de synthèse coupe les longs textes),
  // et la phrase lue s'éclaire dans le texte de l'adulte.
  let chaine = 0;
  function lirePage(liste, spans, garde, fin) {
    const moi = ++chaine;
    const suite = i => {
      if (moi !== chaine || !garde.isConnected) return;
      spans.forEach((s, k) => s.classList.toggle("ecoute-ici", k === i));
      if (i >= liste.length) { if (fin) fin(); return; }
      Voix.dire(liste[i], false, { fin: () => setTimeout(() => suite(i + 1), 280) }).then(ok => { if (!ok && moi === chaine) spans.forEach(s => s.classList.remove("ecoute-ici")); });
    };
    suite(0);
  }
  const arreter = () => { chaine++; Voix.taire(); };

  // ---------- La bibliothèque ----------
  function bibliotheque() {
    const m = memo();
    Cmp.menu("J'écoute une histoire", "Choisis une histoire : la voix te la lit.",
      [{ titre: "Des phrases à écouter", pic: "👂", court: "J'écoute une phrase, je trouve l'image", n: null, plein: 1, ouvrir: () => jouerSerie(ENTENDUES) },
        ...ECOUTE_HISTOIRES.map(x => ({ titre: x.titre, pic: x.image, n: null,
          court: m.ecoutees[x.id] ? "Écoutée " + (m.ecoutees[x.id] > 1 ? m.ecoutees[x.id] + " fois" : "une fois") : "Cinq pages, puis on raconte",
          ouvrir: () => histoire(x) }))],
      ["Une histoire se lit en trois temps : on apprend d'abord quatre mots difficiles, on écoute l'histoire, puis on la raconte.",
        "Les questions « Pourquoi… ? » n'ont pas leur réponse dans le texte : il faut comprendre ce qui n'est pas dit. C'est le plus difficile, et ce qui sert le plus.",
        "Relire la même histoire plusieurs jours de suite est une bonne idée : on la raconte de mieux en mieux.",
        "Pour raconter avec les mains : chaque histoire a une page à imprimer, ses images à découper et à coller dans l'ordre."],
      "Choisissez une histoire, de préférence une qu'elle connaît déjà un peu : on la raconte mieux la deuxième fois.",
      [lienImprimer("ecoute/histoires-a-raconter.pdf", "Toutes les images à découper", "btn discret")]);
  }

  // ---------- Une histoire ----------
  function histoire(H0) {
    ecran = "ecoute";
    const titre = H0.titre;
    let pg = 0;

    function avant() {
      const { feuille, adulte } = ecranModule(titre, h("span", { class: "compte" }, "les mots"));
      const cartes = H0.mots.map(([e, mot, def]) => {
        const b = h("button", { class: "ecoute-mot", onclick: () => {
          cartes.forEach(c => c.classList.remove("ecoute-ici")); b.classList.add("ecoute-ici", "ecoute-vu");
          Voix.dire(mot + ". " + def);
          expl.textContent = typo(def);
        } }, h("span", { class: "ecoute-emo", "aria-hidden": "true" }, e), h("b", null, mot));
        return b;
      });
      const expl = h("p", { class: "ecoute-texte" }, "Touche une image pour entendre le mot.");
      ajoute(feuille, h("p", { class: "consigne" }, "Avant l'histoire, des mots à connaître."), h("div", { class: "ecoute-mots" }, cartes), expl);
      bandeAdulte(adulte, [astuce(Voix.dispo() ? "Elle touche chaque image. Faites-lui répéter le mot, puis demandez-lui de l'expliquer avec ses mots."
        : "Lisez chaque mot et son explication (sous les images), puis demandez-lui de l'expliquer avec ses mots."),
        bSuivant(() => { pg = 0; page(); }, "On écoute l'histoire")]);
      ajoute(racine, conseil({ conseil: ["Les mots qu'on ne connaît pas empêchent de comprendre. On les apprend avant, avec leur image : c'est le premier geste de Narramus.",
        "Ne passez pas à l'histoire tant qu'elle ne sait pas dire ce que veut dire chaque mot, même maladroitement."] }));
      setTimeout(() => Voix.dire("Avant l'histoire, voici des mots à connaître. Touche une image pour entendre le mot."), 400);
    }

    function page() {
      const P = H0.pages[pg];
      const { feuille, adulte } = ecranModule(titre, h("span", { class: "compte" }, "page " + (pg + 1) + " / " + H0.pages.length));
      const liste = phrases(P.texte);
      const spans = liste.map(t => h("span", { class: "ecoute-ph" }, typo(t), " "));
      const texte = h("div", { class: "ecoute-texte" }, h("span", { class: "ecoute-qui" }, "Le texte, pour l'adulte"), spans);
      ajoute(feuille, scene(P.scene), texte);
      const lire = () => lirePage(liste, spans, feuille);
      const suivant = pg + 1 < H0.pages.length ? bSuivant(() => { arreter(); pg++; page(); }, "Page suivante")
        : bSuivant(() => { arreter(); questions(0); }, "Les questions");
      bandeAdulte(adulte, [astuce(Voix.dispo() ? "Elle écoute en regardant l'image. Montrez ce que dit la voix ; laissez-la commenter."
        : "Lisez la page à voix haute, lentement, en montrant l'image."),
        Voix.dispo() ? h("button", { class: "btn ecoute", onclick: lire }, ic("haut"), "Réécouter") : null, suivant]);
      if (Voix.dispo()) setTimeout(lire, 450);
    }

    function questions(k) {
      if (k >= H0.questions.length) return raconter();
      const q = H0.questions[k];
      const { feuille, adulte } = ecranModule(titre, h("span", { class: "compte" }, "question " + (k + 1) + " / " + H0.questions.length));

      } }, h("span", { class: "ecoute-emo", "aria-hidden": "true" }, o[0]), h("small", null, o[1])));

    }

    // Les scènes à remettre dans l'ordre : 3, 4 ou 5 selon le groupe d'œufs.
    function raconter() {

      bandeAdulte(adulte, [astuce("Elle touche les images dans l'ordre : d'abord, ensuite, à la fin. Une image mal placée se retire en touchant sa case."), bSuivant(dire, "Passer")]);

        bEncore(() => histoire(H0), "On la réécoute"),

      setTimeout(() => Voix.dire("Raconte l'histoire avec tes mots."), 400);
    }

    function fin() {
      const m = memo(); m.ecoutees[H0.id] = (m.ecoutees[H0.id] || 0) + 1; sauver();
      vider(); bip("fin"); pluie(H0.image);
      ajoute(racine, barre(titre),
        h("section", { class: "feuille" }, h("p", { class: "bravo" }, "Bravo, histoire finie !"), h("div", { class: "image" }, H0.image),
          h("div", { class: "ligne" }, h("button", { class: "btn plein", onclick: bibliotheque }, ic("mots"), "Une autre histoire"),
            h("button", { class: "btn", onclick: () => histoire(H0) }, ic("encore"), "La réécouter")),
          lienImprimer("ecoute/" + H0.id + ".pdf", "Imprimer les images à découper", "btn discret")));

  // Un mélange qui ne laisse jamais les images déjà dans l'ordre.
  function melangerSauf(l) {

  // ---------- Des phrases à écouter : la voix dit, l'enfant choisit l'image ----------

    question() {

      if (!f) return null;

      const bonne = cartes.findIndex(c => c.ok);

        reponse: bonne, cle: "phrase:" + f.modele, dire: f.texte, choix: cartes.map((c, i) => i), format: "entendue", texte: f.texte,

  rubrique({ id: "ecoute", onglet: "lire", section: "Les histoires", ordre: 20, titre: "J'écoute une histoire", icone: "ecoute",

        lienImprimer("ecoute/histoires-a-raconter.pdf", "Les huit pages d'un coup", "btn discret"));

    } });
  pointEtape(DOM, "Comprendre des phrases entendues", suite => jouerSerie(ENTENDUES, { n: 5, evaluation: true, finir: suite }));

  Cmp.ecoute = { ENTENDUES, histoire, bibliotheque, phrases, typo };
})();

// ---------- J'entends : jouer avec les sons des mots, à l'oral ----------
// Aucune lettre à l'écran : la voix dit le mot, l'image le montre, l'adulte dit le son.
// La voix ne dit jamais un son seul (elle dirait le nom de la lettre) : elle parle du « son du
// serpent », le mot-repère de la classe, dont l'image est dans la pastille du son.
(() => {
  const VOY = new Set(["a", "i", "o", "é", "è", "e", "u", "ou", "on", "an", "in", "eu", "oi"]);
  const PHONEMES = new Set(["a", "i", "r", "o", "l", "é", "u", "s", "f", "e", "m", "ch", "ou", "n", "p", "t", "on", "v", "d",
    "an", "j", "b", "k", "oi", "è", "z", "g", "in", "eu", "gn", "ill"]);
  // Un son vu sous une autre graphie : « au » est le son o, « qu » le son k…
  const MEME_SON = { au: "o", ai: "è", er: "é", qu: "k", gu: "g", "ç": "s", ge: "j", ph: "f" };
  // Des sons trop proches pour qu'une réponse « je ne l'entends pas » soit sûre.
  const PROCHES = { e: ["eu"], eu: ["e"], "é": ["è"], "è": ["é"], a: ["oi"], ou: ["oi"], oi: ["a", "ou"], i: ["ill"], ill: ["i"], n: ["gn"], gn: ["n"] };
  const PAIRES = [["p", "b"], ["t", "d"], ["k", "g"], ["f", "v"], ["s", "z"], ["ch", "j"]];
  const paire = s => { const p = PAIRES.find(x => x.includes(s)); return p ? p.find(y => y !== s) : null; };

  const MOTS_E = ENTENDRE_MOTS.trim().split("\n").map(l => l.trim()).filter(l => l && l[0] !== "#").map(l => {
    const [mot, e, syl, sons, dr = ""] = l.split("|").map(x => x.trim());
    const parSyl = sons.split("/").map(s => s.trim().split(/\s+/));
    const ph = parSyl.flat();
    const iv = ph.map(s => VOY.has(s)).lastIndexOf(true);
    ph.forEach(s => { if (!PHONEMES.has(s)) console.warn("entendre : son inconnu « " + s + " » dans " + mot); });
    return { mot, e, syl: syl.split("-"), parSyl, ph, rime: ph.slice(iv).join(" "), voyelleFin: ph[iv], dr };
  });
  const moitie = t => { const [x, e] = t.split(":"); return { t: x, e: e || null }; };
  const COUPER = ENTENDRE_COUPER.trim().split("\n").map(l => { const [mot, e, a, b, seul] = l.trim().split("|"); return { mot, e, a: moitie(a), b: moitie(b), seul: seul === "1" }; });
  const PREMIER = ENTENDRE_SANS_PREMIER.trim().split("\n").map(l => {
    const [mot, e, reste, f1, f2] = l.trim().split("|"); return { mot, e, reste: moitie(reste), faux: [moitie(f1), moitie(f2)] };
  });

  // ----- le choix des sons et des mots -----
  const a = (w, s) => w.ph.includes(s);
  const nb = (w, s) => w.ph.filter(x => x === s).length;
  const proche = (w, s) => (PROCHES[s] || []).some(p => w.ph.includes(p)) || ((s === "é" || s === "è") && w.dr.includes("x"));
  const focusSon = () => MEME_SON[etat.focus] || etat.focus;
  function sonsCibles() {
    const vus = [...new Set(etat.sons.map(s => MEME_SON[s] || s))].filter(s => PHONEMES.has(s));
    return vus.length >= 2 ? vus : ["a", "i", "o", "u", "l", "r", "s", "m"];
  }
  // Un son vu en classe ; celui de la semaine revient plus souvent, le e de « cheval » moins.
  function tirerSon(possible) {
    const l = sonsCibles().filter(possible);
    if (!l.length) return null;
    return tirer(l, 1, s => (s === focusSon() ? 4 : 1) * (s === "e" ? 0.5 : 1))[0];
  }
  const recents = [];
  function choisir(liste) {
    const w = tirer(liste, 1, x => recents.includes(x.mot) ? 0.05 : 1)[0];
    if (w) { recents.push(w.mot); if (recents.length > 14) recents.shift(); }
    return w;
  }
  function duRepere(id) {
    const m = SON[id].rep.match(/^(un|une|le|la|du)\s+(.*)$/);
    const art = m ? m[1] : "", nom = m ? m[2] : SON[id].rep;
    if (/^[aeiouéèêîô]/i.test(nom)) return "de l'" + nom;
    return art === "une" || art === "la" ? "de la " + nom : "du " + nom;
  }
  const liste = mots => mots.slice(0, -1).join(", ") + " ou " + mots[mots.length - 1];

  // ----- ce qu'on montre -----
  ICONES["entendre-arcs"] = '<path d="M2 12c2.5 4.5 6.5 4.5 9 0M13 12c2.5 4.5 6.5 4.5 9 0"/><path d="M6.5 7h.01M17.5 7h.01"/>';
  ICONES["entendre-rime"] = '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>';
  ICONES["entendre-ciseaux"] = '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>';
  ICONES["entendre-croix"] = '<path d="M6 6l12 12M18 6 6 18"/>';
  ICONES["entendre-bulle"] = '<path d="M4 5h16v11H10l-5 4v-4H4z"/>';

  const image = w => h("button", { class: "entendre-image", "aria-label": "Réécouter le mot, lentement", title: "Touchez pour réentendre le mot", onclick: () => Voix.dire(w.mot, true) }, w.e);
  const pastille = id => h("div", { class: "entendre-son", role: "img", "aria-label": "Le son " + duRepere(id), title: "Le son " + duRepere(id) },
    ic("oreille"), h("span", { class: "entendre-rep" }, SON[id].e));
  // Trois réponses : une image, ou une bulle quand le mot n'a pas d'image ; le haut-parleur la fait entendre.
  function cartes(opts, repondre) {
    return h("div", { class: "entendre-cartes" }, opts.map((o, i) => h("div", { class: "entendre-carte" },
      h("button", { class: "entendre-choix" + (o.e ? "" : " bulle b" + i), "aria-label": "Réponse " + (i + 1), onclick: ev => repondre(o.v, ev.currentTarget) },
        o.e || ic("entendre-bulle")),
      Voix.dispo() ? h("button", { class: "entendre-ecoute", "aria-label": "Écouter la réponse " + (i + 1), onclick: () => Voix.dire(o.dit) }, ic("haut")) : null)));
  }
  // Sans voix, l'adulte dit les réponses : on les lui écrit, dans l'ordre.
  const sansVoix = mots => Voix.dispo() ? "" : " Dites les réponses dans l'ordre : " + mots.join(", ") + ".";
  const dire = w => majuscule(w.mot) + ".";

  // ----- les six jeux, du plus facile au plus difficile -----
  const JEUX = [];
  const jeu = (def, court) => { const d = serie(Object.assign({ domaine: "phonemes", n: 8 }, def)); d.court = court; JEUX.push(d); return d; };

  jeu({ id: "entendre-syllabes", titre: "Combien de syllabes ?", icone: "entendre-arcs",
    conseil: ["Elle dit le mot en frappant dans ses mains à chaque syllabe, puis touche le nombre de coups.",
      "Dites le mot avec elle, lentement mais sans le déformer : « la… pin », deux coups.",
      "Les mots qui finissent par un e muet (pomme, tomate) ne sont pas posés : selon l'accent, on y entend une syllabe de plus.",
      "L'image se touche : la voix redit le mot, lentement."],
    question(k) {
      const permis = k < 2 ? [1, 2] : k < 4 ? [1, 2, 3] : [1, 2, 3, 4];
      const pool = MOTS_E.filter(w => !w.dr.includes("e") && permis.includes(w.syl.length));
      const n = hasard([...new Set(pool.map(w => w.syl.length))]);
      const w = choisir(pool.filter(x => x.syl.length === n));
      let marques;
      return { reponse: n, cle: "syllabes", dire: dire(w) + " Combien de syllabes ? Frappe dans tes mains.",
        astuce: "Elle dit le mot en frappant une fois par syllabe, puis touche le nombre de coups. Le bouton 👏 l'aide à compter.",
        rendre(feuille, repondre) {
          marques = h("div", { class: "entendre-marques", "aria-live": "polite" });
          let coups = 0;
          const taper = h("button", { class: "entendre-mains", "aria-label": "Je frappe une syllabe", onclick: () => {
            coups = coups >= 5 ? 1 : coups + 1;
            marques.replaceChildren(...Array.from({ length: coups }, () => h("span", { class: "apparait" }, "👏")));
          } }, "👏");
          ajoute(feuille, h("p", { class: "consigne" }, "Combien de syllabes ?"), image(w),
            h("div", { class: "entendre-frappe" }, taper, marques),
            h("div", { class: "pave", style: "grid-template-columns:repeat(4,minmax(0,76px))" },
              [1, 2, 3, 4].map(v => h("button", { class: "chiffre", onclick: e => repondre(v, e.currentTarget) }, v))));
        },
        apres() {
          marques.replaceChildren(...w.syl.map((_, i) => h("span", { class: "entendre-point apparait", style: "animation-delay:" + i * 0.35 + "s" })));
          Voix.dire(w.mot, true);
        } };
    } }, "Je frappe les syllabes");

  jeu({ id: "entendre-son", titre: "J'entends ou je n'entends pas", icone: "oreille",
    conseil: ["Dites le son vous-même, tenu s'il peut l'être (« ssss »), puis le mot, lentement : la voix ne sait dire que des mots.",
      "La pastille montre l'image du son, comme sur les cartes de la classe : « le son du serpent ».",
      "Si elle hésite, faites-lui redire le mot en étirant chaque son : « llllaaaa-pin »."],
    question(k) {
      const T = tirerSon(s => MOTS_E.some(w => a(w, s)) && MOTS_E.some(w => !a(w, s) && !proche(w, s)));
      const oui = Math.random() < 0.5;
      const pool = MOTS_E.filter(w => w.e !== SON[T].e && !proche(w, T) && (oui ? a(w, T)
        : !a(w, T) && !proche(w, T) && (k >= 4 || !a(w, paire(T))) && !(T === "e" && w.dr.includes("e"))));
      const w = choisir(pool);
      return { reponse: oui, cle: "entends:" + T, dire: dire(w) + " Est-ce que tu entends le son " + duRepere(T) + " dans " + w.mot + " ?",
        astuce: "Dites le son : " + SON[T].dire + " Puis le mot. Elle répond en touchant un bouton.",
        rendre(feuille, repondre) {
          ajoute(feuille, h("p", { class: "consigne" }, "Est-ce que tu entends ce son ?"),
            h("div", { class: "entendre-duo" }, pastille(T), image(w)),
            h("div", { class: "entendre-ouinon" },
              h("button", { class: "entendre-oui", onclick: e => repondre(true, e.currentTarget) }, h("span", { class: "entendre-ics" }, ic("oreille"), ic("ok")), "Je l'entends"),
              h("button", { class: "entendre-non", onclick: e => repondre(false, e.currentTarget) }, h("span", { class: "entendre-ics" }, ic("oreille"), ic("entendre-croix")), "Je ne l'entends pas")));
        },
        aide() { Voix.dire(w.mot, true); } };
    } }, "Le son est-il dans le mot ?");

  // Les trois wagons : début, milieu, fin. Le milieu n'est demandé que dans un mot d'au moins
  // trois syllabes, le son dans une syllabe du milieu : ainsi la réponse est la même qu'on
  // pense en sons ou en syllabes.
  function places(s) {
    const ok = w => nb(w, s) === 1 && !proche(w, s) && w.e !== SON[s].e;
    return {

  const NOMS = { carre: "le carré", rectangle: "le rectangle", triangle: "le triangle", cercle: "le cercle", pentagone: "la forme à cinq côtés", hexagone: "la forme à six côtés" };

  const tourner = (pts, deg) => { const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return pts.map(([x, y]) => [50 + x * c - y * s, 50 + x * s + y * c]); };

  function dessinForme(f) {

  }
  const forme = (f, teinte) => svgEl("0 0 100 100", "formes-forme " + teinte, dessinForme(f), NOMS[f]);
  const sFormes = serie({ id: "formes-formes", titre: "Les formes", icone: "c-formes", domaine: "geometrie", n: 8,
    conseil: tys(["Un carré penché reste un carré : quatre côtés de même longueur, quatre coins droits.",
      "Le rectangle a quatre coins droits, deux grands côtés et deux petits. Le triangle a trois côtés, même quand il est penché ou très pointu.",
      "Pour compter les côtés, elle pose le doigt sur un coin et fait le tour, en comptant chaque côté une seule fois."]),
    question(k) {
      if (k % 3 === 2) {     // combien de côtés ?
        const f = hasard(["triangle", "carre", "rectangle", "pentagone", "hexagone"]);
        return { reponse: COTES[f], cle: "formes-cotes", dire: "Combien de côtés a cette forme ?",
          rendre(feuille, repondre) { ajoute(feuille, h("p", { class: "consigne" }, ty("Combien de côtés ?")), h("div", { class: "formes-une" }, forme(f, hasard(TEINTES))), pave(2, 6, repondre)); },

        },
        apres() { Voix.dire("Voilà " + NOMS[cible] + "."); } };
    }
  });

  // ----- 2. Reproduire un motif sur un quadrillage -----
  function motif(n, taille) {
    for (;;) {
      const pris = new Set([entier(0, n * n - 1)]);
      while (pris.size < taille) {
        const voisins = [];
        pris.forEach(c => { const x = c % n, y = Math.floor(c / n); [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < n && Y < n && !pris.has(Y * n + X)) voisins.push(Y * n + X); }); });
        pris.add(hasard(voisins));
      }
      // pas une simple ligne droite : on veut une forme
      const xs = new Set([...pris].map(c => c % n)), ys = new Set([...pris].map(c => Math.floor(c / n)));
      if (xs.size > 1 && ys.size > 1) return pris;
    }
  }
  const cleMotif = s => [...s].sort((a, b) => a - b).join(",");
  function grille(n, plein, toucher) {
    const cases = [];
    const el = h("div", { class: "formes-grille" + (toucher ? " formes-jeu" : ""), style: "grid-template-columns:repeat(" + n + ",1fr);grid-template-rows:repeat(" + n + ",1fr)" },
      Array.from({ length: n * n }, (_, i) => { const c = h(toucher ? "button" : "span", { class: "formes-case" + (plein.has(i) ? " plein" : ""), "aria-label": toucher ? "case " + (Math.floor(i / n) + 1) + "-" + (i % n + 1) : null, onclick: toucher ? () => toucher(i, c) : null }); cases[i] = c; return c; }));

  }
  const sQuadrillage = serie({ id: "formes-quadrillage", titre: "Le quadrillage", icone: "c-quadrillage", domaine: "geometrie", n: 5,
    conseil: tys(["Elle colorie les mêmes cases que le modèle en les touchant ; toucher à nouveau une case l'efface.",
      "Pour se repérer, elle compte depuis un bord : « deux cases depuis le haut, une case depuis la gauche ».",
      "Sur la feuille imprimée, c'est la même chose au crayon, en vrai : c'est là que le repérage se fixe."]),

            repondre(v, fini);

            h("div", { class: "formes-deux" }, h("figure", null, grille(n, cible), h("figcaption", null, "le modèle")), h("figure", null, travail, h("figcaption", null, "à toi"))),
            fini, lienPapier("quadrillage"));
        },
        apres(juste) { if (!juste) travail.cases.forEach((c, i) => { c.classList.toggle("plein", cible.has(i)); c.classList.remove("faux"); }); Voix.dire(juste ? "C'est le même motif !" : "Voilà le motif."); },
        aide() { Voix.dire("Les cases marquées ne sont pas comme le modèle."); }

  });

  // ----- 3. Guider un robot : le programme d'abord, puis il s'exécute -----
  const DIRS = { haut: { dx: 0, dy: -1, rot: 0, dit: "en haut" }, droite: { dx: 1, dy: 0, rot: 90, dit: "à droite" }, bas: { dx: 0, dy: 1, rot: 180, dit: "en bas" }, gauche: { dx: -1, dy: 0, rot: -90, dit: "à gauche" } };
  const ORDRE_DIRS = ["gauche", "haut", "bas", "droite"];
  function fleche(d, cls) { const s = ic("c-fleche"); s.style.transform = "rotate(" + DIRS[d].rot + "deg)"; return h("span", { class: cls || "formes-pas" }, s); }
  function chemin(n, depart, but, murs) {      // le plus court chemin, ou null
    const prec = new Map([[depart, null]]), file = [depart];
    while (file.length) {
      const c = file.shift();
      if (c === but) { const ch = []; let x = c; while (prec.get(x) != null) { ch.unshift(x); x = prec.get(x); } return ch; }
      const x = c % n, y = Math.floor(c / n);
      Object.values(DIRS).forEach(D => { const X = x + D.dx, Y = y + D.dy, v = Y * n + X; if (X >= 0 && Y >= 0 && X < n && Y < n && !murs.has(v) && !prec.has(v)) { prec.set(v, c); file.push(v); } });
    }
    return null;
  }
  function executer(n, depart, murs, prog) {     // les cases parcourues, et où ça s'arrête
    let c = depart; const pas = [];
    for (const d of prog) {

      c = v; pas.push(c);

  const sRobot = serie({ id: "formes-robot", titre: "Le robot", icone: "c-robot", domaine: "geometrie", n: 5,
    conseil: tys(["Elle écrit tout le programme avec les flèches, puis touche « Go » : le robot avance une case par flèche.",
      "S'il se trompe, le programme reste : elle efface la fin et corrige, sans tout recommencer. Chercher l'erreur, c'est le cœur de la programmation.",
      "Les flèches ne tournent pas avec le robot : la flèche du haut le fait toujours monter vers le haut de l'écran.",
      "Sans écran : un quadrillage tracé à la craie au sol, une peluche pour robot, et des cartes-flèches posées en file."]),
    question(k) {

        rendre(feuille, repondre) {

          placerRobot(depart);
          bandeProg = h("div", { class: "formes-prog", "aria-live": "polite" });
          touches = h("div", { class: "formes-touches" },
            ORDRE_DIRS.map(d => h("button", { class: "formes-touche", "aria-label": "Flèche " + DIRS[d].dit, onclick: () => { if (prog.length < 14) { prog.push(d); dessinerProg(); } } }, fleche(d, "formes-fl"))),
            h("button", { class: "formes-touche efface", "aria-label": "Effacer la dernière flèche", onclick: () => { prog.pop(); dessinerProg(); } }, ic("c-efface")));
          go = h("button", { class: "btn plein", onclick: () => {
            if (!prog.length || touches.classList.contains("occupe")) return;
            touches.classList.add("occupe"); go.disabled = true;
            g.cases.forEach(x => x.classList.remove("trace", "aide", "boum"));
            const r = executer(n, depart, murs, prog);

            const pasSuivant = () => {
              if (i < r.pas.length) { const c = r.pas[i]; g.cases[c].classList.add("trace"); placerRobot(c); bandeProg.children[i] && bandeProg.children[i].classList.add("fait"); i++; return setTimeout(pasSuivant, 420); }
              if (r.bloque) g.cases[r.fin].classList.add("boum");
              const bon = !r.bloque && r.fin === but;

              if (!bon && !evaluation) setTimeout(() => {    // on revient au départ ; le programme reste, pour le corriger

        apres(juste) { if (juste) { g.cases[but].classList.add("trouve"); Voix.dire("Bravo, le trésor !"); } else court.forEach(c => g.cases[c].classList.add("aide")); },

  });

  // ----- 4. Les suites logiques -----
  const FORMES_J = { rond: '<circle cx="20" cy="20" r="15"/>', carre: '<rect x="6" y="6" width="28" height="28" rx="3"/>', triangle: '<path d="M20 4 36 34H4z"/>', etoile: '<path d="M20 3l4.9 10.4 11.3 1.3-8.4 7.7 2.3 11.2L20 28l-10.1 5.6 2.3-11.2-8.4-7.7 11.3-1.3z"/>' };
  const TEINTES_J = ["rouge", "bleu", "vert", "jaune"];
  const jeton = (j, cls) => svgEl("0 0 40 40", "formes-jeton formes-j-" + j.c + (cls ? " " + cls : ""), FORMES_J[j.f], j.c + " " + j.f);
  const MOTIFS = [["AB", [0, 1]], ["AAB", [0, 0, 1]], ["ABB", [0, 1, 1]], ["ABC", [0, 1, 2]], ["AABB", [0, 0, 1, 1]]];
  const sSuites = serie({ id: "formes-suites", titre: "Les suites", icone: "c-suite", domaine: "geometrie", n: 8,

      const long = Math.max(7, mot.length * 2 + 1), suite = Array.from({ length: long + 1 }, (_, i) => alpha[mot[i % mot.length]]);
      const milieu = k >= 4 && Math.random() < 0.5, trou = milieu ? entier(mot.length, long - 1) : long;

      const choix = melanger([bonne, ...tirer([...vus.values()].filter(j => cleJ(j) !== cleJ(bonne)), 2)]);
      return { reponse: cleJ(bonne), cle: "suites:" + nom, dire: milieu ? "Qu'est-ce qui manque dans la suite ?" : "Qu'est-ce qui vient après ?",
        rendre(feuille, repondre) {
          ajoute(feuille, h("p", { class: "consigne" }, ty(milieu ? "Qu'est-ce qui manque ?" : "Qu'est-ce qui vient après ?")),
            h("div", { class: "formes-suite" }, suite.slice(0, milieu ? long : long + 1).map((j, i) => i === trou ? h("span", { class: "formes-trou" }, "?") : jeton(j))),
            h("div", { class: "formes-choix-j" }, choix.map(j => h("button", { "aria-label": j.c + " " + j.f, onclick: e => repondre(cleJ(j), e.currentTarget) }, jeton(j)))));
        },
        apres() { Voix.dire("La suite recommence toujours de la même façon."); },
        aide() { Voix.dire("Dis la suite à voix haute, depuis le début."); }
      };
    }
  });

  // ----- le papier -----
  const PAPIER = { quadrillage: ["geometrie/quadrillages.pdf", "Des quadrillages à reproduire au crayon"], regle: ["geometrie/regle-et-traits.pdf", "La règle en carton et des traits à mesurer"] };

  // ----- l'écran du module -----
  const JEUX = [

  }

  function menu() {
    ecran = ID; seance = null; evaluation = false; vider();
    const adulte = h("div", { class: "adulte" });
    ajoute(racine, barre("Formes et repères"),

      })), adulte);

      lienImprimer(PAPIER.quadrillage[0], "Les quadrillages", "btn")]);
  }
  rubrique({ id: ID, onglet: "compter", section: "Mesurer et se repérer", ordre: 20, titre: "Formes et repères", icone: "c-formes",
    court: "Formes, quadrillage, robot, suites", ouvrir: menu,
    seance: suite => jouerSerie(hasard([sFormes, sSuites, sRobot]), { n: 3, finir: suite }) });

  const DOCS = [
    ["geometrie/quadrillages.pdf", "Les quadrillages", "Des motifs à reproduire case par case, du plus petit au plus grand, avec un crayon de couleur."],
    ["geometrie/regle-et-traits.pdf", "La règle et les traits", "Deux règles de 15 cm à découper dans du carton, et des traits à mesurer. À imprimer en taille réelle : la règle est vérifiée au millimètre."]
  ];
  rubrique({ id: "imprimer-geometrie", onglet: "compter", section: "À imprimer", ordre: 40, titre: "Mesurer et reproduire", icone: "imprimer",
    court: "Quadrillages, règle en carton et traits à mesurer",
    ouvrir: () => {
      ecran = "papier"; seance = null; vider();
      ajoute(racine, barre("Mesurer et reproduire"),
        h("div", { class: "reglages" },
          h("section", { class: "bloc" }, h("p", null, ty("Des fiches à faire au crayon. Imprimez en taille réelle (100 %), sans « ajuster à la page » : la règle et les traits sont en vrais centimètres."))),
          DOCS.map(([f, t, d]) => h("section", { class: "bloc" }, h("h2", null, t), h("p", null, ty(d)), h("div", { class: "ligne" }, lienImprimer(f, "Ouvrir le PDF"))))));
    } });

  const st = document.createElement("style");
